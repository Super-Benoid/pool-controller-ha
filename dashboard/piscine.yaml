################################################################################
# Pool Controller Home Assistant (PCHA)
# Dashboard V2.0 — Concept D
# Cartes natives Home Assistant, sans dépendance HACS.
################################################################################

title: PCHA — Piscine

views:
  - title: Accueil
    path: accueil
    icon: mdi:home-outline
    theme: "PCHA Concept D"
    type: masonry
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pcha_niveau_fonctionnement
            state: CRITIQUE
        card:
          type: markdown
          theme: "PCHA Concept D Alert"
          content: |
            # ⚠️ Niveau CRITIQUE
            La filtration est interdite. Consulte immédiatement l’onglet **Diagnostics**.

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pcha_niveau_fonctionnement
            state: DEGRADE
        card:
          type: markdown
          theme: "PCHA Concept D Alert"
          content: |
            ## ⚠️ Fonctionnement dégradé
            Une anomalie est active. Le système applique sa stratégie de secours.

      - type: markdown
        content: |
          # PCHA — Piscine
          **Concept D · supervision temps réel**

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: input_select.pcha_mode_de_fonctionnement
            name: Mode
            icon: mdi:alpha-a-circle-outline
            color: cyan
            features_position: inline
            features:
              - type: select-options
          - type: tile
            entity: input_select.pcha_etat_machine
            name: Machine
            icon: mdi:state-machine
            color: cyan
          - type: tile
            entity: input_select.pcha_niveau_fonctionnement
            name: Niveau
            icon: mdi:waves
            color: green
          - type: tile
            entity: switch.pcha_commande_pompe_filtration
            name: Pompe
            icon: mdi:water-pump
            color: green
            features_position: inline
            features:
              - type: toggle

      - type: markdown
        content: |
          ## Mesures en direct
          Valeurs actuelles et historique détaillé des dernières 24 heures.

      - type: grid
        columns: 4
        square: false
        cards:
          - type: vertical-stack
            cards:
              - type: sensor
                entity: sensor.pcha_temperature_piscine
                name: Température bassin
                icon: mdi:thermometer-water
                graph: line
                detail: 2
                hours_to_show: 24
                theme: "PCHA Concept D Cyan"
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: statistic
                    entity: sensor.pcha_temperature_piscine
                    name: Minimum 24 h
                    icon: mdi:thermometer-chevron-down
                    stat_type: min
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Cyan"
                  - type: statistic
                    entity: sensor.pcha_temperature_piscine
                    name: Maximum 24 h
                    icon: mdi:thermometer-chevron-up
                    stat_type: max
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Cyan"

          - type: vertical-stack
            cards:
              - type: sensor
                entity: sensor.pcha_luminosite
                name: Luminosité
                icon: mdi:white-balance-sunny
                graph: line
                detail: 2
                hours_to_show: 24
                theme: "PCHA Concept D Purple"
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: statistic
                    entity: sensor.pcha_luminosite
                    name: Minimum 24 h
                    icon: mdi:weather-sunset-down
                    stat_type: min
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Purple"
                  - type: statistic
                    entity: sensor.pcha_luminosite
                    name: Maximum 24 h
                    icon: mdi:weather-sunny
                    stat_type: max
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Purple"

          - type: vertical-stack
            cards:
              - type: sensor
                entity: sensor.pcha_debit_filtration
                name: Débit filtration
                icon: mdi:waves-arrow-right
                graph: line
                detail: 2
                hours_to_show: 24
                theme: "PCHA Concept D Cyan"
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: statistic
                    entity: sensor.pcha_debit_filtration
                    name: Minimum 24 h
                    icon: mdi:arrow-down-bold-circle-outline
                    stat_type: min
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Cyan"
                  - type: statistic
                    entity: sensor.pcha_debit_filtration
                    name: Maximum 24 h
                    icon: mdi:arrow-up-bold-circle-outline
                    stat_type: max
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Cyan"

          - type: vertical-stack
            cards:
              - type: sensor
                entity: sensor.pcha_puissance_pompe_filtration
                name: Puissance pompe
                icon: mdi:flash
                graph: line
                detail: 2
                hours_to_show: 24
                theme: "PCHA Concept D Purple"
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: statistic
                    entity: sensor.pcha_puissance_pompe_filtration
                    name: Minimum 24 h
                    icon: mdi:lightning-bolt-outline
                    stat_type: min
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Purple"
                  - type: statistic
                    entity: sensor.pcha_puissance_pompe_filtration
                    name: Maximum 24 h
                    icon: mdi:lightning-bolt
                    stat_type: max
                    period:
                      rolling_window:
                        duration:
                          hours: 24
                    theme: "PCHA Concept D Purple"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.pcha_progression_objectif_quotidien
            name: Progression objectif quotidien
            min: 0
            max: 100
            needle: false
            severity:
              red: 0
              yellow: 35
              green: 75
            theme: "PCHA Concept D Purple"
          - type: markdown
            title: Objectif quotidien
            entity_id:
              - sensor.pcha_objectif_filtration_quotidien
              - sensor.pcha_temps_filtration_realise
              - sensor.pcha_temps_filtration_restant
              - sensor.pcha_heure_atteinte_objectif
              - sensor.pcha_temperature_reference_objectif_quotidien
              - binary_sensor.pcha_objectif_filtration_fige
            content: |
              {% set objectif = ((states('sensor.pcha_objectif_filtration_quotidien') | float(0)) * 60) | round(0) | int %}
              {% set realise = states('sensor.pcha_temps_filtration_realise') | float(0) | round(0) | int %}
              {% set restant = states('sensor.pcha_temps_filtration_restant') | float(0) | round(0) | int %}
              {% set reference = states('sensor.pcha_temperature_reference_objectif_quotidien') %}
              {% set statut = 'Figée' if is_state('binary_sensor.pcha_objectif_filtration_fige', 'on') else 'Provisoire' %}
              {% set atteint_brut = states('sensor.pcha_heure_atteinte_objectif') %}
              {% set atteint = 'Indisponible' if atteint_brut in ['unknown', 'unavailable', 'none', ''] else atteint_brut %}

              | Indicateur | Valeur |
              |:--|--:|
              | 🎯 Objectif | **{{ '%02dH%02d' | format(objectif // 60, objectif % 60) }}** |
              | 🌡️ Référence {{ statut }} | **{{ (reference | float(0) | round(1) ~ ' °C') if is_number(reference) else 'Indisponible' }}** |
              | ✅ Temps réalisé | **{{ '%02dH%02d' | format(realise // 60, realise % 60) }}** |
              | ⏳ Temps restant | **{{ '%02dH%02d' | format(restant // 60, restant % 60) }}** |
              | 🕘 Atteint à | **{{ atteint }}** |

      - type: markdown
        content: |
          ## Réglages rapides

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: input_select.pcha_mode_de_fonctionnement
            name: Mode de fonctionnement
            icon: mdi:cog-play-outline
            color: cyan
            features:
              - type: select-options
          - type: tile
            entity: input_number.pcha_temperature_de_consigne
            name: Consigne bassin
            icon: mdi:thermometer-plus
            color: cyan
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.pcha_seuil_luminosite_chauffage
            name: Seuil solaire
            icon: mdi:white-balance-sunny
            color: purple
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_boolean.pcha_acquitter_alarmes
            name: Acquitter alarmes
            icon: mdi:alarm-check
            color: red
            features:
              - type: toggle

      - type: history-graph
        title: Activité récente — 24 heures
        hours_to_show: 24
        entities:
          - entity: switch.pcha_commande_pompe_filtration
            name: Pompe
            color: "#20E3E3"
          - entity: binary_sensor.pcha_chauffage_solaire_actif
            name: Chauffage solaire
            color: "#A36CFF"
          - entity: input_select.pcha_etat_machine
            name: Machine
          - entity: input_select.pcha_niveau_fonctionnement
            name: Niveau

  - title: Pilotage
    path: pilotage
    icon: mdi:tune-variant
    theme: "PCHA Concept D"
    type: masonry
    cards:
      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: binary_sensor.pcha_filtration_requise
            name: Filtration requise
            icon: mdi:water-check
            color: cyan
          - type: tile
            entity: binary_sensor.pcha_demande_fonctionnement
            name: Demande consolidée
            icon: mdi:play-circle-outline
            color: purple
          - type: tile
            entity: input_select.pcha_etat_machine
            name: État machine
            icon: mdi:state-machine
            color: cyan
          - type: tile
            entity: switch.pcha_commande_pompe_filtration
            name: Pompe
            icon: mdi:water-pump
            color: green
            features:
              - type: toggle

      - type: grid
        columns: 3
        square: false
        cards:
          - type: sensor
            entity: sensor.pcha_debit_filtration
            name: Débit filtration — 24 h
            graph: line
            detail: 2
            hours_to_show: 24
            theme: "PCHA Concept D Cyan"
          - type: sensor
            entity: sensor.pcha_puissance_pompe_filtration
            name: Puissance pompe — 24 h
            graph: line
            detail: 2
            hours_to_show: 24
            theme: "PCHA Concept D Purple"
          - type: tile
            entity: sensor.pcha_energie_pompe_quotidienne
            name: Énergie du jour
            icon: mdi:lightning-bolt
            color: purple

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: input_number.pcha_temps_marche_pompe_min
            name: Marche minimale
            icon: mdi:timer-play-outline
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.pcha_temps_arret_pompe_min
            name: Arrêt minimal
            icon: mdi:timer-stop-outline
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.pcha_temps_validation_debit
            name: Validation débit
            icon: mdi:timer-alert-outline
            features:
              - type: numeric-input
                style: buttons

      - type: markdown
        content: |
          ## Mode traitement
          Le mode **TRAITEMENT** lance une filtration temporisée puis revient automatiquement en **AUTO**.

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: input_select.pcha_mode_de_fonctionnement
            name: Mode actif
            icon: mdi:flask-outline
            features:
              - type: select-options
          - type: tile
            entity: input_number.pcha_duree_traitement
            name: Durée configurée
            icon: mdi:timer-edit-outline
            tap_action:
              action: more-info
            features:
              - type: numeric-input
                style: slider
          - type: tile
            entity: timer.pcha_traitement
            name: Timer traitement
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.pcha_temps_traitement_restant
            name: Temps restant
            icon: mdi:timer-sand

      - type: history-graph
        title: Filtration et traitement — 24 heures
        hours_to_show: 24
        entities:
          - entity: input_select.pcha_mode_de_fonctionnement
            name: Mode
          - entity: timer.pcha_traitement
            name: Traitement
          - entity: switch.pcha_commande_pompe_filtration
            name: Pompe

  - title: Solaire
    path: solaire
    icon: mdi:solar-power-variant-outline
    theme: "PCHA Concept D"
    type: masonry
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: sensor
            entity: sensor.pcha_temperature_piscine
            name: Température bassin — 24 h
            graph: line
            detail: 2
            hours_to_show: 24
            theme: "PCHA Concept D Cyan"
          - type: sensor
            entity: sensor.pcha_luminosite
            name: Luminosité — 24 h
            graph: line
            detail: 2
            hours_to_show: 24
            theme: "PCHA Concept D Purple"

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: binary_sensor.pcha_chauffage_solaire_requis
            name: Chauffage requis
            icon: mdi:solar-power
            color: purple
          - type: tile
            entity: binary_sensor.pcha_chauffage_solaire_actif
            name: Chauffage actif
            icon: mdi:solar-panel-large
            color: green
          - type: tile
            entity: binary_sensor.pcha_protection_serpentin_requise
            name: Protection serpentin
            icon: mdi:radiator-disabled
            color: red

      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.pcha_source_chauffage_solaire
            name: Source de pilotage
            icon: mdi:source-branch
            color: cyan
          - type: tile
            entity: sensor.pcha_ecart_temperature_exterieure_bassin
            name: Écart ext. / bassin
            icon: mdi:compare-vertical
            color: purple
          - type: tile
            entity: binary_sensor.pcha_liaison_luminosite_distante
            name: Liaison D1 mini / ESP32
            icon: mdi:access-point-network
            color: cyan
          - type: tile
            entity: binary_sensor.pcha_capteur_luminosite_distant_ok
            name: BH1750 distant
            icon: mdi:sun-wireless
            color: green

      - type: markdown
        title: Bilan solaire du jour
        entity_id:
          - sensor.pcha_temps_luminosite_superieure_seuil_jour
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - input_number.pcha_seuil_luminosite_chauffage
        content: |
          {% set duree = states('sensor.pcha_temps_luminosite_superieure_seuil_jour') | float(0) | round(0) | int %}
          {% set moyenne = states('sensor.pcha_luminosite_moyenne_superieure_seuil_jour') | float(0) | round(0) | int %}
          {% set seuil = states('input_number.pcha_seuil_luminosite_chauffage') | float(0) | round(0) | int %}

          | Indicateur | Valeur |
          |:--|--:|
          | Temps au-dessus de **{{ seuil }} lx** | **{{ '%02dH%02d' | format(duree // 60, duree % 60) }}** |
          | Luminosité moyenne | **{{ moyenne }} lx** |

      - type: entities
        title: Réglages bassin et solaire
        show_header_toggle: false
        entities:
          - entity: sensor.pcha_temperature_piscine_brute
            name: Température brute bassin
          - entity: input_number.pcha_correction_temperature_piscine
            name: Calibrage signé
          - entity: input_number.pcha_temperature_de_consigne
            name: Consigne bassin
          - entity: input_number.pcha_seuil_luminosite_chauffage
            name: Seuil de luminosité
          - entity: input_number.pcha_temps_validation_luminosite
            name: Validation luminosité
          - entity: sensor.pcha_temperature_piscine_min_jour
            name: Minimum du jour
          - entity: sensor.pcha_temperature_piscine_max_jour
            name: Maximum du jour

      - type: history-graph
        title: Chauffage solaire — 24 heures
        hours_to_show: 24
        entities:
          - entity: binary_sensor.pcha_chauffage_solaire_requis
            name: Requis
          - entity: binary_sensor.pcha_chauffage_solaire_actif
            name: Actif
          - entity: binary_sensor.pcha_protection_serpentin_requise
            name: Protection

  - title: Diagnostics
    path: diagnostics
    icon: mdi:shield-alert-outline
    theme: "PCHA Concept D"
    type: masonry
    cards:
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_select.pcha_niveau_fonctionnement
            name: Niveau global
            icon: mdi:shield-check
            color: green
          - type: tile
            entity: input_boolean.pcha_acquitter_alarmes
            name: Acquitter les alarmes
            icon: mdi:alarm-check
            color: red
            features:
              - type: toggle

      - type: entities
        title: MES — Mesures
        icon: mdi:gauge-empty
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
            name: MES-001 — Température bassin indisponible
          - entity: binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
            name: MES-002 — Débit indisponible
          - entity: binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
            name: MES-003 — Puissance indisponible
          - entity: binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
            name: MES-004 — Luminosité distante indisponible
          - entity: binary_sensor.pcha_liaison_luminosite_distante
            name: Liaison Packet Transport
          - entity: binary_sensor.pcha_capteur_luminosite_distant_ok
            name: Capteur BH1750 distant

      - type: entities
        title: COH — Cohérence
        icon: mdi:compare-horizontal
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents
            name: COH-001 — Débit et puissance incohérents
          - entity: binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente
            name: COH-002 — Température bassin incohérente

      - type: entities
        title: PRO — Procédé
        icon: mdi:alert-octagon-outline
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.pcha_diagnostic_pro_001_debit_critique
            name: PRO-001 — Débit critique
          - entity: binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant
            name: PRO-002 — Débit insuffisant
          - entity: binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
            name: PRO-003 — Protection serpentin impossible

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: input_number.pcha_temps_validation_temperature_piscine
            name: Validation température
            icon: mdi:timer-alert-outline
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.pcha_temps_validation_debit
            name: Validation débit
            icon: mdi:timer-alert-outline
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: input_number.pcha_temps_validation_luminosite
            name: Validation luminosité
            icon: mdi:timer-alert-outline
            features:
              - type: numeric-input
                style: buttons

      - type: history-graph
        title: Historique des diagnostics — 24 heures
        hours_to_show: 24
        entities:
          - entity: input_select.pcha_niveau_fonctionnement
            name: Niveau global
          - entity: binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
            name: MES-004
          - entity: binary_sensor.pcha_diagnostic_pro_001_debit_critique
            name: PRO-001
          - entity: binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
            name: PRO-003

      - type: markdown
        content: |
          ## Historique Home Assistant
          - [Ouvrir l’activité](/logbook)
          - [Ouvrir l’historique](/history)
