################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-002 — Interface utilisateur
#
# Dashboard modernisé V1.1
################################################################################

title: PCHA — Piscine

views:
  - title: Accueil
    path: accueil
    icon: mdi:view-dashboard-outline
    type: masonry
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pcha_niveau_fonctionnement
            state: CRITIQUE
        card:
          type: markdown
          content: |
            # ⚠️ Niveau critique
            La filtration est interdite. Consulte immédiatement l’onglet **Diagnostics**.

      - type: conditional
        conditions:
          - condition: state
            entity: input_select.pcha_niveau_fonctionnement
            state: DEGRADE
        card:
          type: markdown
          content: |
            ## ⚠️ Fonctionnement dégradé
            Une anomalie est active. Le système continue partiellement en mode dégradé.

      - type: markdown
        content: |
          # PCHA — Cockpit
          Vue d’ensemble du système de filtration, du chauffage solaire et des objectifs quotidiens.

      - type: grid
        title: État système
        columns: 4
        square: false
        cards:
          - type: tile
            entity: input_select.pcha_mode_de_fonctionnement
            name: Mode
            icon: mdi:pool
          - type: tile
            entity: input_select.pcha_etat_machine
            name: Machine
            icon: mdi:state-machine
          - type: tile
            entity: input_select.pcha_niveau_fonctionnement
            name: Niveau
            icon: mdi:shield-check
          - type: tile
            entity: switch.pcha_commande_pompe_filtration
            name: Pompe
            icon: mdi:water-pump

      - type: grid
        title: Mesures en direct
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.pcha_temperature_piscine
            name: Température bassin
            icon: mdi:thermometer-water
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
          - type: tile
            entity: sensor.pcha_luminosite
            name: Luminosité
            icon: mdi:white-balance-sunny
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
          - type: tile
            entity: sensor.pcha_debit_filtration
            name: Débit filtration
            icon: mdi:waves-arrow-right
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
          - type: tile
            entity: sensor.pcha_puissance_pompe_filtration
            name: Puissance pompe
            icon: mdi:flash
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true

      - type: markdown
        title: Objectif quotidien
        card_size: 3
        entity_id:
          - sensor.pcha_objectif_filtration_quotidien
          - sensor.pcha_temps_filtration_realise
          - sensor.pcha_temps_filtration_restant
          - sensor.pcha_temperature_reference_objectif_quotidien
          - binary_sensor.pcha_objectif_filtration_fige
          - input_select.pcha_etat_machine
          - sun.sun
        content: |
          {% set objectif = ((states('sensor.pcha_objectif_filtration_quotidien') | float(0)) * 60) | round(0) | int %}
          {% set realise = states('sensor.pcha_temps_filtration_realise') | float(0) | round(0) | int %}
          {% set restant = states('sensor.pcha_temps_filtration_restant') | float(0) | round(0) | int %}
          {% set reference = states('sensor.pcha_temperature_reference_objectif_quotidien') %}
          {% set statut_reference = 'Figée' if is_state('binary_sensor.pcha_objectif_filtration_fige', 'on') else 'Provisoire' %}
          {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
          {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}

          {% if restant <= 0 %}
            {% set atteint = 'Atteint' %}
          {% elif is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
            {% set fin = now() + timedelta(minutes=restant) %}
            {% set atteint = fin.strftime('%H') ~ 'H' ~ fin.strftime('%M') %}
          {% elif coucher is not none and coucher.date() == now().date() %}
            {% set echeance = coucher - timedelta(hours=2) %}
            {% set depart_au_plus_tard = echeance - timedelta(minutes=restant) %}
            {% set fin = echeance if now() < depart_au_plus_tard else now() + timedelta(minutes=restant) %}
            {% set atteint = fin.strftime('%H') ~ 'H' ~ fin.strftime('%M') %}
          {% else %}
            {% set fin = now() + timedelta(minutes=restant) %}
            {% set atteint = fin.strftime('%H') ~ 'H' ~ fin.strftime('%M') %}
          {% endif %}

          | Élément | Valeur |
          |:--|--:|
          | <ha-icon icon="mdi:target"></ha-icon> Objectif | **{{ '%02dH%02d' | format(objectif // 60, objectif % 60) }}** |
          | <ha-icon icon="mdi:thermometer-check"></ha-icon> Référence ({{ statut_reference }}) | **{{ (reference | float(0) | round(1) ~ ' °C') if is_number(reference) else 'Indisponible' }}** |
          | <ha-icon icon="mdi:timer-check"></ha-icon> Temps réalisé | **{{ '%02dH%02d' | format(realise // 60, realise % 60) }}** |
          | <ha-icon icon="mdi:timer-sand"></ha-icon> Temps restant | **{{ '%02dH%02d' | format(restant // 60, restant % 60) }}** |
          | <ha-icon icon="mdi:clock-check-outline"></ha-icon> Atteint à | **{{ atteint }}** |

      - type: grid
        title: Réglages rapides
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_select.pcha_mode_de_fonctionnement
            name: Mode de fonctionnement
            icon: mdi:cog-play-outline
          - type: tile
            entity: input_number.pcha_temperature_de_consigne
            name: Consigne bassin
            icon: mdi:thermometer-plus
          - type: tile
            entity: input_number.pcha_seuil_luminosite_chauffage
            name: Seuil solaire
            icon: mdi:weather-sunny-alert
          - type: tile
            entity: input_boolean.pcha_acquitter_alarmes
            name: Acquitter alarmes
            icon: mdi:alarm-check

      - type: history-graph
        title: Activité — 24 heures
        hours_to_show: 24
        entities:
          - entity: switch.pcha_commande_pompe_filtration
            name: Pompe
          - entity: input_select.pcha_etat_machine
            name: Machine
          - entity: input_select.pcha_niveau_fonctionnement
            name: Niveau
          - entity: binary_sensor.pcha_chauffage_solaire_actif
            name: Chauffage solaire

  - title: Pilotage
    path: pilotage
    icon: mdi:tune-variant
    type: masonry
    cards:
      - type: grid
        title: Commande filtration
        columns: 2
        square: false
        cards:
          - type: tile
            entity: binary_sensor.pcha_filtration_requise
            name: Filtration requise
            icon: mdi:water-check
          - type: tile
            entity: binary_sensor.pcha_demande_fonctionnement
            name: Demande consolidée
            icon: mdi:play-circle-outline
          - type: tile
            entity: input_select.pcha_etat_machine
            name: État machine
            icon: mdi:state-machine
          - type: tile
            entity: switch.pcha_commande_pompe_filtration
            name: Pompe
            icon: mdi:water-pump

      - type: grid
        title: Performances
        columns: 3
        square: false
        cards:
          - type: tile
            entity: sensor.pcha_debit_filtration
            name: Débit
            icon: mdi:waves-arrow-right
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
          - type: tile
            entity: sensor.pcha_puissance_pompe_filtration
            name: Puissance
            icon: mdi:flash
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
          - type: tile
            entity: sensor.pcha_energie_pompe_quotidienne
            name: Énergie du jour
            icon: mdi:lightning-bolt

      - type: grid
        title: Temporisations AUTO
        columns: 3
        square: false
        cards:
          - type: tile
            entity: input_number.pcha_temps_marche_pompe_min
            name: Marche minimale
            icon: mdi:timer-play-outline
          - type: tile
            entity: input_number.pcha_temps_arret_pompe_min
            name: Arrêt minimal
            icon: mdi:timer-stop-outline
          - type: tile
            entity: input_number.pcha_temps_validation_debit
            name: Validation débit
            icon: mdi:timer-alert-outline

      - type: markdown
        content: |
          ## Mode traitement
          Sélectionne le mode **TRAITEMENT** pour lancer une filtration temporisée, puis retour automatique en **AUTO** à la fin du timer.

      - type: grid
        title: Traitement
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_number.pcha_duree_traitement
            name: Durée configurée
            icon: mdi:timer-edit-outline
          - type: tile
            entity: timer.pcha_traitement
            name: Timer traitement
            icon: mdi:timer-outline
          - type: tile
            entity: sensor.pcha_temps_traitement_restant
            name: Temps restant
            icon: mdi:timer-sand
          - type: tile
            entity: input_select.pcha_mode_de_fonctionnement
            name: Mode actif
            icon: mdi:flask-outline

      - type: history-graph
        title: Filtration et traitement — 24 heures
        hours_to_show: 24
        entities:
          - entity: input_select.pcha_mode_de_fonctionnement
            name: Mode
          - entity: timer.pcha_traitement
            name: Traitement
          - entity: switch.pcha_commande_pompe_filtration
            name: Pompe

  - title: Solaire
    path: solaire
    icon: mdi:solar-power-variant-outline
    type: masonry
    cards:
      - type: grid
        title: Températures
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.pcha_temperature_piscine
            name: Température bassin
            icon: mdi:thermometer-water
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
          - type: tile
            entity: sensor.pcha_temperature_exterieure
            name: Température extérieure
            icon: mdi:thermometer

      - type: grid
        title: Chaîne solaire
        columns: 2
        square: false
        cards:
          - type: tile
            entity: binary_sensor.pcha_chauffage_solaire_requis
            name: Chauffage requis
            icon: mdi:solar-power
          - type: tile
            entity: binary_sensor.pcha_chauffage_solaire_actif
            name: Chauffage actif
            icon: mdi:solar-panel-large
          - type: tile
            entity: binary_sensor.pcha_protection_serpentin_requise
            name: Protection serpentin
            icon: mdi:radiator-disabled
          - type: tile
            entity: sensor.pcha_source_chauffage_solaire
            name: Source de pilotage
            icon: mdi:source-branch
          - type: tile
            entity: sensor.pcha_ecart_temperature_exterieure_bassin
            name: Écart ext./bassin
            icon: mdi:compare-vertical
          - type: tile
            entity: input_number.pcha_seuil_luminosite_chauffage
            name: Seuil luminosité
            icon: mdi:tune

      - type: grid
        title: Luminosité distante
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.pcha_luminosite
            name: Luminosité
            icon: mdi:white-balance-sunny
            features:
              - type: trend-graph
                hours_to_show: 24
                detail: true
          - type: tile
            entity: binary_sensor.pcha_liaison_luminosite_distante
            name: Liaison D1 mini / ESP32
            icon: mdi:access-point-network
          - type: tile
            entity: binary_sensor.pcha_capteur_luminosite_distant_ok
            name: BH1750 distant
            icon: mdi:sun-wireless
          - type: tile
            entity: input_number.pcha_temps_validation_luminosite
            name: Validation luminosité
            icon: mdi:timer-alert-outline

      - type: markdown
        title: Bilan solaire du jour
        card_size: 3
        entity_id:
          - sensor.pcha_temps_luminosite_superieure_seuil_jour
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - input_number.pcha_seuil_luminosite_chauffage
        content: |
          {% set duree = states('sensor.pcha_temps_luminosite_superieure_seuil_jour') | float(0) | round(0) | int %}
          {% set moyenne = states('sensor.pcha_luminosite_moyenne_superieure_seuil_jour') | float(0) | round(0) | int %}
          {% set seuil = states('input_number.pcha_seuil_luminosite_chauffage') | float(0) | round(0) | int %}

          | Élément | Valeur |
          |:--|--:|
          | <ha-icon icon="mdi:sun-clock-outline"></ha-icon> Temps au-dessus de {{ seuil }} lx | **{{ '%02dH%02d' | format(duree // 60, duree % 60) }}** |
          | <ha-icon icon="mdi:sun-compass"></ha-icon> Luminosité moyenne | **{{ moyenne }} lx** |

      - type: entities
        title: Bassin
        icon: mdi:pool-thermometer
        show_header_toggle: false
        entities:
          - entity: sensor.pcha_temperature_piscine
            name: Température bassin calibrée
          - entity: sensor.pcha_temperature_piscine_brute
            name: Température brute bassin
          - entity: input_number.pcha_correction_temperature_piscine
            name: Calibrage signé
          - entity: input_number.pcha_temps_validation_temperature_piscine
            name: Validation diagnostic température
          - entity: sensor.pcha_temperature_piscine_min_jour
            name: Minimum du jour
          - entity: sensor.pcha_temperature_piscine_max_jour
            name: Maximum du jour

      - type: history-graph
        title: Solaire — 24 heures
        hours_to_show: 24
        entities:
          - entity: binary_sensor.pcha_chauffage_solaire_requis
            name: Chauffage requis
          - entity: binary_sensor.pcha_chauffage_solaire_actif
            name: Chauffage actif
          - entity: binary_sensor.pcha_protection_serpentin_requise
            name: Protection serpentin

  - title: Diagnostics
    path: diagnostics
    icon: mdi:shield-alert-outline
    type: masonry
    cards:
      - type: grid
        title: Synthèse
        columns: 2
        square: false
        cards:
          - type: tile
            entity: input_select.pcha_niveau_fonctionnement
            name: Niveau global
            icon: mdi:shield-check
          - type: tile
            entity: input_boolean.pcha_acquitter_alarmes
            name: Acquitter alarmes
            icon: mdi:alarm-check

      - type: entities
        title: Diagnostics MES — Mesures
        icon: mdi:gauge-empty
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
            name: MES-001 — Température bassin indisponible
          - entity: binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
            name: MES-002 — Débit indisponible
          - entity: binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
            name: MES-003 — Puissance indisponible
          - entity: binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
            name: MES-004 — Luminosité distante indisponible
          - entity: binary_sensor.pcha_liaison_luminosite_distante
            name: Liaison Packet Transport
          - entity: binary_sensor.pcha_capteur_luminosite_distant_ok
            name: Capteur BH1750 distant

      - type: entities
        title: Diagnostics COH — Cohérence
        icon: mdi:compare-horizontal
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents
            name: COH-001 — Débit et puissance incohérents
          - entity: binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente
            name: COH-002 — Température bassin incohérente

      - type: entities
        title: Diagnostics PRO — Procédé
        icon: mdi:alert-octagon-outline
        show_header_toggle: false
        state_color: true
        entities:
          - entity: binary_sensor.pcha_diagnostic_pro_001_debit_critique
            name: PRO-001 — Débit critique
          - entity: binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant
            name: PRO-002 — Débit insuffisant
          - entity: binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
            name: PRO-003 — Protection serpentin impossible

      - type: grid
        title: Délais de validation
        columns: 3
        square: false
        cards:
          - type: tile
            entity: input_number.pcha_temps_validation_temperature_piscine
            name: Température bassin
            icon: mdi:timer-alert-outline
          - type: tile
            entity: input_number.pcha_temps_validation_debit
            name: Débit
            icon: mdi:timer-alert-outline
          - type: tile
            entity: input_number.pcha_temps_validation_luminosite
            name: Luminosité
            icon: mdi:timer-alert-outline

      - type: history-graph
        title: Historique diagnostics — 24 heures
        hours_to_show: 24
        entities:
          - entity: input_select.pcha_niveau_fonctionnement
            name: Niveau global
          - entity: binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
            name: MES-004
          - entity: binary_sensor.pcha_diagnostic_pro_001_debit_critique
            name: PRO-001
          - entity: binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
            name: PRO-003

      - type: markdown
        content: |
          ## Historique Home Assistant
          - [Ouvrir l’activité](/logbook)
          - [Ouvrir l’historique](/history)
