title: PCHA — Validation Premium

views:
  - title: Validation
    path: validation
    icon: mdi:test-tube
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, minmax(0, 1fr))
      grid-template-areas: |
        "header header header header"
        "mode machine niveau pompe"
        "graph graph graph graph"
        "info info info info"
      grid-gap: 14px
      margin: 14px
      mediaquery:
        "(max-width: 900px)":
          grid-template-columns: repeat(2, minmax(0, 1fr))
          grid-template-areas: |
            "header header"
            "mode machine"
            "niveau pompe"
            "graph graph"
            "info info"
        "(max-width: 600px)":
          grid-template-columns: 1fr
          grid-template-areas: |
            "header"
            "mode"
            "machine"
            "niveau"
            "pompe"
            "graph"
            "info"

    cards:
      - type: markdown
        content: |
          # PCHA — Validation Premium
          Cette page vérifie **layout-card**, **button-card**, **ApexCharts Card** et **card-mod**.
        view_layout:
          grid-area: header
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(6, 24, 41, 0.98), rgba(19, 16, 48, 0.98));
              border: 1px solid rgba(34, 211, 238, 0.30);
              border-radius: 22px;
              box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35), 0 0 24px rgba(34, 211, 238, 0.08);
              color: #f8fafc;
              padding: 8px 16px;
            }

      - type: custom:button-card
        entity: input_select.pcha_mode_de_fonctionnement
        name: Mode
        icon: mdi:cog-play-outline
        show_state: true
        tap_action:
          action: none
        view_layout:
          grid-area: mode
        styles:
          card:
            - background: linear-gradient(145deg, rgba(8, 29, 47, 0.98), rgba(17, 24, 39, 0.98))
            - border: 1px solid rgba(34, 211, 238, 0.30)
            - border-radius: 20px
            - box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28)
            - padding: 18px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#22d3ee'
            - width: 34px
          name:
            - justify-self: start
            - color: '#cbd5e1'
            - font-size: 14px
          state:
            - justify-self: start
            - color: '#67e8f9'
            - font-size: 18px
            - font-weight: 700

      - type: custom:button-card
        entity: input_select.pcha_etat_machine
        name: Machine
        icon: mdi:state-machine
        show_state: true
        tap_action:
          action: none
        view_layout:
          grid-area: machine
        styles:
          card:
            - background: linear-gradient(145deg, rgba(8, 29, 47, 0.98), rgba(17, 24, 39, 0.98))
            - border: 1px solid rgba(52, 211, 153, 0.28)
            - border-radius: 20px
            - box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28)
            - padding: 18px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#34d399'
            - width: 34px
          name:
            - justify-self: start
            - color: '#cbd5e1'
            - font-size: 14px
          state:
            - justify-self: start
            - color: '#6ee7b7'
            - font-size: 18px
            - font-weight: 700

      - type: custom:button-card
        entity: input_select.pcha_niveau_fonctionnement
        name: Niveau
        icon: mdi:shield-check-outline
        show_state: true
        tap_action:
          action: none
        view_layout:
          grid-area: niveau
        styles:
          card:
            - background: linear-gradient(145deg, rgba(8, 29, 47, 0.98), rgba(17, 24, 39, 0.98))
            - border: 1px solid rgba(167, 139, 250, 0.30)
            - border-radius: 20px
            - box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28)
            - padding: 18px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#a78bfa'
            - width: 34px
          name:
            - justify-self: start
            - color: '#cbd5e1'
            - font-size: 14px
          state:
            - justify-self: start
            - color: '#c4b5fd'
            - font-size: 18px
            - font-weight: 700

      - type: custom:button-card
        entity: switch.pcha_commande_pompe_filtration
        name: Pompe
        icon: mdi:water-pump
        show_state: true
        tap_action:
          action: none
        view_layout:
          grid-area: pompe
        styles:
          card:
            - background: linear-gradient(145deg, rgba(8, 29, 47, 0.98), rgba(17, 24, 39, 0.98))
            - border: 1px solid rgba(34, 211, 238, 0.30)
            - border-radius: 20px
            - box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28)
            - padding: 18px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#22d3ee'
            - width: 34px
          name:
            - justify-self: start
            - color: '#cbd5e1'
            - font-size: 14px
          state:
            - justify-self: start
            - color: '#67e8f9'
            - font-size: 18px
            - font-weight: 700

      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Température bassin — test ApexCharts
          show_states: true
          colorize_states: true
        now:
          show: true
          label: Maintenant
        series:
          - entity: sensor.pcha_temperature_piscine
            name: Température
            type: area
            color: '#22d3ee'
            stroke_width: 3
            float_precision: 1
            show:
              in_header: raw
              extremas: true
            group_by:
              func: avg
              duration: 10min
        apex_config:
          chart:
            height: 260px
            toolbar:
              show: false
          dataLabels:
            enabled: false
          grid:
            borderColor: rgba(148, 163, 184, 0.16)
          xaxis:
            labels:
              style:
                colors: '#94a3b8'
          yaxis:
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        view_layout:
          grid-area: graph
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(145deg, rgba(5, 22, 38, 0.98), rgba(24, 18, 54, 0.98));
              border: 1px solid rgba(34, 211, 238, 0.28);
              border-radius: 22px;
              box-shadow: 0 14px 38px rgba(0, 0, 0, 0.35), 0 0 30px rgba(124, 58, 237, 0.08);
              overflow: hidden;
            }

      - type: markdown
        content: |
          ## Résultat attendu
          - quatre tuiles sombres alignées ;
          - une mise en page qui passe à deux colonnes puis une colonne sur écran étroit ;
          - un graphique cyan sur 24 heures avec la valeur actuelle et les extrêmes ;
          - aucune erreur **Custom element doesn't exist**.
        view_layout:
          grid-area: info
        card_mod:
          style: |
            ha-card {
              background: rgba(15, 23, 42, 0.92);
              border: 1px solid rgba(167, 139, 250, 0.24);
              border-radius: 18px;
              color: #cbd5e1;
            }
