      ##########################################################################
      # Objectif quotidien — carte compacte unifiée
      ##########################################################################
      - type: custom:button-card
        entity: sensor.pcha_progression_objectif_quotidien
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: more-info
        triggers_update:
          - sensor.pcha_heure_atteinte_objectif
        view_layout:
          grid-area: objectif
          align-self: stretch
        custom_fields:
          contenu: |
            [[[
              const get = (id) => states[id];
              const valid = (s) => s && !['unknown', 'unavailable', 'none', ''].includes(s.state);
              const duration = (id) => {
                const s = get(id);
                if (!valid(s)) return '—';
                const number = Number(s.state);
                const unit = s.attributes.unit_of_measurement || '';
                if (!Number.isFinite(number)) return `${s.state}${unit ? ` ${unit}` : ''}`;
                const minutes = unit === 'h' ? number * 60 : number;
                const hours = Math.floor(minutes / 60);
                const mins = Math.round(minutes % 60);
                return `${String(hours).padStart(2, '0')}h${String(mins).padStart(2, '0')}`;
              };
              const temperature = (id) => {
                const s = get(id);
                if (!valid(s)) return '—';
                const unit = s.attributes.unit_of_measurement || '°C';
                return `${s.state} ${unit}`;
              };
              const targetTime = () => {
                const s = get('sensor.pcha_heure_atteinte_objectif');
                return valid(s) ? s.state : '—';
              };
              const progress = Math.max(0, Math.min(100, Number(entity.state) || 0));
              return `
                <div class="pcha-objectif-entete">
                  <span>Objectif quotidien de filtration</span>
                </div>
                <div class="pcha-objectif-corps">
                  <div class="pcha-objectif-details">
                    <div><span>Objectif</span><strong>${duration('sensor.pcha_objectif_filtration_quotidien')}</strong></div>
                    <div><span>Référence</span><strong>${temperature('sensor.pcha_temperature_reference_objectif_quotidien')}</strong></div>
                    <div><span>Temps réalisé</span><strong>${duration('sensor.pcha_temps_filtration_realise')}</strong></div>
                    <div><span>Temps restant</span><strong>${duration('sensor.pcha_temps_filtration_restant')}</strong></div>
                    <div><span>À atteindre à</span><strong>${targetTime()}</strong></div>
                  </div>
                  <div class="pcha-objectif-anneau" style="--progress:${progress}">
                    <div class="pcha-objectif-centre">
                      <b class="pcha-progress-pourcentage"><span>${Math.round(progress)}</span><small>%</small></b>
                    </div>
                  </div>
                </div>`;
            ]]]
        styles:
          card:
            - background: linear-gradient(145deg, rgba(20,17,49,.98), rgba(8,28,46,.98))
            - border: 1px solid rgba(167,139,250,.36)
            - border-radius: 20px
            - box-shadow: 0 16px 40px rgba(0,0,0,.34), 0 0 34px rgba(139,92,246,.10)
            - padding: 18px 20px
            - height: 100%
            - min-height: 280px
            - box-sizing: border-box
          grid:
            - grid-template-areas: '"contenu"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
          custom_fields:
            contenu:
              - width: 100%
              - height: 100%
              - justify-self: stretch
              - text-align: left
        extra_styles: |
            .pcha-objectif-entete {
              display: inline-flex;
              align-items: center;
              justify-content: flex-start;
              gap: 10px;
              width: auto;
              max-width: 100%;
              color: #eee8ff;
              font-size: 17px;
              font-weight: 600;
              margin-bottom: 14px;
              text-align: left;
            }
            .pcha-objectif-entete::before {
              content: "";
              display: inline-block;
              flex: 0 0 24px;
              width: 24px;
              height: 24px;
              background: linear-gradient(145deg, #67e8f9, #a78bfa 55%, #f0abfc);
              -webkit-mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(167,139,250,.65));
            }
            .pcha-objectif-entete span {
              display: inline-block;
              flex: 0 1 auto;
              width: auto !important;
              margin: 0;
              text-align: left;
            }
            .pcha-objectif-corps {
              display: grid;
              grid-template-columns: minmax(0, 1fr) 150px;
              align-items: center;
              gap: 16px;
              width: 100%;
            }
            .pcha-objectif-details > div {
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 12px;
              min-height: 38px;
              border-bottom: 1px solid rgba(148,163,184,.14);
              color: #cbd5e1;
              font-size: 13px;
            }
            .pcha-objectif-details > div:last-child {
              border-bottom: 0;
            }
            .pcha-objectif-details strong {
              color: #67e8f9;
              font-size: 16px;
              font-weight: 700;
              white-space: nowrap;
            }
            .pcha-objectif-details > div:nth-child(2) strong,
            .pcha-objectif-details > div:nth-child(4) strong {
              color: #a78bfa;
            }
            .pcha-objectif-anneau {
              width: 146px;
              height: 146px;
              padding: 12px;
              position: relative;
              border-radius: 50%;
              background: conic-gradient(from -90deg, #22d3ee 0%, #38bdf8 calc(var(--progress) * .35%), #8b5cf6 calc(var(--progress) * .72%), #e879f9 calc(var(--progress) * 1%), rgba(30,58,82,.50) calc(var(--progress) * 1%) 100%);
              box-shadow: 0 0 12px rgba(34,211,238,.22), 0 0 28px rgba(139,92,246,.14), inset 0 0 18px rgba(232,121,249,.10);
              outline: 1px solid rgba(103,232,249,.16);
              box-sizing: border-box;
            }
            .pcha-objectif-centre {
              width: 100%;
              height: 100%;
              display: grid;
              place-items: center;
              border-radius: 50%;
              background: radial-gradient(circle at 50% 35%, rgba(19,47,71,.98), #071827 68%);
              border: 1px solid rgba(34,211,238,.35);
              color: #67e8f9;
              box-shadow: inset 0 0 22px rgba(34,211,238,.08);
            }
            .pcha-progress-pourcentage {
              display: inline-flex;
              align-items: flex-start;
              justify-content: center;
              line-height: 1;
              transform: none;
              background: linear-gradient(110deg, #67e8f9 5%, #38bdf8 42%, #a78bfa 72%, #f0abfc 100%);
              -webkit-background-clip: text;
              background-clip: text;
              color: transparent;
              filter: drop-shadow(0 0 7px rgba(56,189,248,.28));
              font-weight: 850;
              letter-spacing: -1px;
            }
            .pcha-progress-pourcentage span {
              font-size: 34px;
            }
            .pcha-progress-pourcentage small {
              font-size: 16px;
              margin: 4px 0 0 3px;
              font-weight: 750;
            }
            @media (max-width: 700px) {
              .pcha-objectif-corps {
                grid-template-columns: 1fr;
              }
              .pcha-objectif-anneau {
                justify-self: center;
              }
            }

