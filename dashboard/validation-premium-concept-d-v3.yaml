        triggers_update:
          - input_select.pcha_mode_de_fonctionnement
          - timer.pcha_traitement
          - sensor.pcha_temps_traitement_restant
        view_layout:
          grid-area: restant-traitement
        custom_fields:
          duree: |
            [[[
              if (states['input_select.pcha_mode_de_fonctionnement']?.state !== 'TRAITEMENT') {
                return 'Inactif';
              }
              const minutes = Math.max(0, Math.ceil(Number(entity.state)));
              if (!Number.isFinite(minutes)) return 'Indisponible';
              const heures = Math.floor(minutes / 60);
              const reste = minutes % 60;
              return heures > 0 ? `${heures} h ${String(reste).padStart(2, '0')} min` : `${reste} min`;
            ]]]
        styles:
          card:
            - background: linear-gradient(145deg, rgba(27,18,55,.98), rgba(15,23,42,.98))
