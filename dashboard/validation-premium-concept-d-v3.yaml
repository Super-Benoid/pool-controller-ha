################################################################################
# PCHA V2.0 — Accueil Premium Concept D
# Affichage normal : interface Home Assistant conservée.
# Affichage immersif : ajouter ?kiosk à l'URL puis utiliser F11.
# Cette version utilise directement la vue custom:grid-layout.
################################################################################

title: PCHA — Concept D V2.0

views:
  - title: Validation Concept D
    path: validation
    icon: mdi:pool
    background: &pcha_background
      image: 'data:image/webp;base64,'
      opacity: 24
      size: cover
      alignment: center
      repeat: no-repeat
      attachment: fixed
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, minmax(0, 1fr))
      grid-template-areas: |
        "header header header header header header header header header header header header"
        "mode mode mode machine machine machine niveau niveau niveau pompe pompe pompe"
        "temperature temperature luminosite luminosite debit debit puissance puissance objectif objectif objectif objectif"
        "reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre"
        "mode-reglage mode-reglage mode-reglage consigne consigne consigne seuil seuil seuil alarmes alarmes alarmes"
        "activite activite activite activite activite activite activite activite activite activite activite activite"
      grid-gap: 12px
      margin: 12px
      mediaquery:
        "(max-width: 1200px)":
          grid-template-columns: repeat(8, minmax(0, 1fr))
          grid-template-areas: |
            "header header header header header header header header"
            "mode mode mode mode machine machine machine machine"
            "niveau niveau niveau niveau pompe pompe pompe pompe"
            "temperature temperature temperature temperature luminosite luminosite luminosite luminosite"
            "debit debit debit debit puissance puissance puissance puissance"
            "objectif objectif objectif objectif objectif objectif objectif objectif"
            "reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre"
            "mode-reglage mode-reglage mode-reglage mode-reglage consigne consigne consigne consigne"
            "seuil seuil seuil seuil alarmes alarmes alarmes alarmes"
            "activite activite activite activite activite activite activite activite"
        "(max-width: 700px)":
          grid-template-columns: 1fr
          grid-template-areas: |
            "header"
            "mode"
            "machine"
            "niveau"
            "pompe"
            "temperature"
            "luminosite"
            "debit"
            "puissance"
            "objectif"
            "reglages-titre"
            "mode-reglage"
            "consigne"
            "seuil"
            "alarmes"
            "activite"
          grid-gap: 10px
          margin: 8px

    cards:
      ##########################################################################
      # En-tête
      ##########################################################################
      - type: custom:button-card
        show_icon: false
        show_name: false
        update_timer: 1min
        tap_action:
          action: none
        triggers_update:
          - binary_sensor.pcha_demande_fonctionnement
          - binary_sensor.pcha_chauffage_solaire_requis
          - binary_sensor.pcha_chauffage_solaire_actif
          - binary_sensor.pcha_protection_serpentin_requise
        view_layout:
          grid-area: header
        custom_fields:
          titre: Pool Controller Home Assistant
          sous_titre: Synthèse décisionnelle en temps réel
          heure: |
            [[[
              return new Date().toLocaleTimeString('fr-FR', {
                hour: '2-digit',
                minute: '2-digit'
              });
            ]]]
          statuts: |
            [[[
              const on = (id) => states[id]?.state === 'on';
              const pill = (icon, label, value, color) => `
                <span style="display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;border:1px solid ${color}55;background:${color}14;white-space:nowrap;">
                  <ha-icon icon="${icon}" style="width:18px;color:${color};"></ha-icon>
                  <span style="color:#94a3b8;">${label}</span>
                  <b style="color:${color};">${value}</b>
                </span>`;
              const demande = on('binary_sensor.pcha_demande_fonctionnement');
              const solaireActif = on('binary_sensor.pcha_chauffage_solaire_actif');
              const solaireRequis = on('binary_sensor.pcha_chauffage_solaire_requis');
              const protection = on('binary_sensor.pcha_protection_serpentin_requise');
              const solaire = solaireActif ? 'Actif' : solaireRequis ? 'Requis' : 'Inactif';
              return `<div style="display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;">
                ${pill('mdi:play-circle-outline', 'Demande', demande ? 'Active' : 'Inactive', demande ? '#34d399' : '#94a3b8')}
                ${pill('mdi:white-balance-sunny', 'Solaire', solaire, solaireActif ? '#fbbf24' : solaireRequis ? '#a78bfa' : '#94a3b8')}
                ${pill('mdi:shield-sun-outline', 'Serpentin', protection ? 'Protection requise' : 'Normal', protection ? '#fb7185' : '#22d3ee')}
              </div>`;
            ]]]
        styles:
          card:
            - background: linear-gradient(135deg, rgba(5,22,38,.98), rgba(24,18,54,.97))
            - border: 1px solid rgba(34,211,238,.30)
            - border-radius: 20px
            - box-shadow: 0 16px 42px rgba(0,0,0,.32), 0 0 30px rgba(34,211,238,.08)
            - padding: 15px 22px
            - min-height: 72px
          grid:
            - grid-template-areas: '"titre heure statuts" "sous_titre heure statuts"'
            - grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr)
            - grid-template-rows: min-content min-content
          custom_fields:
            titre:
              - justify-self: start
              - color: '#f8fafc'
              - font-size: 30px
              - font-weight: 800
              - letter-spacing: -0.8px
            sous_titre:
              - justify-self: start
              - color: '#94a3b8'
              - font-size: 14px
              - padding-top: 5px
            heure:
              - justify-self: center
              - align-self: center
              - padding: 5px 18px
              - border-radius: 14px
              - border: 1px solid rgba(103,232,249,.18)
              - background: rgba(8,28,46,.58)
              - color: '#67e8f9'
              - font-size: 27px
              - line-height: 1
              - font-weight: 800
              - letter-spacing: 1px
              - text-shadow: 0 0 12px rgba(34,211,238,.30)
            statuts:
              - justify-self: stretch
              - align-self: center
              - font-size: 12px

      ##########################################################################
      # États principaux
      ##########################################################################
      - type: custom:button-card
        entity: input_select.pcha_mode_de_fonctionnement
        name: Mode
        icon: mdi:alpha-a-circle-outline
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: mode
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(34,211,238,.25)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#22d3ee'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#67e8f9'
            - font-size: 18px
            - font-weight: 750

      - type: custom:button-card
        entity: input_select.pcha_etat_machine
        name: Machine
        icon: mdi:state-machine
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: machine
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(52,211,153,.25)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#34d399'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#6ee7b7'
            - font-size: 18px
            - font-weight: 750

      - type: custom:button-card
        entity: input_select.pcha_niveau_fonctionnement
        name: Niveau
        icon: mdi:waves
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: niveau
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(167,139,250,.28)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#a78bfa'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#c4b5fd'
            - font-size: 18px
            - font-weight: 750

      - type: custom:button-card
        entity: switch.pcha_commande_pompe_filtration
        name: Pompe
        icon: mdi:water-pump
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: pompe
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(34,211,238,.25)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#22d3ee'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#67e8f9'
            - font-size: 18px
            - font-weight: 750

      ##########################################################################
      # ApexCharts
      ##########################################################################
      - type: custom:apexcharts-card
        view_layout:
          grid-area: temperature
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Températures bassin / extérieur
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_temperature_piscine
            name: Bassin
            type: line
            color: '#22d3ee'
            stroke_width: 3
            opacity: 1
            curve: smooth
            extend_to: now
            float_precision: 1
            show:
              in_header: raw
              extremas: true
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.pcha_ecart_temperature_bassin_exterieure
            name: Δ bassin − ext.
            type: line
            color: '#818cf8'
            float_precision: 1
            show:
              in_header: raw
              in_chart: false
              legend_value: false
          - entity: sensor.pcha_temperature_exterieure
            name: Extérieur
            type: line
            color: '#f0abfc'
            stroke_width: 3
            opacity: 1
            curve: smooth
            extend_to: now
            float_precision: 1
            show:
              in_header: raw
              extremas: false
            group_by:
              func: avg
              duration: 10min
        apex_config:
          chart:
            height: 180
            toolbar:
              show: false
          dataLabels:
            enabled: false
          legend:
            show: false
          grid:
            borderColor: rgba(148,163,184,.14)
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              style:
                colors: '#94a3b8'
          yaxis:
            decimalsInFloat: 1
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        card_mod:
          style: |
            #header {
              overflow: visible;
              padding-bottom: 8px;
            }
            #header__title {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #d8f8ff;
              font-weight: 600;
            }
            #header__title::before {
              content: "";
              display: inline-block;
              flex: 0 0 21px;
              width: 21px;
              height: 21px;
              background: linear-gradient(145deg, #67e8f9, #06b6d4);
              -webkit-mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(34,211,238,.65));
            }
            #header__states {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              align-items: start;
              gap: 6px;
              margin: 0;
              width: 100%;
              min-height: 50px;
              padding: 4px 10px 8px;
              box-sizing: border-box;
            }
            #header__states > #states__state {
              min-width: 0;
              margin: 0;
              overflow: visible;
            }
            #header__states #state__value {
              display: flex !important;
              align-items: baseline;
              width: 100%;
              max-width: 100%;
              overflow: visible;
              box-sizing: border-box;
            }
            #header__states #state__value > #state {
              font-size: 1.8em;
              line-height: 1.05;
              white-space: nowrap;
            }
            #header__states #state__value > #uom {
              font-size: 1em;
              white-space: nowrap;
            }
            #header__states #state__name {
              min-height: 12px;
              overflow: visible;
              white-space: nowrap;
              text-overflow: clip;
              font-size: .8em;
              line-height: 1.15;
            }
            #header__states > #states__state:nth-child(1) #state__value {
              justify-content: flex-start;
            }
            #header__states > #states__state:nth-child(2) {
              text-align: center;
            }
            #header__states > #states__state:nth-child(2) #state__value {
              justify-content: center;
              margin: 0;
            }
            #header__states > #states__state:nth-child(3) {
              text-align: right;
            }
            #header__states > #states__state:nth-child(3) #state__value {
              justify-content: flex-end;
              margin: 0;
            }
            ha-card {
              background: linear-gradient(150deg, rgba(5,24,40,.98), rgba(9,35,51,.94));
              border: 1px solid rgba(34,211,238,.32);
              border-radius: 18px;
              box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 22px rgba(34,211,238,.06);
              overflow: hidden;
            }

      - type: custom:apexcharts-card
        view_layout:
          grid-area: luminosite
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Luminosité
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_luminosite
            name: Actuelle
            type: area
            color: '#a78bfa'
            stroke_width: 3
            unit: klux
            transform: "return Number(x) / 1000;"
            float_precision: 1
            show:
              in_header: true
              extremas: true
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.pcha_luminosite_moyenne_superieure_seuil_jour
            name: Moy. jour
            type: line
            color: '#e879f9'
            unit: klux
            transform: "return Number(x) / 1000;"
            float_precision: 1
            show:
              in_header: true
              in_chart: false
              legend_value: false
        apex_config:
          chart:
            height: 180
            toolbar:
              show: false
          stroke:
            curve: smooth
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.43
              opacityTo: 0.03
          dataLabels:
            enabled: false
          legend:
            show: false
          grid:
            borderColor: rgba(148,163,184,.14)
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              style:
                colors: '#94a3b8'
          yaxis:
            decimalsInFloat: 0
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        card_mod:
          style: |
            #header {
              overflow: visible;
              padding-bottom: 8px;
            }
            #header__title {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #eee8ff;
              font-weight: 600;
            }
            #header__title::before {
              content: "";
              display: inline-block;
              flex: 0 0 21px;
              width: 21px;
              height: 21px;
              background: linear-gradient(145deg, #c4b5fd, #8b5cf6);
              -webkit-mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(139,92,246,.65));
            }
            #header__states {
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 10px;
              margin: 0;
              width: 100%;
              min-height: 50px;
              padding: 4px 10px 8px;
              box-sizing: border-box;
            }
            #header__states > #states__state {
              min-width: 0;
              margin: 0;
              overflow: visible;
            }
            #header__states > #states__state:nth-child(2) {
              text-align: right;
            }
            #header__states > #states__state:nth-child(2) #state__value {
              justify-content: flex-end;
              margin: 0;
            }
            #header__states #state__value {
              display: flex !important;
              align-items: baseline;
              width: 100%;
              max-width: 100%;
              overflow: visible;
              box-sizing: border-box;
            }
            #header__states > #states__state:nth-child(1) #state__value {
              justify-content: flex-start;
            }
            #header__states #state__value > #state {
              font-size: 1.8em;
              line-height: 1.05;
              white-space: nowrap;
            }
            #header__states #state__value > #uom {
              font-size: 1em;
              white-space: nowrap;
            }
            #header__states #state__name {
              overflow: visible;
              white-space: nowrap;
              text-overflow: clip;
              font-size: .8em;
              line-height: 1.15;
            }
            ha-card {
              background: linear-gradient(150deg, rgba(20,17,49,.98), rgba(34,22,65,.94));
              border: 1px solid rgba(167,139,250,.34);
              border-radius: 18px;
              box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 22px rgba(139,92,246,.07);
              overflow: hidden;
            }

      - type: custom:apexcharts-card
        view_layout:
          grid-area: debit
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Débit filtration
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_debit_filtration
            name: Débit
            type: area
            color: '#2dd4bf'
            stroke_width: 3
            float_precision: 0
            show:
              in_header: raw
              extremas: true
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.pcha_renouvellements_bassin_du_jour
            name: Cycles
            type: line
            color: '#67e8f9'
            unit: x
            float_precision: 1
            show:
              in_header: true
              in_chart: false
              legend_value: false
        apex_config:
          chart:
            height: 180
            toolbar:
              show: false
          stroke:
            curve: smooth
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.40
              opacityTo: 0.03
          dataLabels:
            enabled: false
          grid:
            borderColor: rgba(148,163,184,.14)
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              style:
                colors: '#94a3b8'
          yaxis:
            min: 0
            decimalsInFloat: 0
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        card_mod:
          style: |
            #header {
              overflow: visible;
              padding-bottom: 8px;
            }
            #header__title {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #d9fff8;
              font-weight: 600;
            }
            #header__title::before {
              content: "";
              display: inline-block;
              flex: 0 0 21px;
              width: 21px;
              height: 21px;
              background: linear-gradient(145deg, #5eead4, #14b8a6);
              -webkit-mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(45,212,191,.65));
            }
            #header__states {
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 10px;
              margin: 0;
              width: 100%;
              min-height: 50px;
              padding: 4px 10px 8px;
              box-sizing: border-box;
            }
            #header__states > #states__state {
              min-width: 0;
              margin: 0;
              overflow: visible;
            }
            #header__states > #states__state:nth-child(2) {
              text-align: right;
            }
            #header__states > #states__state:nth-child(2) #state__value {
              justify-content: flex-end;
              margin: 0;
            }
            #header__states #state__value {
              display: flex !important;
              align-items: baseline;
              width: 100%;
              max-width: 100%;
              overflow: visible;
              box-sizing: border-box;
            }
            #header__states > #states__state:nth-child(1) #state__value {
              justify-content: flex-start;
            }
            #header__states #state__value > #state {
              font-size: 1.8em;
              line-height: 1.05;
              white-space: nowrap;
            }
            #header__states #state__value > #uom {
              font-size: 1em;
              white-space: nowrap;
            }
            #header__states #state__name {
              overflow: visible;
              white-space: nowrap;
              text-overflow: clip;
              font-size: .8em;
              line-height: 1.15;
            }
            ha-card {
              background: linear-gradient(150deg, rgba(5,24,40,.98), rgba(7,43,48,.94));
              border: 1px solid rgba(45,212,191,.32);
              border-radius: 18px;
              box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 22px rgba(45,212,191,.06);
              overflow: hidden;
            }

      - type: custom:apexcharts-card
        view_layout:
          grid-area: puissance
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Puissance pompe
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_puissance_pompe_filtration
