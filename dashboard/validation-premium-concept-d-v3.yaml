################################################################################
# PCHA V1.1 — Accueil Premium Concept D — V3
# Affichage normal : interface Home Assistant conservée.
# Affichage immersif : ajouter ?kiosk à l'URL puis utiliser F11.
# Cette version utilise directement la vue custom:grid-layout.
################################################################################

title: PCHA — Concept D V3

views:
  - title: Validation Concept D
    path: validation
    icon: mdi:pool
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(12, minmax(0, 1fr))
      grid-template-areas: |
        "header header header header header header header header header header header header"
        "mode mode mode machine machine machine niveau niveau niveau pompe pompe pompe"
        "mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre objectif objectif objectif objectif"
        "temperature temperature luminosite luminosite debit debit puissance puissance objectif objectif objectif objectif"
        "reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre"
        "mode-reglage mode-reglage mode-reglage consigne consigne consigne seuil seuil seuil alarmes alarmes alarmes"
        "activite activite activite activite activite activite activite activite activite activite activite activite"
      grid-gap: 12px
      margin: 12px
      mediaquery:
        "(max-width: 1200px)":
          grid-template-columns: repeat(8, minmax(0, 1fr))
          grid-template-areas: |
            "header header header header header header header header"
            "mode mode mode mode machine machine machine machine"
            "niveau niveau niveau niveau pompe pompe pompe pompe"
            "mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre mesures-titre"
            "temperature temperature temperature temperature luminosite luminosite luminosite luminosite"
            "debit debit debit debit puissance puissance puissance puissance"
            "objectif objectif objectif objectif objectif objectif objectif objectif"
            "reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre reglages-titre"
            "mode-reglage mode-reglage mode-reglage mode-reglage consigne consigne consigne consigne"
            "seuil seuil seuil seuil alarmes alarmes alarmes alarmes"
            "activite activite activite activite activite activite activite activite"
        "(max-width: 700px)":
          grid-template-columns: 1fr
          grid-template-areas: |
            "header"
            "mode"
            "machine"
            "niveau"
            "pompe"
            "mesures-titre"
            "temperature"
            "luminosite"
            "debit"
            "puissance"
            "objectif"
            "reglages-titre"
            "mode-reglage"
            "consigne"
            "seuil"
            "alarmes"
            "activite"
          grid-gap: 10px
          margin: 8px

    cards:
      ##########################################################################
      # En-tête
      ##########################################################################
      - type: custom:button-card
        show_icon: false
        show_name: false
        tap_action:
          action: none
        triggers_update:
          - binary_sensor.pcha_demande_fonctionnement
          - binary_sensor.pcha_chauffage_solaire_requis
          - binary_sensor.pcha_chauffage_solaire_actif
          - binary_sensor.pcha_protection_serpentin_requise
        view_layout:
          grid-area: header
        custom_fields:
          titre: PCHA — Piscine
          sous_titre: Synthèse décisionnelle en temps réel
          statuts: |
            [[[
              const on = (id) => states[id]?.state === 'on';
              const pill = (icon, label, value, color) => `
                <span style="display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;border:1px solid ${color}55;background:${color}14;white-space:nowrap;">
                  <ha-icon icon="${icon}" style="width:18px;color:${color};"></ha-icon>
                  <span style="color:#94a3b8;">${label}</span>
                  <b style="color:${color};">${value}</b>
                </span>`;
              const demande = on('binary_sensor.pcha_demande_fonctionnement');
              const solaireActif = on('binary_sensor.pcha_chauffage_solaire_actif');
              const solaireRequis = on('binary_sensor.pcha_chauffage_solaire_requis');
              const protection = on('binary_sensor.pcha_protection_serpentin_requise');
              const solaire = solaireActif ? 'Actif' : solaireRequis ? 'Requis' : 'Inactif';
              return `<div style="display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;">
                ${pill('mdi:play-circle-outline', 'Demande', demande ? 'Active' : 'Inactive', demande ? '#34d399' : '#94a3b8')}
                ${pill('mdi:white-balance-sunny', 'Solaire', solaire, solaireActif ? '#fbbf24' : solaireRequis ? '#a78bfa' : '#94a3b8')}
                ${pill('mdi:shield-sun-outline', 'Serpentin', protection ? 'Protection requise' : 'Normal', protection ? '#fb7185' : '#22d3ee')}
              </div>`;
            ]]]
        styles:
          card:
            - background: linear-gradient(135deg, rgba(5,22,38,.98), rgba(24,18,54,.97))
            - border: 1px solid rgba(34,211,238,.30)
            - border-radius: 20px
            - box-shadow: 0 16px 42px rgba(0,0,0,.32), 0 0 30px rgba(34,211,238,.08)
            - padding: 15px 22px
            - min-height: 72px
          grid:
            - grid-template-areas: '"titre statuts" "sous_titre statuts"'
            - grid-template-columns: minmax(220px, .7fr) minmax(0, 1.3fr)
            - grid-template-rows: min-content min-content
          custom_fields:
            titre:
              - justify-self: start
              - color: '#f8fafc'
              - font-size: 30px
              - font-weight: 800
              - letter-spacing: -0.8px
            sous_titre:
              - justify-self: start
              - color: '#94a3b8'
              - font-size: 14px
              - padding-top: 5px
            statuts:
              - justify-self: stretch
              - align-self: center
              - font-size: 12px

      ##########################################################################
      # États principaux
      ##########################################################################
      - type: custom:button-card
        entity: input_select.pcha_mode_de_fonctionnement
        name: Mode
        icon: mdi:alpha-a-circle-outline
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: mode
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(34,211,238,.25)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#22d3ee'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#67e8f9'
            - font-size: 18px
            - font-weight: 750

      - type: custom:button-card
        entity: input_select.pcha_etat_machine
        name: Machine
        icon: mdi:state-machine
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: machine
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(52,211,153,.25)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#34d399'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#6ee7b7'
            - font-size: 18px
            - font-weight: 750

      - type: custom:button-card
        entity: input_select.pcha_niveau_fonctionnement
        name: Niveau
        icon: mdi:waves
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: niveau
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(167,139,250,.28)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#a78bfa'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#c4b5fd'
            - font-size: 18px
            - font-weight: 750

      - type: custom:button-card
        entity: switch.pcha_commande_pompe_filtration
        name: Pompe
        icon: mdi:water-pump
        show_state: true
        tap_action:
          action: more-info
        view_layout:
          grid-area: pompe
        styles:
          card:
            - background: linear-gradient(145deg, rgba(7,27,45,.98), rgba(15,23,42,.98))
            - border: 1px solid rgba(34,211,238,.25)
            - border-radius: 18px
            - box-shadow: 0 10px 28px rgba(0,0,0,.28)
            - padding: 13px 16px
            - min-height: 74px
          grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 52px 1fr
            - grid-template-rows: min-content min-content
          icon:
            - color: '#22d3ee'
            - width: 39px
          name:
            - justify-self: start
            - align-self: end
            - color: '#cbd5e1'
            - font-size: 14px
            - font-weight: 600
          state:
            - justify-self: start
            - align-self: start
            - color: '#67e8f9'
            - font-size: 18px
            - font-weight: 750

      ##########################################################################
      # Titre mesures
      ##########################################################################
      - type: custom:button-card
        show_icon: false
        show_name: false
        tap_action:
          action: none
        view_layout:
          grid-area: mesures-titre
        custom_fields:
          titre: Mesures en direct
          sous_titre: Valeur actuelle, courbe 24 h et extrêmes enregistrés
        styles:
          card:
            - background: rgba(7,24,40,.78)
            - border: 1px solid rgba(34,211,238,.20)
            - border-radius: 16px
            - padding: 10px 16px
            - box-shadow: none
          grid:
            - grid-template-areas: '"titre" "sous_titre"'
          custom_fields:
            titre:
              - justify-self: start
              - color: '#f8fafc'
              - font-size: 18px
              - font-weight: 750
            sous_titre:
              - justify-self: start
              - color: '#94a3b8'
              - font-size: 12px
              - padding-top: 2px

      ##########################################################################
      # ApexCharts
      ##########################################################################
      - type: custom:apexcharts-card
        view_layout:
          grid-area: temperature
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Températures bassin / extérieur
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_temperature_piscine
            name: Bassin
            type: line
            color: '#22d3ee'
            stroke_width: 3
            opacity: 1
            curve: smooth
            extend_to: now
            float_precision: 1
            show:
              in_header: raw
              extremas: true
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.pcha_temperature_exterieure
            name: Extérieure
            type: line
            color: '#f0abfc'
            stroke_width: 3
            opacity: 1
            curve: smooth
            extend_to: now
            float_precision: 1
            show:
              in_header: raw
              extremas: false
            group_by:
              func: avg
              duration: 10min
        apex_config:
          chart:
            height: 180
            toolbar:
              show: false
          dataLabels:
            enabled: false
          grid:
            borderColor: rgba(148,163,184,.14)
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              style:
                colors: '#94a3b8'
          yaxis:
            decimalsInFloat: 1
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        card_mod:
          style: |
            #header__title {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #d8f8ff;
              font-weight: 600;
            }
            #header__title::before {
              content: "";
              display: inline-block;
              flex: 0 0 21px;
              width: 21px;
              height: 21px;
              background: linear-gradient(145deg, #67e8f9, #06b6d4);
              -webkit-mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(34,211,238,.65));
            }
            ha-card {
              background: linear-gradient(150deg, rgba(5,24,40,.98), rgba(9,35,51,.94));
              border: 1px solid rgba(34,211,238,.32);
              border-radius: 18px;
              box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 22px rgba(34,211,238,.06);
              overflow: hidden;
            }

      - type: custom:apexcharts-card
        view_layout:
          grid-area: luminosite
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Luminosité
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_luminosite
            name: Luminosité
            type: area
            color: '#a78bfa'
            stroke_width: 3
            float_precision: 0
            show:
              in_header: raw
              extremas: true
            group_by:
              func: avg
              duration: 10min
        apex_config:
          chart:
            height: 180
            toolbar:
              show: false
          stroke:
            curve: smooth
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.43
              opacityTo: 0.03
          dataLabels:
            enabled: false
          grid:
            borderColor: rgba(148,163,184,.14)
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              style:
                colors: '#94a3b8'
          yaxis:
            decimalsInFloat: 0
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        card_mod:
          style: |
            #header__title {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #eee8ff;
              font-weight: 600;
            }
            #header__title::before {
              content: "";
              display: inline-block;
              flex: 0 0 21px;
              width: 21px;
              height: 21px;
              background: linear-gradient(145deg, #c4b5fd, #8b5cf6);
              -webkit-mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(139,92,246,.65));
            }
            ha-card {
              background: linear-gradient(150deg, rgba(20,17,49,.98), rgba(34,22,65,.94));
              border: 1px solid rgba(167,139,250,.34);
              border-radius: 18px;
              box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 22px rgba(139,92,246,.07);
              overflow: hidden;
            }

      - type: custom:apexcharts-card
        view_layout:
          grid-area: debit
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Débit filtration
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_debit_filtration
            name: Débit
            type: area
            color: '#2dd4bf'
            stroke_width: 3
            float_precision: 0
            show:
              in_header: raw
              extremas: true
            group_by:
              func: avg
              duration: 5min
        apex_config:
          chart:
            height: 180
            toolbar:
              show: false
          stroke:
            curve: smooth
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.40
              opacityTo: 0.03
          dataLabels:
            enabled: false
          grid:
            borderColor: rgba(148,163,184,.14)
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              style:
                colors: '#94a3b8'
          yaxis:
            min: 0
            decimalsInFloat: 0
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        card_mod:
          style: |
            #header__title {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #d9fff8;
              font-weight: 600;
            }
            #header__title::before {
              content: "";
              display: inline-block;
              flex: 0 0 21px;
              width: 21px;
              height: 21px;
              background: linear-gradient(145deg, #5eead4, #14b8a6);
              -webkit-mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(45,212,191,.65));
            }
            ha-card {
              background: linear-gradient(150deg, rgba(5,24,40,.98), rgba(7,43,48,.94));
              border: 1px solid rgba(45,212,191,.32);
              border-radius: 18px;
              box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 22px rgba(45,212,191,.06);
              overflow: hidden;
            }

      - type: custom:apexcharts-card
        view_layout:
          grid-area: puissance
        graph_span: 24h
        update_interval: 30s
        header:
          show: true
          title: Puissance pompe
          show_states: true
          colorize_states: true
        series:
          - entity: sensor.pcha_puissance_pompe_filtration
            name: Puissance
            type: area
            color: '#c084fc'
            stroke_width: 3
            float_precision: 0
            show:
              in_header: raw
              extremas: true
            group_by:
              func: avg
              duration: 5min
        apex_config:
          chart:
            height: 180
            toolbar:
              show: false
          stroke:
            curve: smooth
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.43
              opacityTo: 0.03
          dataLabels:
            enabled: false
          grid:
            borderColor: rgba(148,163,184,.14)
          xaxis:
            type: datetime
            labels:
              datetimeUTC: false
              style:
                colors: '#94a3b8'
          yaxis:
            min: 0
            decimalsInFloat: 0
            labels:
              style:
                colors: '#94a3b8'
          tooltip:
            theme: dark
        card_mod:
          style: |
            #header__title {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #f2e7ff;
              font-weight: 600;
            }
            #header__title::before {
              content: "";
              display: inline-block;
              flex: 0 0 21px;
              width: 21px;
              height: 21px;
              background: linear-gradient(145deg, #e879f9, #8b5cf6);
              -webkit-mask: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0xMy4yIDIgNC44IDEzaDYuMUw5LjggMjIgMTkuMiAxMGgtNi4zWiIvPjwvc3ZnPg==") center / contain no-repeat;
              mask: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0xMy4yIDIgNC44IDEzaDYuMUw5LjggMjIgMTkuMiAxMGgtNi4zWiIvPjwvc3ZnPg==") center / contain no-repeat;
              filter: drop-shadow(0 0 7px rgba(192,132,252,.68));
            }
            ha-card {
              background: linear-gradient(150deg, rgba(20,17,49,.98), rgba(43,22,66,.94));
              border: 1px solid rgba(192,132,252,.34);
              border-radius: 18px;
              box-shadow: 0 12px 30px rgba(0,0,0,.28), 0 0 22px rgba(192,132,252,.07);
              overflow: hidden;
            }

      ##########################################################################
      # Objectif quotidien — carte compacte unifiée
      ##########################################################################
      - type: custom:button-card
        entity: sensor.pcha_progression_objectif_quotidien
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: more-info
        triggers_update:
          - sensor.pcha_heure_atteinte_objectif
        view_layout:
          grid-area: objectif
        custom_fields:
          contenu: |
            [[[
              const get = (id) => states[id];
              const valid = (s) => s && !['unknown', 'unavailable', 'none', ''].includes(s.state);
              const duration = (id) => {
                const s = get(id);
                if (!valid(s)) return '—';
                const number = Number(s.state);
                const unit = s.attributes.unit_of_measurement || '';
                if (!Number.isFinite(number)) return `${s.state}${unit ? ` ${unit}` : ''}`;
                const minutes = unit === 'h' ? number * 60 : number;
                const hours = Math.floor(minutes / 60);
                const mins = Math.round(minutes % 60);
                return `${String(hours).padStart(2, '0')}h${String(mins).padStart(2, '0')}`;
              };
              const temperature = (id) => {
                const s = get(id);
                if (!valid(s)) return '—';
                const unit = s.attributes.unit_of_measurement || '°C';
                return `${s.state} ${unit}`;
              };
              const targetTime = () => {
                const s = get('sensor.pcha_heure_atteinte_objectif');
                return valid(s) ? s.state : '—';
              };
              const progress = Math.max(0, Math.min(100, Number(entity.state) || 0));
              return `
                <div class="pcha-objectif-entete">
                  <ha-icon icon="mdi:target-variant"></ha-icon>
                  <span>Objectif quotidien</span>
                </div>
                <div class="pcha-objectif-corps">
                  <div class="pcha-objectif-details">
                    <div><span>Objectif</span><strong>${duration('sensor.pcha_objectif_filtration_quotidien')}</strong></div>
                    <div><span>Référence</span><strong>${temperature('sensor.pcha_temperature_reference_objectif_quotidien')}</strong></div>
                    <div><span>Temps réalisé</span><strong>${duration('sensor.pcha_temps_filtration_realise')}</strong></div>
                    <div><span>Temps restant</span><strong>${duration('sensor.pcha_temps_filtration_restant')}</strong></div>
                    <div><span>À atteindre à</span><strong>${targetTime()}</strong></div>
                  </div>
                  <div class="pcha-objectif-anneau" style="--progress:${progress}">
                    <div class="pcha-objectif-centre">
                      <b class="pcha-progress-pourcentage"><span>${Math.round(progress)}</span><small>%</small></b>
                      <ha-icon icon="mdi:waves"></ha-icon>
                    </div>
                  </div>
                </div>`;
            ]]]
        styles:
          card:
            - background: linear-gradient(145deg, rgba(20,17,49,.98), rgba(8,28,46,.98))
            - border: 1px solid rgba(167,139,250,.36)
            - border-radius: 20px
            - box-shadow: 0 16px 40px rgba(0,0,0,.34), 0 0 34px rgba(139,92,246,.10)
            - padding: 18px 20px
            - height: 100%
          grid:
            - grid-template-areas: '"contenu"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
          custom_fields:
            contenu:
              - width: 100%
              - height: 100%
              - justify-self: stretch
              - text-align: left
        extra_styles: |
            .pcha-objectif-entete {
              display: flex;
              align-items: center;
              justify-content: flex-start;
              gap: 10px;
              width: 100%;
              color: #f8fafc;
              font-size: 19px;
              font-weight: 750;
              margin-bottom: 14px;
              text-align: left;
            }
            .pcha-objectif-entete ha-icon {
              color: #a78bfa;
              width: 25px;
              min-width: 25px;
              flex: 0 0 25px;
            }
            .pcha-objectif-corps {
              display: grid;
              grid-template-columns: minmax(0, 1fr) 150px;
              align-items: center;
              gap: 16px;
              width: 100%;
            }
            .pcha-objectif-details > div {
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 12px;
              min-height: 38px;
              border-bottom: 1px solid rgba(148,163,184,.14);
              color: #cbd5e1;
              font-size: 13px;
            }
            .pcha-objectif-details > div:last-child {
              border-bottom: 0;
            }
            .pcha-objectif-details strong {
              color: #67e8f9;
              font-size: 16px;
              font-weight: 700;
              white-space: nowrap;
            }
            .pcha-objectif-details > div:nth-child(2) strong,
            .pcha-objectif-details > div:nth-child(4) strong {
              color: #a78bfa;
            }
            .pcha-objectif-anneau {
              width: 146px;
              height: 146px;
              padding: 12px;
              position: relative;
              border-radius: 50%;
              background: conic-gradient(from -90deg, #22d3ee 0%, #38bdf8 calc(var(--progress) * .35%), #8b5cf6 calc(var(--progress) * .72%), #e879f9 calc(var(--progress) * 1%), rgba(30,58,82,.50) calc(var(--progress) * 1%) 100%);
              box-shadow: 0 0 12px rgba(34,211,238,.22), 0 0 28px rgba(139,92,246,.14), inset 0 0 18px rgba(232,121,249,.10);
              outline: 1px solid rgba(103,232,249,.16);
              box-sizing: border-box;
            }
            .pcha-objectif-centre {
              width: 100%;
              height: 100%;
              display: flex;
              flex-direction: column;
              justify-content: center;
              align-items: center;
              gap: 0;
              border-radius: 50%;
              background: radial-gradient(circle at 50% 35%, rgba(19,47,71,.98), #071827 68%);
              border: 1px solid rgba(34,211,238,.35);
              color: #67e8f9;
              box-shadow: inset 0 0 22px rgba(34,211,238,.08);
            }
            .pcha-objectif-centre ha-icon {
              width: 31px;
              height: 31px;
              color: #67e8f9;
              opacity: .76;
              transform: translateY(-3px);
            }
            .pcha-progress-pourcentage {
              display: flex;
              align-items: flex-start;
              justify-content: center;
              line-height: 1;
              transform: translateY(-8px);
              background: linear-gradient(110deg, #67e8f9 5%, #38bdf8 42%, #a78bfa 72%, #f0abfc 100%);
              -webkit-background-clip: text;
              background-clip: text;
              color: transparent;
              filter: drop-shadow(0 0 7px rgba(56,189,248,.28));
              font-weight: 850;
              letter-spacing: -1px;
            }
            .pcha-progress-pourcentage span {
              font-size: 30px;
            }
            .pcha-progress-pourcentage small {
              font-size: 15px;
              margin: 2px 0 0 2px;
              font-weight: 750;
            }
            @media (max-width: 700px) {
              .pcha-objectif-corps {
                grid-template-columns: 1fr;
              }
              .pcha-objectif-anneau {
                justify-self: center;
              }
            }

      ##########################################################################
      # Réglages rapides
      ##########################################################################
      - type: custom:button-card
        show_icon: false
        show_name: false
        tap_action:
          action: none
        view_layout:
          grid-area: reglages-titre
        custom_fields:
          titre: Réglages rapides
        styles:
          card:
            - background: rgba(7,24,40,.78)
            - border: 1px solid rgba(34,211,238,.20)
            - border-radius: 16px
            - padding: 9px 16px
            - min-height: 42px
            - box-shadow: none
          grid:
            - grid-template-areas: '"titre"'
            - grid-template-columns: 1fr
          custom_fields:
            titre:
              - justify-self: start
              - color: '#f8fafc'
              - font-size: 18px
              - font-weight: 750

