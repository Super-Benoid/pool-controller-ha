        {{ states('sensor.tesla_ble_charging_state') | lower == 'charging' and
           is_number(states('sensor.tesla_ble_minutes_to_limit')) and
           states('sensor.tesla_ble_minutes_to_limit') | float(0) >= 0 and
           is_number(states('number.tesla_ble_charging_limit')) }}
  actions:
    - variables:
        texte_fin: >-
          {% set minutes = states('sensor.tesla_ble_minutes_to_limit') | float(0) %}
          {% set fin_timestamp = as_timestamp(now()) + (minutes * 60) %}
          {{ fin_timestamp | timestamp_custom('%H:%M', true) }}
        texte_limite: >-
          {{ 'L' ~ (states('number.tesla_ble_charging_limit') | float(0) | round(0) | int) ~ '%' }}
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_fin_texte
        payload: "{{ texte_fin }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_fin_texte
        payload: "{{ texte_limite }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_fin_texte
        payload: "{{ texte_fin }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_fin_texte
        payload: "{{ texte_limite }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_fin_texte
        payload: "{{ texte_fin }}"
        qos: 0
        retain: true

- id: awtrix_salon_notifications_persistantes
  alias: "AWTRIX Salon - Alertes Home Assistant"
  description: >-
    Reproduit les nouvelles notifications persistantes de Home Assistant sur
    l'AWTRIX sous forme de notification prioritaire. Les notifications PCHA
    sont ignorées ici car l'automatisation dédiée les affiche en version courte.
  mode: queued
  max: 10
  triggers:
    - trigger: persistent_notification
      update_type:
        - added
        - updated
  conditions:
    - condition: template
      value_template: >-
        {% set titre = trigger.notification.title | default('', true) | upper %}
        {{ not titre.startswith('PCHA') }}
  actions:
    - condition: template
      value_template: >-
        {% set titre = trigger.notification.title | default('', true) | upper %}
        {% set identifiant = trigger.notification.notification_id | default('', true) | lower %}
        {{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE')
           or not (titre.startswith('PCHA') or identifiant.startswith('pcha_')) }}
    - action: mqtt.publish
      data:
        topic: awtrix_salon/notify
        qos: 0
        retain: false
        payload: >-
          {% set titre = trigger.notification.title | default('Home Assistant', true) %}
          {% set message = trigger.notification.message | default('', true) | striptags | replace('\n', ' ') %}
          {% set texte = (titre ~ ' - ' ~ message)[:180] %}
          {{ {
            'text': texte,
            'textCase': 2,
            'color': '#F59E0B',
            'duration': 12,
            'repeat': 2,
            'stack': false,
            'wakeup': true
          } | to_json }}

- id: awtrix_salon_alertes_pcha
  alias: "AWTRIX Salon - Défauts PCHA"
  description: >-
    Maintient l'alerte PCHA au premier plan en niveau critique. La retire au
    retour à un niveau normal ou dégradé, ou lors de l'acquittement PCHA.
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_select.pcha_niveau_fonctionnement
      id: niveau
    - trigger: state
      entity_id:
        - binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
        - binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
        - binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
        - binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
        - binary_sensor.pcha_diagnostic_mes_005_liaison_esp32_indisponible
      to: "on"
      id: diagnostic
    - trigger: state
      entity_id:
        - binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
        - binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
        - binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
        - binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
        - binary_sensor.pcha_diagnostic_mes_005_liaison_esp32_indisponible
      to: "off"
      id: diagnostic_resolu
    - trigger: state
      entity_id: input_boolean.pcha_acquitter_alarmes
      to: "on"
      id: acquittement
    - trigger: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      id: mode_pcha
  conditions: []
  actions:
    - condition: template
      value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% set niveau = states('input_select.pcha_niveau_fonctionnement') | upper %}
                {% set aucun_diagnostic =
                  not is_state('binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible', 'on') and
                  not is_state('binary_sensor.pcha_diagnostic_mes_002_debit_indisponible', 'on') and
                  not is_state('binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible', 'on') and
                  not is_state('binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible', 'on') and
                  not is_state('binary_sensor.pcha_diagnostic_mes_005_liaison_esp32_indisponible', 'on') %}
                {{ trigger.id == 'acquittement' or
                   (trigger.id == 'niveau' and 'CRITIQUE' not in niveau) or
                   (trigger.id == 'diagnostic_resolu' and aucun_diagnostic) }}
          sequence:
            - action: mqtt.publish
              data:
                topic: awtrix_salon/notify/dismiss
                qos: 0
                retain: false
                payload: ""
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {% set niveau = states('input_select.pcha_niveau_fonctionnement') | upper %}
                {% set gravite_diagnostic =
                  (state_attr(trigger.entity_id, 'gravite') | default('', true) | upper)
                  if trigger.id == 'diagnostic' else '' %}
                {{
                  (trigger.id == 'diagnostic' and
                   ('CRITIQUE' in gravite_diagnostic or 'CRITIQUE' not in niveau)) or
                  (trigger.id == 'niveau' and
                   ('CRITIQUE' in niveau or 'DEGRAD' in niveau or 'DÉGRAD' in niveau))
                }}
          sequence:
            - action: mqtt.publish
              data:
                topic: awtrix_salon/notify
                qos: 0
                retain: false
                payload: >-
                  {% set niveau = states('input_select.pcha_niveau_fonctionnement') %}
                  {% if trigger.id == 'diagnostic' %}
                    {% set gravite = state_attr(trigger.entity_id, 'gravite') | default('DEGRADE', true) | upper %}
                    {% set critique = 'CRITIQUE' in gravite %}
                    {% set libelles = {
                      'binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible': 'Sonde temp. indisponible',
                      'binary_sensor.pcha_diagnostic_mes_002_debit_indisponible': 'Debit indisponible',
                      'binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible': 'Puissance indisponible',
                      'binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible': 'Luminosite indisponible',
                      'binary_sensor.pcha_diagnostic_mes_005_liaison_esp32_indisponible': 'Liaison ESP32 indisponible'
                    } %}
                    {% set texte = 'PCHA - ' ~ libelles.get(trigger.entity_id, 'Defaut mesure') %}
                  {% else %}
                    {% set critique = 'CRITIQUE' in (niveau | upper) %}
                    {% set texte = 'PCHA - Niveau ' ~ niveau %}
                  {% endif %}
                  {{ {
                    'text': texte,
                    'textCase': 2,
                    'color': '#EF4444' if critique else '#F59E0B',
                    'background': '#220000' if critique else '#1A1000',
                    'duration': 15,
                    'repeat': 2,
                    'hold': critique,
                    'blinkText': 500 if critique else 0,
                    'stack': false,
                    'wakeup': true
                  } | to_json }}

- id: awtrix_salon_vigilance_meteo
  alias: "AWTRIX Salon - Vigilance météo"
  description: >-
    Affiche les changements de vigilance Météo-France supérieurs au niveau vert.
  mode: restart
  triggers:
    - trigger: state
      entity_id: sensor.meteo_france_alert_for_department_49_49_weather_alert
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and
           trigger.to_state.state | lower not in
           ['vert', 'green', '0', 'none', 'unknown', 'unavailable'] }}
  actions:
    - action: mqtt.publish
      data:
        topic: awtrix_salon/notify
        qos: 0
        retain: false
        payload: >-
          {% set niveau = trigger.to_state.state %}
          {% set niveau_min = niveau | lower %}
          {% set couleur = '#EF4444' if 'rouge' in niveau_min or 'red' in niveau_min else ('#F97316' if 'orange' in niveau_min else '#FACC15') %}
          {{ {
            'text': 'Vigilance meteo 49 - ' ~ niveau,
            'textCase': 2,
            'color': couleur,
            'duration': 15,
            'repeat': 2,
            'stack': false,
            'wakeup': true
          } | to_json }}

- id: awtrix_salon_lave_linge
  alias: "AWTRIX Salon - Temps restant lave-linge"
  description: >-
    Ajoute une page AWTRIX pendant le cycle du lave-linge. Le temps restant
    provient de SmartThings et la pince amperemetrique confirme que la machine
    fonctionne. L'etat de la tache a priorite sur une heure de fin SmartThings
    obsolete afin d'eviter la reapparition de la page apres le cycle.
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time_pattern
      minutes: "/1"
      id: periodique
    - trigger: numeric_state
      entity_id: sensor.seche_linge_et_lave_linge_power_b
      above: 8
      for: "00:00:30"
      id: puissance_active
    - trigger: numeric_state
      entity_id: sensor.seche_linge_et_lave_linge_power_b
      below: 8
      for: "00:02:00"
      id: puissance_repos
    - trigger: state
      entity_id: sensor.lave_linge_completion_time
      id: heure_fin
    - trigger: state
      entity_id:
        - sensor.lave_linge_job_state
        - sensor.lave_linge_washer_job_state
      id: etat_tache
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('manuel') == 'demarrage' }}"
      then:
        - delay: "00:00:40"

    - variables:
        puissance: >-
          {{ states('sensor.seche_linge_et_lave_linge_power_b') | float(0) }}
        etat_tache: >-
          {% set etat_simple = states('sensor.lave_linge_job_state') %}
          {% set etat_washer = states('sensor.lave_linge_washer_job_state') %}
          {% set invalides = ['', 'unknown', 'unavailable'] %}
          {{ etat_simple if etat_simple | lower not in invalides else etat_washer }}
        fin_timestamp: >-
          {{ as_timestamp(states('sensor.lave_linge_completion_time'), 0) | float(0) }}
        maintenant_timestamp: "{{ as_timestamp(now()) | float(0) }}"
        heure_fin_valide: >-
          {% set fin = as_timestamp(states('sensor.lave_linge_completion_time'), 0) | float(0) %}
          {% set maintenant = as_timestamp(now()) | float(0) %}
          {{ fin >= maintenant - 300 and fin < maintenant + 43200 }}
        cycle_actif: >-
          {% set fin = as_timestamp(states('sensor.lave_linge_completion_time'), 0) | float(0) %}
          {% set maintenant = as_timestamp(now()) | float(0) %}
          {% set puissance_lave_linge = states('sensor.seche_linge_et_lave_linge_power_b') | float(0) %}
          {% set etat = etat_tache | trim | lower %}
          {% set invalides = ['', 'unknown', 'unavailable'] %}
          {% set termines = ['none', 'finish', 'finished', 'fin', 'complete',
                             'completed', 'idle', 'inactive', 'inactif', 'off',
                             'ready', 'stop', 'stopped', 'poweroff', 'power_off'] %}
          {% if etat not in invalides %}
            {{ etat not in termines }}
          {% else %}
            {{ puissance_lave_linge >= 8 or
               (fin > maintenant and fin < maintenant + 43200) }}
          {% endif %}
        etat_tache_termine: >-
          {% set etat = etat_tache | trim | lower %}
          {% set termines = ['none', 'finish', 'finished', 'fin', 'complete',
                             'completed', 'idle', 'inactive', 'inactif', 'off',
                             'ready', 'stop', 'stopped', 'poweroff', 'power_off'] %}
          {{ etat in termines }}
        transition_fin: >-
          {% set actuel = etat_tache | trim | lower %}
          {% set avant = trigger.from_state.state | default('', true) | lower
             if trigger.id | default('manuel') == 'etat_tache' and trigger.from_state is not none
             else '' %}
          {% set invalides = ['', 'unknown', 'unavailable'] %}
          {% set termines = ['none', 'finish', 'finished', 'fin', 'complete',
                             'completed', 'idle', 'inactive', 'inactif', 'off',
                             'ready', 'stop', 'stopped', 'poweroff', 'power_off'] %}
          {{ trigger.id | default('manuel') == 'etat_tache' and
             actuel in termines and avant not in invalides and avant not in termines }}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ cycle_actif | bool }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/lave_linge
                qos: 0
                retain: false
                payload: >-
                  {% set fin = fin_timestamp | float(0) %}
                  {% set maintenant = maintenant_timestamp | float(0) %}
                  {% if heure_fin_valide | bool %}
                    {% set secondes = [fin - maintenant, 0] | max %}
                    {% set minutes = ((secondes + 59) // 60) | int %}
                    {% if minutes >= 60 %}
                      {% set heures = (minutes // 60) | int %}
                      {% set reste = (minutes % 60) | int %}
                      {% set texte = heures ~ 'h' ~ ('%02d' | format(reste)) %}
                    {% elif minutes > 0 %}
                      {% set texte = minutes ~ 'm' %}
                    {% else %}
                      {% set texte = '<1m' %}
                    {% endif %}
                    {% set couleur = '#EF4444' if minutes <= 5 else ('#F59E0B' if minutes <= 15 else '#38BDF8') %}
                  {% else %}
                    {% set texte = '--' %}
                    {% set couleur = '#94A3B8' %}
                  {% endif %}
                  {% set x_texte = 10 if texte | length >= 4 else 12 %}
                  {{ {
                    'icon': '11483',
                    'pushIcon': 0,
                    'draw': [{'dt': [x_texte, 1, texte, couleur]}],
                    'duration': 7,
                    'lifetime': 180,
                    'lifetimeMode': 1
                  } | to_json }}
        - conditions:
            - condition: template
              value_template: "{{ transition_fin | bool }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/lave_linge
                qos: 0
                retain: false
                payload: >-
                  {{ {
                    'icon': '10939',
                    'pushIcon': 0,
                    'text': 'Fin',
                    'textCase': 2,
                    'color': '#22C55E',
                    'blinkText': 500,
                    'duration': 7,
                    'lifetime': 600,
                    'lifetimeMode': 0
                  } | to_json }}
        - conditions:
            - condition: template
              value_template: "{{ etat_tache_termine | bool }}"
          sequence:
            - delay:
                milliseconds: 1
      default:
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/lave_linge
            payload: ""
            qos: 0
            retain: false

- id: awtrix_salon_lave_linge_vide
  alias: "AWTRIX Salon - Lave-linge vidé"
  description: >-
    Efface la page de fin du lave-linge lorsque l'interrupteur virtuel exposé
    à Alexa est activé, puis remet automatiquement cet interrupteur à l'arrêt.
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.lave_linge_vide
      to: "on"
  actions:
    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/lave_linge
        payload: ""
        qos: 0
        retain: false
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.lave_linge_vide

- id: awtrix_salon_hivernage_pcha
  alias: "AWTRIX Salon - Retirer PCHA en hivernage"
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      to: HIVERNAGE
      id: mode_pcha
    - trigger: homeassistant
      event: start
      id: demarrage
  conditions:
    - condition: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      state: HIVERNAGE
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id == 'demarrage' }}"
      then:
        - delay: "00:00:15"
    - condition: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      state: HIVERNAGE
    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/piscine
        payload: ""
        qos: 1
        retain: true
    - action: mqtt.publish
      data:
        topic: awtrix_salon/notify/dismiss
        payload: ""
        qos: 1
        retain: false
