# AWTRIX 3 - Ulanzi TC001 du salon
# Préfixe MQTT : awtrix_salon
#
# À charger depuis configuration.yaml avec :
# automation awtrix_salon: !include awtrix_salon.yaml
# Le fichier /config/awtrix_salon.yaml est un lien vers ce fichier du dépôt.

- id: awtrix_salon_affichages_principaux
  alias: "AWTRIX Salon - Météo, énergie et piscine"
  description: >-
    Actualise les pages permanentes de la rotation AWTRIX toutes les cinq
    minutes, après le démarrage de Home Assistant et lors d'un changement
    d'état du chauffage solaire.
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time_pattern
      minutes: "/5"
      id: periodique
    - trigger: state
      entity_id: binary_sensor.pcha_chauffage_solaire_actif
      id: chauffage_solaire
    - trigger: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      id: mode_pcha
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('manuel') == 'demarrage' }}"
      then:
        - delay: "00:00:30"

    - action: weather.get_forecasts
      target:
        entity_id: weather.meteo_france_forecast_for_city_montreuil_juigne_pays_de_la_loire_49_fr_montreuil_juigne
      data:
        type: daily
      response_variable: previsions_meteo
      continue_on_error: true

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/meteo
        qos: 0
        retain: false
        payload: >-
          {% set entite = 'weather.meteo_france_forecast_for_city_montreuil_juigne_pays_de_la_loire_49_fr_montreuil_juigne' %}
          {% set condition = states(entite) %}
          {% set bleu = '#38BDF8' %}
          {% set icones = {
            'sunny': '2282', 'clear-night': '962',
            'cloudy': 'meteo_nuage',
            'partlycloudy': 'meteo_partiellement_nuageux',
            'windy': '14961', 'windy-variant': '62874',
            'rainy': 'meteo_pluie', 'pouring': '76896',
            'hail': '2441', 'lightning': '23713',
            'lightning-rainy': '23713', 'snowy': '6473',
            'snowy-rainy': '49301', 'fog': '73809',
            'exceptional': '56707'
          } %}
          {% set icone = icones.get(condition, 'meteo_nuage') %}
          {% set temperature = states('sensor.temperature_exterieure_temperature') | float(0) %}
          {% set temperature_texte = (temperature | round(1)) ~ '°' if has_value('sensor.temperature_exterieure_temperature') else '--' %}
          {{ {
            'icon': icone,
            'pushIcon': 0,
            'draw': [{'dt': [10, 1, temperature_texte, bleu]}],
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 1
          } | to_json }}

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/temperature_salon
        qos: 0
        retain: false
        payload: >-
          {% set entite = 'sensor.temperature_salon_temperature' %}
          {% set disponible = has_value(entite) %}
          {% set temperature = states(entite) | float(0) %}
          {% set temperature_texte = ((temperature | round(1)) ~ '°') if disponible else '--' %}
          {% if not disponible %}
            {% set couleur = '#94A3B8' %}
          {% elif temperature < 19 %}
            {% set couleur = '#38BDF8' %}
          {% elif temperature < 23 %}
            {% set couleur = '#22C55E' %}
          {% elif temperature < 27 %}
            {% set couleur = '#F97316' %}
          {% else %}
            {% set couleur = '#EF4444' %}
          {% endif %}
          {{ {
            'icon': '7112',
            'pushIcon': 0,
            'draw': [{'dt': [10, 1, temperature_texte, couleur]}],
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 1
          } | to_json }}

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/demain
        qos: 0
        retain: false
        payload: >-
          {% set entite = 'weather.meteo_france_forecast_for_city_montreuil_juigne_pays_de_la_loire_49_fr_montreuil_juigne' %}
          {% set donnees = previsions_meteo | default({}, true) %}
          {% set previsions = donnees.get(entite, {}).get('forecast', []) %}
          {% set demain = previsions[1] if previsions | count > 1 else (previsions[0] if previsions | count > 0 else {}) %}
          {% set condition = demain.get('condition', 'cloudy') %}
          {% set tmax = demain.get('temperature') %}
          {% set tmin = demain.get('templow') %}
          {% set violet = '#A78BFA' %}
          {% set icones = {
            'sunny': '2282', 'clear-night': '962',
            'cloudy': 'meteo_nuage',
            'partlycloudy': 'meteo_partiellement_nuageux',
            'windy': '14961', 'windy-variant': '62874',
            'rainy': 'meteo_pluie', 'pouring': '76896',
            'hail': '2441', 'lightning': '23713',
            'lightning-rainy': '23713', 'snowy': '6473',
            'snowy-rainy': '49301', 'fog': '73809',
            'exceptional': '56707'
          } %}
          {% set icone = icones.get(condition, 'meteo_nuage') %}
          {% set temperatures = ((tmin | round(0) | int) ~ '/' ~ (tmax | round(0) | int)) if tmin is not none and tmax is not none else '--/--' %}
          {{ {
            'icon': icone,
            'pushIcon': 0,
            'draw': [
              {'dp': [8, 2, violet]}, {'dp': [9, 3, violet]},
              {'dp': [8, 4, violet]}, {'dt': [11, 1, temperatures, violet]}
            ],
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 1
          } | to_json }}

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/energie
        qos: 0
        retain: false
        payload: >-
          {% set puissance = states('sensor.logement_puissance') | float(0) %}
          {% set couleur = '#22C55E' if puissance < 5300 else ('#F59E0B' if puissance < 8000 else '#EF4444') %}
          {% set progression = (puissance / 9000 * 100) | round(0) | int %}
          {% set progression = 0 if progression < 0 else (100 if progression > 100 else progression) %}
          {% set valeur = ((puissance / 1000) | round(1)) ~ 'kW' if puissance >= 1000 else (puissance | round(0) | int) ~ 'W' %}
          {% set maison = [
            {'dp': [3, 0, '#22C55E']},
            {'dl': [2, 1, 4, 1, '#22C55E']},
            {'dl': [1, 2, 5, 2, '#22C55E']},
            {'dl': [0, 3, 6, 3, '#22C55E']},
            {'dl': [0, 4, 6, 4, '#FFFFFF']},
            {'dp': [0, 5, '#FFFFFF']}, {'dl': [1, 5, 5, 5, '#38BDF8']}, {'dp': [6, 5, '#FFFFFF']},
            {'df': [2, 5, 2, 1, '#F97316']},
            {'dl': [0, 6, 6, 6, '#FFFFFF']}
          ] %}
          {{ {
            'draw': maison + [{'dt': [10, 1, valeur, couleur]}],
            'duration': 7,
            'progress': progression,
            'progressC': couleur,
            'progressBC': '#102030',
            'lifetime': 900,
            'lifetimeMode': 1
          } | to_json }}

    - if:
        - condition: template
          value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
      then:
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/piscine
            qos: 0
            retain: false
            payload: >-
              {% set temperature = states('sensor.pcha_temperature_piscine') %}
              {% set debit = states('sensor.pcha_debit_filtration') | float(0) %}
              {% set pompe = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
              {% set chauffage_solaire = is_state('binary_sensor.pcha_chauffage_solaire_actif', 'on') %}
              {% set etat = states('input_select.pcha_etat_machine') %}
              {% set niveau = states('input_select.pcha_niveau_fonctionnement') %}
              {% set niveau_normalise = niveau | upper %}
              {% set couleur = '#EF4444' if 'CRITIQUE' in niveau_normalise else ('#F59E0B' if 'DEGRAD' in niveau_normalise or 'DÉGRAD' in niveau_normalise else '#22D3EE') %}
              {% set temperature_texte = ((temperature | float(0) | round(1)) ~ '') if temperature not in ['unknown', 'unavailable', 'none', ''] else '--' %}
              {% set attente = [
                {'dl': [25, 0, 31, 0, '#FFFFFF']},
                {'dp': [26, 1, '#FFFFFF']}, {'dl': [27, 1, 29, 1, '#22D3EE']}, {'dp': [30, 1, '#FFFFFF']},
                {'dp': [27, 2, '#FFFFFF']}, {'dp': [28, 2, '#22D3EE']}, {'dp': [29, 2, '#FFFFFF']},
                {'dp': [28, 3, '#22D3EE']}, {'dp': [28, 4, '#22D3EE']},
                {'dp': [27, 5, '#FFFFFF']}, {'dp': [28, 5, '#22D3EE']}, {'dp': [29, 5, '#FFFFFF']},
                {'dp': [26, 6, '#FFFFFF']}, {'dl': [27, 6, 29, 6, '#22D3EE']}, {'dp': [30, 6, '#FFFFFF']},
                {'dl': [25, 7, 31, 7, '#FFFFFF']}
              ] %}
              {% set filtration = [
                {'dp': [28, 1, '#8AFF0F']},
                {'dp': [28, 2, '#8AFF0F']}, {'dp': [29, 2, '#C3FF0F']},
                {'dl': [24, 3, 25, 3, '#78E208']}, {'dp': [26, 3, '#73D50B']},
                {'dp': [27, 3, '#68BD0F']}, {'dl': [28, 3, 29, 3, '#8AFF0F']},
                {'dp': [30, 3, '#C3FF0F']},
                {'dl': [24, 4, 25, 4, '#78E208']}, {'dp': [26, 4, '#73D50B']},
                {'dp': [27, 4, '#68BD0F']}, {'dl': [28, 4, 29, 4, '#8AFF0F']},
                {'dp': [30, 4, '#C3FF0F']},
                {'dp': [28, 5, '#8AFF0F']}, {'dp': [29, 5, '#C3FF0F']},
                {'dp': [28, 6, '#8AFF0F']}
              ] %}
              {% set filtration_solaire = [
                {'dp': [28, 1, '#F73818']},
                {'dp': [28, 2, '#F75E18']}, {'dp': [29, 2, '#F75E18']},
                {'dl': [24, 3, 30, 3, '#F69618']},
                {'dl': [24, 4, 30, 4, '#F6CF18']},
                {'dp': [28, 5, '#F7E718']}, {'dp': [29, 5, '#F7E718']},
                {'dp': [28, 6, '#F7F718']}
              ] %}
              {% set defaut = [
                {'dl': [28, 0, 24, 7, '#EF4444']}, {'dl': [28, 0, 31, 7, '#EF4444']},
                {'dl': [24, 7, 31, 7, '#EF4444']}, {'dt': [27, 1, '!', '#EF4444']}
              ] %}
              {% set arret = [
                {'dr': [25, 1, 6, 6, '#94A3B8']}, {'df': [27, 3, 2, 2, '#94A3B8']}
              ] %}
              {% set etat_normalise = etat | upper %}
              {% if pompe or 'FILTRATION' in etat_normalise %}
                {% set icone_etat = filtration_solaire if chauffage_solaire else filtration %}
              {% elif 'ATTENTE' in etat_normalise %}
                {% set icone_etat = attente %}
              {% elif 'DEFAUT' in etat_normalise or 'DÉFAUT' in etat_normalise or 'BLOQUANT' in etat_normalise or 'CRITIQUE' in niveau_normalise %}
                {% set icone_etat = defaut %}
              {% else %}
                {% set icone_etat = arret %}
              {% endif %}
              {{ {
                'icon': '21645',
                'pushIcon': 0,
                'draw': [{'dt': [10, 1, temperature_texte, couleur]}] + icone_etat,
                'duration': 7,
                'lifetime': 900,
                'lifetimeMode': 1
              } | to_json }}
      else:
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/piscine
            payload: ""
            qos: 1
            retain: true

- id: awtrix_salon_affichage_tesla
  alias: "AWTRIX Salon - Tesla contextuelle"
  description: >-
    Affiche la batterie lorsque la Tesla est branchée et alterne avec la
    puissance instantanée pendant la recharge. Retire les pages au débranchement.
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time_pattern
      minutes: "/1"
      id: periodique
    - trigger: state
      entity_id:
        - binary_sensor.tesla_vehicule_branche
        - sensor.tesla_ble_charging_state
        - sensor.tesla_ble_charge_level
        - number.tesla_ble_charging_limit
        - sensor.recharge_ve_puissance_phase_a
      id: changement
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('manuel') == 'demarrage' }}"
      then:
        - delay: "00:00:35"
    - variables:
        etat_charge: "{{ states('sensor.tesla_ble_charging_state') }}"
        tesla_branchee: >-
          {% set etat = states('sensor.tesla_ble_charging_state') | lower %}
          {{ is_state('binary_sensor.tesla_vehicule_branche', 'on') or
             etat not in ['', 'unknown', 'unavailable', 'none', 'disconnected'] }}
    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/tesla
        payload: ""
        qos: 0
        retain: false
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ tesla_branchee }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/voiture_batterie
                qos: 0
                retain: false
                payload: >-
                  {% set batterie = states('sensor.tesla_ble_charge_level') | float(0) %}
                  {% set limite = states('number.tesla_ble_charging_limit') | float(100) %}
                  {% set etat = etat_charge | lower %}
                  {% set couleur = '#22C55E' if batterie >= limite else ('#38BDF8' if etat == 'charging' else '#A78BFA') %}
                  {% set progression = batterie | round(0) | int %}
                  {% set icone_voiture = '69207' if etat == 'charging' else '59656' %}
                  {% set texte_pourcentage = progression ~ '%' %}
                  {% set x_pourcentage = 8 if progression >= 100 else (10 if progression >= 10 else 12) %}
                  {{ {
                    'icon': icone_voiture,
                    'pushIcon': 0,
                    'draw': [{'dt': [x_pourcentage, 1, texte_pourcentage, couleur]}],
                    'duration': 7,
                    'progress': progression,
                    'progressC': couleur,
                    'progressBC': '#151022',
                    'lifetime': 180,
                    'lifetimeMode': 1
                  } | to_json }}
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ etat_charge | lower == 'charging' }}"
                  sequence:
                    - action: mqtt.publish
                      data:
                        topic: awtrix_salon/custom/voiture_puissance
                        qos: 0
                        retain: false
                        payload: >-
                          {% set batterie = states('sensor.tesla_ble_charge_level') | float(0) %}
                          {% set progression = batterie | round(0) | int %}
                          {% set puissance_disponible = has_value('sensor.recharge_ve_puissance_phase_a') %}
                          {% set puissance = states('sensor.recharge_ve_puissance_phase_a') | float(0) %}
                          {% set texte_puissance = ((puissance | round(1)) ~ 'kW') if puissance_disponible else '--kW' %}
                          {% set x_puissance = 8 if puissance >= 10 else 9 %}
                          {{ {
                            'icon': '69207',
                            'pushIcon': 0,
                            'draw': [{'dt': [x_puissance, 1, texte_puissance, '#FFD43B']}],
                            'duration': 7,
                            'progress': progression,
                            'progressC': '#38BDF8',
                            'progressBC': '#151022',
                            'lifetime': 180,
                            'lifetimeMode': 1
                          } | to_json }}
              default:
                - action: mqtt.publish
                  data:
                    topic: awtrix_salon/custom/voiture_puissance
                    payload: ""
                    qos: 0
                    retain: false
      default:
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/voiture_batterie
            payload: ""
            qos: 0
            retain: false
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/voiture_puissance
            payload: ""
            qos: 0
            retain: false

- id: awtrix_salon_notifications_persistantes
  alias: "AWTRIX Salon - Alertes Home Assistant"
  description: >-
    Reproduit les nouvelles notifications persistantes de Home Assistant sur
    l'AWTRIX sous forme de notification prioritaire.
  mode: queued
  max: 10
  triggers:
    - trigger: persistent_notification
      update_type:
        - added
        - updated
  actions:
    - condition: template
      value_template: >-
        {% set titre = trigger.notification.title | default('', true) | upper %}
        {% set identifiant = trigger.notification.notification_id | default('', true) | lower %}
        {{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE')
           or not (titre.startswith('PCHA') or identifiant.startswith('pcha_')) }}
    - action: mqtt.publish
      data:
        topic: awtrix_salon/notify
        qos: 0
        retain: false
        payload: >-
          {% set titre = trigger.notification.title | default('Home Assistant', true) %}
          {% set message = trigger.notification.message | default('', true) | striptags | replace('\n', ' ') %}
          {% set texte = (titre ~ ' - ' ~ message)[:180] %}
          {{ {
            'text': texte,
            'textCase': 2,
            'color': '#F59E0B',
            'duration': 12,
            'repeat': 2,
            'stack': false,
            'wakeup': true
          } | to_json }}

- id: awtrix_salon_alertes_pcha
  alias: "AWTRIX Salon - Défauts PCHA"
  description: >-
    Affiche immédiatement les changements de niveau PCHA et les diagnostics
    de mesure connus. Une alerte critique reste affichée jusqu'à acquittement.
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_select.pcha_niveau_fonctionnement
      id: niveau
    - trigger: state
      entity_id:
        - binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
        - binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
        - binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
        - binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
        - binary_sensor.pcha_diagnostic_mes_005_liaison_esp32_indisponible
      to: "on"
      id: diagnostic
    - trigger: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      id: mode_pcha
  conditions:
    - condition: template
      value_template: >-
        {% set niveau = states('input_select.pcha_niveau_fonctionnement') | upper %}
        {{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') and (trigger.id == 'diagnostic' or
           ('CRITIQUE' in niveau) or
           ('DEGRAD' in niveau) or
           ('DÉGRAD' in niveau)) }}
  actions:
    - condition: template
      value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
    - action: mqtt.publish
      data:
        topic: awtrix_salon/notify
        qos: 0
        retain: false
        payload: >-
          {% set niveau = states('input_select.pcha_niveau_fonctionnement') %}
          {% set critique = 'CRITIQUE' in (niveau | upper) %}
          {% if trigger.id == 'diagnostic' %}
            {% set detail = trigger.to_state.name | default(trigger.entity_id, true) %}
            {% set texte = 'PCHA - ' ~ detail %}
          {% else %}
            {% set texte = 'PCHA - Niveau ' ~ niveau %}
          {% endif %}
          {{ {
            'text': texte,
            'textCase': 2,
            'color': '#EF4444' if critique else '#F59E0B',
            'background': '#220000' if critique else '#1A1000',
            'duration': 15,
            'repeat': 2,
            'hold': critique,
            'blinkText': 500 if critique else 0,
            'stack': false,
            'wakeup': true
          } | to_json }}

- id: awtrix_salon_vigilance_meteo
  alias: "AWTRIX Salon - Vigilance météo"
  description: >-
    Affiche les changements de vigilance Météo-France supérieurs au niveau vert.
  mode: restart
  triggers:
    - trigger: state
      entity_id: sensor.meteo_france_alert_for_department_49_49_weather_alert
  conditions:
    - condition: template
      value_template: >-
        {{ trigger.to_state is not none and
           trigger.to_state.state | lower not in
           ['vert', 'green', '0', 'none', 'unknown', 'unavailable'] }}
  actions:
    - action: mqtt.publish
      data:
        topic: awtrix_salon/notify
        qos: 0
        retain: false
        payload: >-
          {% set niveau = trigger.to_state.state %}
          {% set niveau_min = niveau | lower %}
          {% set couleur = '#EF4444' if 'rouge' in niveau_min or 'red' in niveau_min else ('#F97316' if 'orange' in niveau_min else '#FACC15') %}
          {{ {
            'text': 'Vigilance meteo 49 - ' ~ niveau,
            'textCase': 2,
            'color': couleur,
            'duration': 15,
            'repeat': 2,
            'stack': false,
            'wakeup': true
          } | to_json }}

# Effacement une fois à l'entrée et au démarrage HA en hiver.
# /notify/dismiss agit sur la notification courante, sans identifiant AWTRIX.
# Ne pas le répéter périodiquement : préserver les nouvelles alertes hors PCHA.
- id: awtrix_salon_hivernage_pcha
  alias: "AWTRIX Salon - Retirer PCHA en hivernage"
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      to: HIVERNAGE
      id: mode_pcha
    - trigger: homeassistant
      event: start
      id: demarrage
  conditions:
    - condition: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      state: HIVERNAGE
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id == 'demarrage' }}"
      then:
        - delay: "00:00:15"
    - condition: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      state: HIVERNAGE
    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/piscine
        payload: ""
        qos: 1
        retain: true
    - action: mqtt.publish
      data:
        topic: awtrix_salon/notify/dismiss
        payload: ""
        qos: 1
        retain: false
