# AWTRIX 3 - Ulanzi TC001 du salon
# Préfixe MQTT : awtrix_salon
#
# À charger depuis configuration.yaml avec :
# automation awtrix_salon: !include awtrix_salon.yaml

- id: awtrix_salon_affichages_principaux
  alias: "AWTRIX Salon - Météo, énergie et piscine"
  description: >-
    Actualise les pages permanentes de la rotation AWTRIX toutes les cinq
    minutes, après le démarrage de Home Assistant et lors d'un changement
    d'état du chauffage solaire.
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time_pattern
      minutes: "/5"
      id: periodique
    - trigger: state
      entity_id: binary_sensor.pcha_chauffage_solaire_actif
      id: chauffage_solaire
    - trigger: state
      entity_id: input_select.pcha_mode_de_fonctionnement
      id: mode_pcha
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('manuel') == 'demarrage' }}"
      then:
        - delay: "00:00:30"

    - action: weather.get_forecasts
      target:
        entity_id: weather.meteo_france_forecast_for_city_montreuil_juigne_pays_de_la_loire_49_fr_montreuil_juigne
      data:
        type: daily
      response_variable: previsions_meteo
      continue_on_error: true

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/meteo
        qos: 0
        retain: false
        payload: >-
          {% set entite = 'weather.meteo_france_forecast_for_city_montreuil_juigne_pays_de_la_loire_49_fr_montreuil_juigne' %}
          {% set donnees = previsions_meteo | default({}, true) %}
          {% set previsions = donnees.get(entite, {}).get('forecast', []) %}
          {% set aujourdhui = previsions[0] if previsions | count > 0 else {} %}
          {% set condition = aujourdhui.get('condition', states(entite)) %}
          {% set tmax = aujourdhui.get('temperature') %}
          {% set tmin = aujourdhui.get('templow') %}
          {% set icones = {
            'sunny': '2282', 'clear-night': '962',
            'partlycloudy': 'meteo_partiellement_nuageux',
            'cloudy': 'meteo_nuage',
            'rainy': 'meteo_pluie_corrige',
            'windy': '14961', 'windy-variant': '62874',
            'pouring': '76896', 'hail': '2441',
            'lightning': '23713', 'lightning-rainy': '23713',
            'snowy': '6473', 'snowy-rainy': '49301',
            'fog': '73809', 'exceptional': '56707'
          } %}
          {% set temperatures = ((tmin | round(0) | int) ~ '/' ~ (tmax | round(0) | int)) if tmin is not none and tmax is not none else '--/--' %}
          {{ {
            'icon': icones.get(condition, ''),
            'pushIcon': 0,
            'text': temperatures,
            'color': '#38BDF8',
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 0
          } | to_json }}

    - delay: "00:00:01"

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/temperature_exterieure
        qos: 0
        retain: false
        payload: >-
          {% set entite = 'sensor.temperature_exterieure_temperature' %}
          {% set temperature = ((states(entite) | float(0) | round(1)) ~ '°') if has_value(entite) else '--' %}
          {{ {
            'icon': '66525_corrige',
            'pushIcon': 0,
            'text': temperature,
            'color': '#38BDF8',
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 0
          } | to_json }}

    - delay: "00:00:01"

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/temperature_salon
        qos: 0
        retain: false
        payload: >-
          {% set entite = 'sensor.temperature_salon_temperature' %}
          {% set disponible = has_value(entite) %}
          {% set temperature = states(entite) | float(0) %}
          {% set temperature_texte = ((temperature | round(1)) ~ '°') if disponible else '--' %}
          {% if not disponible %}
            {% set couleur = '#94A3B8' %}
          {% elif temperature < 19 %}
            {% set couleur = '#38BDF8' %}
          {% elif temperature < 23 %}
            {% set couleur = '#22C55E' %}
          {% elif temperature < 27 %}
            {% set couleur = '#F97316' %}
          {% else %}
            {% set couleur = '#EF4444' %}
          {% endif %}
          {{ {
            'icon': '62373',
            'pushIcon': 0,
            'text': temperature_texte,
            'color': couleur,
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 0
          } | to_json }}

    - delay: "00:00:01"

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/demain
        qos: 0
        retain: false
        payload: >-
          {% set entite = 'weather.meteo_france_forecast_for_city_montreuil_juigne_pays_de_la_loire_49_fr_montreuil_juigne' %}
          {% set donnees = previsions_meteo | default({}, true) %}
          {% set previsions = donnees.get(entite, {}).get('forecast', []) %}
          {% set demain = previsions[1] if previsions | count > 1 else (previsions[0] if previsions | count > 0 else {}) %}
          {% set condition = demain.get('condition', 'cloudy') %}
          {% set tmax = demain.get('temperature') %}
          {% set tmin = demain.get('templow') %}
          {% set icones = {
            'sunny': '2282', 'clear-night': '962',
            'partlycloudy': 'meteo_partiellement_nuageux',
            'cloudy': 'meteo_nuage',
            'rainy': 'meteo_pluie_corrige',
            'windy': '14961', 'windy-variant': '62874',
            'pouring': '76896', 'hail': '2441',
            'lightning': '23713', 'lightning-rainy': '23713',
            'snowy': '6473', 'snowy-rainy': '49301',
            'fog': '73809', 'exceptional': '56707'
          } %}
          {% set temperatures = ((tmin | round(0) | int) ~ '/' ~ (tmax | round(0) | int)) if tmin is not none and tmax is not none else '--/--' %}
          {{ {
            'icon': icones.get(condition, ''),
            'pushIcon': 0,
            'text': '>' ~ temperatures,
            'color': '#A78BFA',
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 0
          } | to_json }}

    - delay: "00:00:01"

    - action: mqtt.publish
      data:
        topic: awtrix_salon/custom/energie
        qos: 0
        retain: false
        payload: >-
          {% set puissance = states('sensor.logement_puissance') | float(0) %}
          {% set couleur = '#22C55E' if puissance < 5300 else ('#F59E0B' if puissance < 8000 else '#EF4444') %}
          {% set valeur = ((puissance / 1000) | round(1)) ~ 'kW' if puissance >= 1000 else (puissance | round(0) | int) ~ 'W' %}
          {# Barre Enedis : puissance apparente, 0 a 9000 VA, distincte du texte W/kW. #}
          {% set entite_enedis = 'sensor.reseau_enedis_puissance_apparente' %}
          {% set mesure = states(entite_enedis) %}
          {% set unite = state_attr(entite_enedis, 'unit_of_measurement') | default('', true) | lower | trim %}
          {% set disponible = is_number(mesure) and unite in ['va', 'kva'] and (mesure | float(0)) >= 0 %}
          {% set puissance_va = (mesure | float(0)) * (1000 if unite == 'kva' else 1) if disponible else 0 %}
          {% set remplissage = ([0, ([puissance_va / 9000, 1] | min)] | max) %}
          {% set pixels_allumes = (remplissage * 24) | round(0, 'floor') | int %}
          {% set segments = [
            [0, 5, '#22C55E'], [6, 11, '#FACC15'],
            [12, 17, '#F97316'], [18, 23, '#EF4444']
          ] %}
          {% set barre = namespace(traits=[]) %}
          {% if disponible %}
            {% set barre.traits = [{'dl': [8, 7, 31, 7, '#102030']}] %}
            {% for debut, fin_segment, couleur_segment in segments %}
              {% if pixels_allumes > debut %}
                {% set fin = [pixels_allumes - 1, fin_segment] | min %}
                {% set barre.traits = barre.traits + [{'dl': [8 + debut, 7, 8 + fin, 7, couleur_segment]}] %}
              {% endif %}
            {% endfor %}
          {% else %}
            {% set barre.traits = [{'dl': [8, 7, 31, 7, '#4B5563']}] %}
          {% endif %}
          {{ {
            'icon': '11808_corrige',
            'pushIcon': 0,
            'draw': [{'dt': [10, 1, valeur, couleur]}] + barre.traits,
            'duration': 7,
            'progress': -1,
            'lifetime': 900,
            'lifetimeMode': 0
          } | to_json }}

    - delay: "00:00:01"

    - if:
        - condition: template
          value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
      then:
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/piscine
            qos: 0
            retain: false
            payload: >-
              {% set temperature = states('sensor.pcha_temperature_piscine') %}
              {% set pompe = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
              {% set chauffage_solaire = is_state('binary_sensor.pcha_chauffage_solaire_actif', 'on') %}
              {% set etat = states('input_select.pcha_etat_machine') %}
              {% set mode = states('input_select.pcha_mode_de_fonctionnement') %}
              {% set niveau = states('input_select.pcha_niveau_fonctionnement') %}
              {% set traitement_actif = is_state('input_select.pcha_mode_de_fonctionnement', 'TRAITEMENT') %}
              {% set niveau_normalise = niveau | upper %}
              {% set couleur = '#EF4444' if 'CRITIQUE' in niveau_normalise else ('#F59E0B' if 'DEGRAD' in niveau_normalise or 'DÉGRAD' in niveau_normalise else '#22D3EE') %}
              {% set temperature_texte = ((temperature | float(0) | round(1)) ~ '') if temperature not in ['unknown', 'unavailable', 'none', ''] else '--' %}
              {% set attente = [
                {'dl': [25, 0, 31, 0, '#FFFFFF']},
                {'dp': [26, 1, '#FFFFFF']}, {'dl': [27, 1, 29, 1, '#22D3EE']}, {'dp': [30, 1, '#FFFFFF']},
                {'dp': [27, 2, '#FFFFFF']}, {'dp': [28, 2, '#22D3EE']}, {'dp': [29, 2, '#FFFFFF']},
                {'dp': [28, 3, '#22D3EE']}, {'dp': [28, 4, '#22D3EE']},
                {'dp': [27, 5, '#FFFFFF']}, {'dp': [28, 5, '#22D3EE']}, {'dp': [29, 5, '#FFFFFF']},
                {'dp': [26, 6, '#FFFFFF']}, {'dl': [27, 6, 29, 6, '#22D3EE']}, {'dp': [30, 6, '#FFFFFF']},
                {'dl': [25, 7, 31, 7, '#FFFFFF']}
              ] %}
              {% set filtration = [
                {'dp': [28, 1, '#8AFF0F']},
                {'dp': [28, 2, '#8AFF0F']}, {'dp': [29, 2, '#C3FF0F']},
                {'dl': [24, 3, 25, 3, '#78E208']}, {'dp': [26, 3, '#73D50B']},
                {'dp': [27, 3, '#68BD0F']}, {'dl': [28, 3, 29, 3, '#8AFF0F']},
                {'dp': [30, 3, '#C3FF0F']},
                {'dl': [24, 4, 25, 4, '#78E208']}, {'dp': [26, 4, '#73D50B']},
                {'dp': [27, 4, '#68BD0F']}, {'dl': [28, 4, 29, 4, '#8AFF0F']},
                {'dp': [30, 4, '#C3FF0F']},
                {'dp': [28, 5, '#8AFF0F']}, {'dp': [29, 5, '#C3FF0F']},
                {'dp': [28, 6, '#8AFF0F']}
              ] %}
              {% set filtration_solaire = [
                {'dp': [28, 1, '#F73818']},
                {'dp': [28, 2, '#F75E18']}, {'dp': [29, 2, '#F75E18']},
                {'dl': [24, 3, 30, 3, '#F69618']},
                {'dl': [24, 4, 30, 4, '#F6CF18']},
                {'dp': [28, 5, '#F7E718']}, {'dp': [29, 5, '#F7E718']},
                {'dp': [28, 6, '#F7F718']}
              ] %}
              {% set defaut = [
                {'dl': [26, 0, 29, 0, '#F50017']},
                {'dl': [25, 1, 30, 1, '#F50017']},
                {'df': [24, 2, 8, 4, '#F50017']},
                {'dl': [25, 6, 30, 6, '#F50017']},
                {'dl': [26, 7, 29, 7, '#F50017']},
                {'df': [27, 1, 2, 4, '#FFFFFF']},
                {'dl': [27, 6, 28, 6, '#FFFFFF']}
              ] %}
              {% set traitement = [
                {'dl': [27, 0, 28, 0, '#9A483D']},
                {'dp': [26, 1, '#8DBED5']}, {'dl': [27, 1, 28, 1, '#9A483D']}, {'dp': [29, 1, '#8DBED5']},
                {'dl': [27, 2, 28, 2, '#A8D7E6']},
                {'dl': [27, 3, 28, 3, '#A8D7E6']},
                {'dp': [26, 4, '#8DBED5']}, {'dl': [27, 4, 28, 4, '#A8D7E6']}, {'dp': [29, 4, '#8DBED5']},
                {'dp': [25, 5, '#8DBED5']}, {'dl': [26, 5, 27, 5, '#A8D7E6']},
                {'dp': [28, 5, '#EBF9FF']}, {'dp': [29, 5, '#A8D7E6']}, {'dp': [30, 5, '#8DBED5']},
                {'dp': [25, 6, '#8DBED5']}, {'dl': [26, 6, 27, 6, '#78BF3E']},
                {'dp': [28, 6, '#E5FEBE']}, {'dp': [29, 6, '#78BF3E']}, {'dp': [30, 6, '#8DBED5']},
                {'dp': [26, 7, '#8DBED5']}, {'dl': [27, 7, 28, 7, '#A8D7E6']}, {'dp': [29, 7, '#8DBED5']}
              ] %}
              {% set arret = [
                {'dl': [26, 0, 29, 0, '#FF0A21']},
                {'dl': [25, 1, 30, 1, '#F60017']},
                {'dl': [24, 2, 31, 2, '#F60017']},
                {'dp': [24, 3, '#EB0016']}, {'dl': [25, 3, 30, 3, '#FFFFFF']}, {'dp': [31, 3, '#F60017']},
                {'dp': [24, 4, '#F60017']}, {'dl': [25, 4, 30, 4, '#FFFFFF']}, {'dp': [31, 4, '#F60017']},
                {'dl': [24, 5, 30, 5, '#F60017']}, {'dp': [31, 5, '#BC0B1B']},
                {'dl': [25, 6, 29, 6, '#F60017']}, {'dp': [30, 6, '#BC0B1B']},
                {'dl': [26, 7, 27, 7, '#B70112']}, {'dl': [28, 7, 29, 7, '#BC0B1B']}
              ] %}
              {% set etat_normalise = etat | upper %}
              {% if traitement_actif %}
                {% set icone_etat = traitement %}
              {% elif 'DEFAUT' in etat_normalise or 'DÉFAUT' in etat_normalise or 'BLOQUANT' in etat_normalise or 'CRITIQUE' in niveau_normalise %}
                {% set icone_etat = defaut %}
              {% elif is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
                {% set icone_etat = filtration_solaire if chauffage_solaire else filtration %}
              {% elif is_state('input_select.pcha_etat_machine', 'ATTENTE') %}
                {% set icone_etat = attente %}
              {% else %}
                {% set icone_etat = arret %}
              {% endif %}
              {{ {
                'icon': '21645',
                'pushIcon': 0,
                'draw': [{'dt': [10, 1, temperature_texte, couleur]}] + icone_etat,
                'duration': 7,
                'lifetime': 900,
                'lifetimeMode': 0
              } | to_json }}
      else:
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/piscine
            payload: ""
            qos: 1
            retain: true

- id: awtrix_salon_traitement_piscine
  alias: "AWTRIX Salon - Alternance traitement piscine"
  description: >-
    Pendant la page piscine, alterne deux fois la température et son état avec
    le temps de traitement restant. Actualise aussi la page à chaque changement
    du capteur de traitement.
  mode: restart
  triggers:
    - trigger: mqtt
      topic: awtrix_salon/stats/currentApp
      payload: piscine
      id: affichage
    - trigger: state
      entity_id:
        - sensor.pcha_temps_traitement_restant
        - input_select.pcha_etat_machine
        - input_select.pcha_mode_de_fonctionnement
        - input_select.pcha_niveau_fonctionnement
        - switch.pcha_commande_pompe_filtration
        - binary_sensor.pcha_chauffage_solaire_actif
      id: actualisation
  actions:
    - condition: template
      value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
    - variables:
        traitement_actif: >-
          {{ is_state('input_select.pcha_mode_de_fonctionnement', 'TRAITEMENT') }}
        payload_temperature: >-
          {% set temperature = states('sensor.pcha_temperature_piscine') %}
          {% set pompe = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
          {% set chauffage_solaire = is_state('binary_sensor.pcha_chauffage_solaire_actif', 'on') %}
          {% set etat = states('input_select.pcha_etat_machine') %}
          {% set mode = states('input_select.pcha_mode_de_fonctionnement') %}
          {% set niveau = states('input_select.pcha_niveau_fonctionnement') %}
          {% set niveau_normalise = niveau | upper %}
          {% set couleur = '#EF4444' if 'CRITIQUE' in niveau_normalise else ('#F59E0B' if 'DEGRAD' in niveau_normalise or 'DÉGRAD' in niveau_normalise else '#22D3EE') %}
          {% set temperature_texte = ((temperature | float(0) | round(1)) ~ '') if temperature not in ['unknown', 'unavailable', 'none', ''] else '--' %}
          {% set attente = [
            {'dl': [25, 0, 31, 0, '#FFFFFF']},
            {'dp': [26, 1, '#FFFFFF']}, {'dl': [27, 1, 29, 1, '#22D3EE']}, {'dp': [30, 1, '#FFFFFF']},
            {'dp': [27, 2, '#FFFFFF']}, {'dp': [28, 2, '#22D3EE']}, {'dp': [29, 2, '#FFFFFF']},
            {'dp': [28, 3, '#22D3EE']}, {'dp': [28, 4, '#22D3EE']},
            {'dp': [27, 5, '#FFFFFF']}, {'dp': [28, 5, '#22D3EE']}, {'dp': [29, 5, '#FFFFFF']},
            {'dp': [26, 6, '#FFFFFF']}, {'dl': [27, 6, 29, 6, '#22D3EE']}, {'dp': [30, 6, '#FFFFFF']},
            {'dl': [25, 7, 31, 7, '#FFFFFF']}
          ] %}
          {% set filtration = [
            {'dp': [28, 1, '#8AFF0F']},
            {'dp': [28, 2, '#8AFF0F']}, {'dp': [29, 2, '#C3FF0F']},
            {'dl': [24, 3, 25, 3, '#78E208']}, {'dp': [26, 3, '#73D50B']},
            {'dp': [27, 3, '#68BD0F']}, {'dl': [28, 3, 29, 3, '#8AFF0F']},
            {'dp': [30, 3, '#C3FF0F']},
            {'dl': [24, 4, 25, 4, '#78E208']}, {'dp': [26, 4, '#73D50B']},
            {'dp': [27, 4, '#68BD0F']}, {'dl': [28, 4, 29, 4, '#8AFF0F']},
            {'dp': [30, 4, '#C3FF0F']},
            {'dp': [28, 5, '#8AFF0F']}, {'dp': [29, 5, '#C3FF0F']},
            {'dp': [28, 6, '#8AFF0F']}
          ] %}
          {% set filtration_solaire = [
            {'dp': [28, 1, '#F73818']},
            {'dp': [28, 2, '#F75E18']}, {'dp': [29, 2, '#F75E18']},
            {'dl': [24, 3, 30, 3, '#F69618']},
            {'dl': [24, 4, 30, 4, '#F6CF18']},
            {'dp': [28, 5, '#F7E718']}, {'dp': [29, 5, '#F7E718']},
            {'dp': [28, 6, '#F7F718']}
          ] %}
          {% set defaut = [
            {'dl': [26, 0, 29, 0, '#F50017']},
            {'dl': [25, 1, 30, 1, '#F50017']},
            {'df': [24, 2, 8, 4, '#F50017']},
            {'dl': [25, 6, 30, 6, '#F50017']},
            {'dl': [26, 7, 29, 7, '#F50017']},
            {'df': [27, 1, 2, 4, '#FFFFFF']},
            {'dl': [27, 6, 28, 6, '#FFFFFF']}
          ] %}
          {% set traitement = [
            {'dl': [27, 0, 28, 0, '#9A483D']},
            {'dp': [26, 1, '#8DBED5']}, {'dl': [27, 1, 28, 1, '#9A483D']}, {'dp': [29, 1, '#8DBED5']},
            {'dl': [27, 2, 28, 2, '#A8D7E6']},
            {'dl': [27, 3, 28, 3, '#A8D7E6']},
            {'dp': [26, 4, '#8DBED5']}, {'dl': [27, 4, 28, 4, '#A8D7E6']}, {'dp': [29, 4, '#8DBED5']},
            {'dp': [25, 5, '#8DBED5']}, {'dl': [26, 5, 27, 5, '#A8D7E6']},
            {'dp': [28, 5, '#EBF9FF']}, {'dp': [29, 5, '#A8D7E6']}, {'dp': [30, 5, '#8DBED5']},
            {'dp': [25, 6, '#8DBED5']}, {'dl': [26, 6, 27, 6, '#78BF3E']},
            {'dp': [28, 6, '#E5FEBE']}, {'dp': [29, 6, '#78BF3E']}, {'dp': [30, 6, '#8DBED5']},
            {'dp': [26, 7, '#8DBED5']}, {'dl': [27, 7, 28, 7, '#A8D7E6']}, {'dp': [29, 7, '#8DBED5']}
          ] %}
          {% set arret = [
            {'dl': [26, 0, 29, 0, '#FF0A21']},
            {'dl': [25, 1, 30, 1, '#F60017']},
            {'dl': [24, 2, 31, 2, '#F60017']},
            {'dp': [24, 3, '#EB0016']}, {'dl': [25, 3, 30, 3, '#FFFFFF']}, {'dp': [31, 3, '#F60017']},
            {'dp': [24, 4, '#F60017']}, {'dl': [25, 4, 30, 4, '#FFFFFF']}, {'dp': [31, 4, '#F60017']},
            {'dl': [24, 5, 30, 5, '#F60017']}, {'dp': [31, 5, '#BC0B1B']},
            {'dl': [25, 6, 29, 6, '#F60017']}, {'dp': [30, 6, '#BC0B1B']},
            {'dl': [26, 7, 27, 7, '#B70112']}, {'dl': [28, 7, 29, 7, '#BC0B1B']}
          ] %}
          {% set etat_normalise = etat | upper %}
          {% if traitement_actif in [true, 'true', 'True', 'on', 1, '1'] %}
            {% set icone_etat = traitement %}
          {% elif 'DEFAUT' in etat_normalise or 'DÉFAUT' in etat_normalise or 'BLOQUANT' in etat_normalise or 'CRITIQUE' in niveau_normalise %}
            {% set icone_etat = defaut %}
          {% elif is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
            {% set icone_etat = filtration_solaire if chauffage_solaire else filtration %}
          {% elif is_state('input_select.pcha_etat_machine', 'ATTENTE') %}
            {% set icone_etat = attente %}
          {% else %}
            {% set icone_etat = arret %}
          {% endif %}
          {{ {
            'icon': '21645',
            'pushIcon': 0,
            'draw': [{'dt': [10, 1, temperature_texte, couleur]}] + icone_etat,
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 0
          } | to_json }}
        payload_traitement: >-
          {% set brut = states('sensor.pcha_temps_traitement_restant') %}
          {% set unite = state_attr('sensor.pcha_temps_traitement_restant', 'unit_of_measurement') | default('', true) | lower %}
          {% if is_number(brut) %}
            {% set valeur = brut | float(0) %}
            {% set secondes = valeur * (3600 if unite in ['h', 'heure', 'heures'] else (1 if unite in ['s', 'sec', 'seconde', 'secondes'] else 60)) %}
          {% elif ':' in brut %}
            {% set parties = brut.split(':') %}
            {% if parties | length == 3 %}
              {% set secondes = (parties[0] | int(0)) * 3600 + (parties[1] | int(0)) * 60 + (parties[2] | float(0)) %}
            {% else %}
              {% set secondes = (parties[0] | int(0)) * 60 + (parties[1] | float(0)) %}
            {% endif %}
          {% else %}
            {% set secondes = 0 %}
          {% endif %}
          {% set minutes = (secondes / 60) | round(0, 'ceil') | int %}
          {% set heures = minutes // 60 %}
          {% set minutes_reste = minutes % 60 %}
          {% set texte = heures ~ 'H' ~ ('%02d' | format(minutes_reste)) %}
          {{ {
            'icon': '21645',
            'pushIcon': 0,
            'draw': [{'dt': [10, 1, texte, '#F59E0B']}],
            'duration': 7,
            'lifetime': 900,
            'lifetimeMode': 0
          } | to_json }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'actualisation' }}"
          sequence:
            - condition: template
              value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/piscine
                qos: 0
                retain: false
                payload: "{{ payload_temperature }}"
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.id == 'affichage' and
                   traitement_actif in [true, 'true', 'True', 'on', 1, '1'] }}
          sequence:
            - condition: template
              value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/piscine
                qos: 0
                retain: false
                payload: "{{ payload_temperature }}"
            - delay:
                milliseconds: 1400
            - condition: template
              value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/piscine
                qos: 0
                retain: false
                payload: "{{ payload_traitement }}"
            - delay:
                milliseconds: 1400
            - condition: template
              value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/piscine
                qos: 0
                retain: false
                payload: "{{ payload_temperature }}"
            - delay:
                milliseconds: 1400
            - condition: template
              value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/piscine
                qos: 0
                retain: false
                payload: "{{ payload_traitement }}"
            - delay:
                milliseconds: 1400
            - condition: template
              value_template: "{{ not is_state('input_select.pcha_mode_de_fonctionnement', 'HIVERNAGE') }}"
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/piscine
                qos: 0
                retain: false
                payload: "{{ payload_temperature }}"

- id: awtrix_salon_affichage_tesla
  alias: "AWTRIX Salon - Tesla contextuelle"
  description: >-
    Maintient une page Tesla dont le texte alterne pendant la recharge et ajoute
    une seconde page avec l'heure de fin estimee a partir du temps restant.
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time_pattern
      minutes: "/1"
      id: periodique
    - trigger: state
      entity_id:
        - binary_sensor.tesla_vehicule_branche
        - sensor.tesla_ble_charging_state
        - sensor.tesla_ble_charge_level
        - sensor.tesla_ble_minutes_to_limit
        - number.tesla_ble_charging_limit
        - sensor.recharge_ve_puissance_phase_a
      id: changement
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger.id | default('manuel') == 'demarrage' }}"
      then:
        - delay: "00:00:35"
    - variables:
        etat_charge: "{{ states('sensor.tesla_ble_charging_state') }}"
        tesla_branchee: >-
          {% set etat = states('sensor.tesla_ble_charging_state') | lower %}
          {{ is_state('binary_sensor.tesla_vehicule_branche', 'on') or
             etat not in ['', 'unknown', 'unavailable', 'none', 'disconnected'] }}
    - action: mqtt.publish
      data:
        topic: awtrix_salon_diagnostic/custom/tesla
        payload: ""
        qos: 0
        retain: false
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ tesla_branchee }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/voiture_puissance
                payload: ""
                qos: 0
                retain: false
            - delay:
                milliseconds: 500
            - action: mqtt.publish
              data:
                topic: homeassistant/awtrix_salon/tesla_texte
                qos: 0
                retain: true
                payload: >-
                  {{ (states('sensor.tesla_ble_charge_level') | float(0) | round(0) | int) ~ '%' }}
            - action: mqtt.publish
              data:
                topic: awtrix_salon/custom/voiture_batterie
                qos: 0
                retain: false
                payload: >-
                  {% set batterie = states('sensor.tesla_ble_charge_level') | float(0) %}
                  {% set limite = states('number.tesla_ble_charging_limit') | float(100) %}
                  {% set etat = etat_charge | lower %}
                  {% set couleur = '#22C55E' if batterie >= limite else ('#38BDF8' if etat == 'charging' else '#A78BFA') %}
                  {% set progression = batterie | round(0) | int %}
                  {% set icone_voiture = '69207' if etat == 'charging' else '59656' %}
                  {% set texte_dynamique = '{' ~ '{homeassistant/awtrix_salon/tesla_texte' ~ '}' ~ '}' %}
                  {{ {
                    'icon': icone_voiture,
                    'pushIcon': 0,
                    'text': texte_dynamique,
                    'color': couleur,
                    'duration': 5,
                    'progress': progression,
                    'progressC': couleur,
                    'progressBC': '#151022',
                    'lifetime': 180,
                    'lifetimeMode': 0
                  } | to_json }}
            - delay:
                milliseconds: 500
            - choose:
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ etat_charge | lower == 'charging' and
                           is_number(states('sensor.tesla_ble_minutes_to_limit')) and
                           states('sensor.tesla_ble_minutes_to_limit') | float(0) >= 0 }}
                  sequence:
                    - action: mqtt.publish
                      data:
                        topic: homeassistant/awtrix_salon/tesla_fin_texte
                        qos: 0
                        retain: true
                        payload: >-
                          {% set minutes = states('sensor.tesla_ble_minutes_to_limit') | float(0) %}
                          {% set fin_timestamp = as_timestamp(now()) + (minutes * 60) %}
                          {{ fin_timestamp | timestamp_custom('%H:%M', true) }}
                    - action: mqtt.publish
                      data:
                        topic: awtrix_salon/custom/voiture_fin
                        qos: 0
                        retain: false
                        payload: >-
                          {% set batterie = states('sensor.tesla_ble_charge_level') | float(0) %}
                          {% set progression = batterie | round(0) | int %}
                          {% set texte_dynamique = '{' ~ '{homeassistant/awtrix_salon/tesla_fin_texte' ~ '}' ~ '}' %}
                          {{ {
                            'icon': '69207',
                            'pushIcon': 0,
                            'text': texte_dynamique,
                            'color': '#F59E0B',
                            'duration': 5,
                            'progress': progression,
                            'progressC': '#38BDF8',
                            'progressBC': '#151022',
                            'lifetime': 180,
                            'lifetimeMode': 0
                          } | to_json }}
              default:
                - action: mqtt.publish
                  data:
                    topic: awtrix_salon/custom/voiture_fin
                    payload: ""
                    qos: 0
                    retain: false
                - action: mqtt.publish
                  data:
                    topic: homeassistant/awtrix_salon/tesla_fin_texte
                    payload: ""
                    qos: 0
                    retain: true
      default:
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/voiture_batterie
            payload: ""
            qos: 0
            retain: false
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/voiture_puissance
            payload: ""
            qos: 0
            retain: false
        - action: mqtt.publish
          data:
            topic: awtrix_salon/custom/voiture_fin
            payload: ""
            qos: 0
            retain: false
        - action: mqtt.publish
          data:
            topic: homeassistant/awtrix_salon/tesla_texte
            payload: ""
            qos: 0
            retain: true
        - action: mqtt.publish
          data:
            topic: homeassistant/awtrix_salon/tesla_fin_texte
            payload: ""
            qos: 0
            retain: true

- id: awtrix_salon_alternance_tesla
  alias: "AWTRIX Salon - Alternance pourcentage et puissance Tesla"
  description: >-
    Pendant l'unique passage de cinq secondes de la page Tesla, alterne deux
    fois le pourcentage et la puissance sans interrompre l'animation du GIF.
  mode: restart
  triggers:
    - trigger: mqtt
      topic: awtrix_salon/stats/currentApp
      payload: voiture_batterie
  conditions:
    - condition: template
      value_template: >-
        {% set etat = states('sensor.tesla_ble_charging_state') | lower %}
        {{ (is_state('binary_sensor.tesla_vehicule_branche', 'on') or
            etat not in ['', 'unknown', 'unavailable', 'none', 'disconnected']) and
           etat == 'charging' }}
  actions:
    - variables:
        texte_pourcentage: >-
          {{ (states('sensor.tesla_ble_charge_level') | float(0) | round(0) | int) ~ '%' }}
        texte_puissance: >-
          {% if has_value('sensor.recharge_ve_puissance_phase_a') %}
            {{ (states('sensor.recharge_ve_puissance_phase_a') | float(0) | round(1)) ~ 'kW' }}
          {% else %}
            --kW
          {% endif %}
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_texte
        payload: "{{ texte_pourcentage }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_texte
        payload: "{{ texte_puissance }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_texte
        payload: "{{ texte_pourcentage }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_texte
        payload: "{{ texte_puissance }}"
        qos: 0
        retain: true
    - delay:
        milliseconds: 1200
    - action: mqtt.publish
      data:
        topic: homeassistant/awtrix_salon/tesla_texte
        payload: "{{ texte_pourcentage }}"
        qos: 0
        retain: true

- id: awtrix_salon_alternance_fin_tesla
  alias: "AWTRIX Salon - Alternance heure de fin et limite Tesla"
  description: >-
    Pendant le passage de cinq secondes de la page de fin de charge Tesla,
    alterne deux fois l'heure de fin estimée et la limite de charge.
  mode: restart
  triggers:
