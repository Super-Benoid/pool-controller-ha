###############################################################################
# Température
###############################################################################

pcha_temperature_de_consigne:
  name: Température de consigne
  icon: mdi:thermometer-water
  min: 20
  max: 35
  step: 0.5
  unit_of_measurement: "°C"
  mode: box
  initial: 28

###############################################################################
# Chauffage solaire
###############################################################################

pcha_seuil_luminosite_chauffage:
  name: Seuil de luminosité chauffage
  icon: mdi:white-balance-sunny
  min: 0
  max: 50000
  step: 500
  unit_of_measurement: "lx"
  mode: box
  initial: 15000

###############################################################################
# Traitement
###############################################################################

pcha_duree_traitement:
  name: Durée du traitement
  icon: mdi:clock-outline
  min: 1
  max: 24
  step: 1
  unit_of_measurement: "h"
  mode: box
  initial: 12

