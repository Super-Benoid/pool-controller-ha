################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-004 — Paramètres configurables V1.1
#
# Entrées
#   Aucune
#
# Sorties
#   input_number.pcha_correction_temperature_piscine
#   input_number.pcha_duree_traitement
#   input_number.pcha_seuil_luminosite_chauffage
#   input_number.pcha_temperature_de_consigne
#   input_number.pcha_temps_arret_pompe_min
#   input_number.pcha_temps_marche_pompe_min
#   input_number.pcha_temps_validation_debit
#   input_number.pcha_temps_validation_luminosite
#   input_number.pcha_temps_validation_temperature_piscine
################################################################################

# L'identifiant historique est conservé pour éviter de casser les tableaux de
# bord et automatisations. En V1.1 il s'agit d'un calibrage signé ajouté à la
# mesure brute : température = mesure brute + calibrage.
pcha_correction_temperature_piscine:
  name: Calibrage température bassin
  icon: mdi:tune-vertical
  min: -3
  max: 3
  step: 0.1
  unit_of_measurement: "°C"
  mode: box

pcha_duree_traitement:
  name: Durée du traitement
  icon: mdi:clock-outline
  min: 5
  max: 1440
  step: 5
  unit_of_measurement: "min"
  mode: box

pcha_seuil_luminosite_chauffage:
  name: Seuil de luminosité chauffage
  icon: mdi:white-balance-sunny
  min: 0
  max: 50000
  step: 500
  unit_of_measurement: "lx"
  mode: box

pcha_temperature_de_consigne:
  name: Température de consigne
  icon: mdi:thermometer-water
  min: 20
  max: 35
  step: 0.5
  unit_of_measurement: "°C"
  mode: box

pcha_temps_arret_pompe_min:
  name: Temps minimum d'arrêt
  icon: mdi:pump-off
  min: 25
  max: 60
  step: 1
  unit_of_measurement: "min"
  mode: box

pcha_temps_marche_pompe_min:
  name: Temps minimum de marche
  icon: mdi:pump
  min: 5
  max: 60
  step: 1
  unit_of_measurement: "min"
  mode: box

pcha_temps_validation_debit:
  name: Validation débit
  icon: mdi:timer-check
  min: 30
  max: 600
  step: 1
  unit_of_measurement: "s"
  mode: box

pcha_temps_validation_luminosite:
  name: Validation luminosité distante
  icon: mdi:timer-check
  min: 0
  max: 600
  step: 1
  unit_of_measurement: "s"
  mode: box

# L'ancien délai de stabilisation devient uniquement le délai de validation des
# diagnostics MES-001 et COH-002. La température métier n'attend plus la pompe.
pcha_temps_validation_temperature_piscine:
  name: Validation température bassin
  icon: mdi:timer-check
  min: 0
  max: 600
  step: 1
  unit_of_measurement: "s"
  mode: box
