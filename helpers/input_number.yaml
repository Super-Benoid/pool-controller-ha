################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-004 — Paramètres configurables V1.1
#
# Entrées
#   Aucune
#
# Sorties
#   input_number.pcha_coefficient_filtration_acceleration
#   input_number.pcha_coefficient_filtration_base
#   input_number.pcha_correction_temperature_exterieure
#   input_number.pcha_correction_temperature_piscine
#   input_number.pcha_duree_traitement
#   input_number.pcha_duree_vidange
#   input_number.pcha_hysteresis_luminosite_chauffage
#   input_number.pcha_marge_objectif_avant_coucher
#   input_number.pcha_puissance_pompe_max_normale
#   input_number.pcha_puissance_pompe_min_normale
#   input_number.pcha_seuil_debit_critique
#   input_number.pcha_seuil_debit_insuffisant
#   input_number.pcha_seuil_luminosite_chauffage
#   input_number.pcha_seuil_puissance_pompe_arretee
#   input_number.pcha_temperature_de_consigne
#   input_number.pcha_temperature_seuil_acceleration_filtration
#   input_number.pcha_temps_arret_pompe_min
#   input_number.pcha_temps_marche_pompe_min
#   input_number.pcha_temps_validation_activation_chauffage_solaire
#   input_number.pcha_temps_validation_arret_chauffage_solaire
#   input_number.pcha_temps_validation_debit
#   input_number.pcha_temps_validation_luminosite
#   input_number.pcha_temps_validation_temperature_piscine
################################################################################

# Paramètres V3.0 du calcul de l'objectif quotidien de filtration.
# Aucun champ initial n'est défini afin que Home Assistant restaure les valeurs
# modifiées depuis le dashboard après un redémarrage.
pcha_coefficient_filtration_acceleration:
  name: Coefficient accélération filtration
  icon: mdi:chart-line-variant
  min: 0
  max: 3
  step: 0.1
  unit_of_measurement: "h/°C"
  mode: box

pcha_coefficient_filtration_base:
  name: Coefficient filtration de base
  icon: mdi:chart-line
  min: 0.05
  max: 0.50
  step: 0.01
  unit_of_measurement: "h/°C"
  mode: box

# L'identifiant historique est conservé pour éviter de casser les tableaux de
# bord et automatisations. En V1.1 il s'agit d'un calibrage signé ajouté à la
# mesure brute : température = mesure brute + calibrage.
pcha_correction_temperature_piscine:
  name: Calibrage température bassin
  icon: mdi:tune-vertical
  min: -3
  max: 3
  step: 0.1
  unit_of_measurement: "°C"
  mode: box

# Calibrage signé de la température extérieure. À la première installation,
# l'automatisation de démarrage initialise ce nouveau paramètre à 0 °C puis sa
# valeur est restaurée normalement par Home Assistant.
pcha_correction_temperature_exterieure:
  name: Calibrage température extérieure
  icon: mdi:thermometer-lines
  min: -5
  max: 5
  step: 0.1
  unit_of_measurement: "°C"
  mode: box

pcha_duree_traitement:
  name: Durée du traitement
  icon: mdi:clock-outline
  min: 5
  max: 1440
  step: 5
  unit_of_measurement: "min"
  mode: box

pcha_duree_vidange:
  name: Durée de la vidange
  icon: mdi:water-minus
  min: 1
  max: 10
  step: 1
  unit_of_measurement: "min"
  mode: slider

# Hystérésis appliquée uniquement au chauffage solaire normal piloté par la
# luminosité. Elle est exprimée en klux pour rester lisible depuis le dashboard.
# Exemple : seuil 20 klux + hystérésis 2 klux => activation > 20 klux et
# maintien jusqu'à 18 klux.
pcha_hysteresis_luminosite_chauffage:
  name: Hystérésis luminosité chauffage solaire
  icon: mdi:sun-angle-outline
  min: 0
  max: 10
  step: 0.5
  unit_of_measurement: "klux"
  mode: box

pcha_marge_objectif_avant_coucher:
  name: Marge objectif avant coucher du soleil
  icon: mdi:weather-sunset-down
  min: 0
  max: 360
  step: 15
  unit_of_measurement: "min"
  mode: box

# Profil matériel de la pompe. Ces helpers sont volontairement larges pour
# permettre un remplacement de pompe ou de prise de mesure. Les valeurs
# historiques 500 / 3000 L/h et 1 / 300 / 350 W sont initialisées une seule
# fois par l'automatisation de démarrage, puis restaurées après modification.
pcha_seuil_debit_critique:
  name: Seuil débit critique pompe
  icon: mdi:water-alert
  min: 100
  max: 10000
  step: 50
  unit_of_measurement: "L/h"
  mode: box

pcha_seuil_debit_insuffisant:
  name: Seuil débit normal pompe
  icon: mdi:waves-arrow-right
  min: 200
  max: 20000
  step: 50
  unit_of_measurement: "L/h"
  mode: box

pcha_seuil_puissance_pompe_arretee:
  name: Seuil puissance pompe arrêtée
  icon: mdi:flash-off
  min: 0.1
  max: 100
  step: 0.1
  unit_of_measurement: "W"
  mode: box

pcha_puissance_pompe_min_normale:
  name: Puissance pompe normale minimale
  icon: mdi:flash-triangle-outline
  min: 1
  max: 3000
  step: 5
  unit_of_measurement: "W"
  mode: box

pcha_puissance_pompe_max_normale:
  name: Puissance pompe normale maximale
  icon: mdi:flash-triangle
  min: 1
  max: 3000
  step: 5
  unit_of_measurement: "W"
  mode: box

pcha_seuil_luminosite_chauffage:
  name: Seuil de luminosité chauffage
  icon: mdi:white-balance-sunny
  min: 0
  max: 50000
  step: 500
  unit_of_measurement: "lx"
  mode: box

pcha_temperature_de_consigne:
  name: Température de consigne
  icon: mdi:thermometer-water
  min: 20
  max: 35
  step: 0.5
  unit_of_measurement: "°C"
  mode: box

pcha_temperature_seuil_acceleration_filtration:
  name: Seuil accélération filtration
  icon: mdi:thermometer-chevron-up
  min: 20
  max: 35
  step: 0.5
  unit_of_measurement: "°C"
  mode: box

pcha_temps_arret_pompe_min:
  name: Temps minimum d'arrêt
  icon: mdi:pump-off
  min: 25
  max: 60
  step: 1
  unit_of_measurement: "min"
  mode: box

pcha_temps_marche_pompe_min:
  name: Temps minimum de marche
  icon: mdi:pump
  min: 5
  max: 60
  step: 1
  unit_of_measurement: "min"
  mode: box

# Temporisations propres au chauffage solaire. Elles ne remplacent pas les
# délais de diagnostic MES-004 et n'affectent pas la protection serpentin.
pcha_temps_validation_activation_chauffage_solaire:
  name: Validation activation chauffage solaire
  icon: mdi:timer-play-outline
  min: 0
  max: 600
  step: 10
  unit_of_measurement: "s"
  mode: box

pcha_temps_validation_arret_chauffage_solaire:
  name: Validation arrêt chauffage solaire
  icon: mdi:timer-stop-outline
  min: 0
  max: 30
  step: 1
  unit_of_measurement: "min"
  mode: box

pcha_temps_validation_debit:
  name: Validation débit
  icon: mdi:timer-check
  min: 30
  max: 600
  step: 1
  unit_of_measurement: "s"
  mode: box

pcha_temps_validation_luminosite:
  name: Validation luminosité distante
  icon: mdi:timer-check
  min: 0
  max: 600
  step: 1
  unit_of_measurement: "s"
  mode: box

# L'ancien délai de stabilisation devient uniquement le délai de validation des
# diagnostics MES-001 et COH-002. La température métier n'attend plus la pompe.
pcha_temps_validation_temperature_piscine:
  name: Validation température bassin
  icon: mdi:timer-check
  min: 0
  max: 600
  step: 1
  unit_of_measurement: "s"
  mode: box
