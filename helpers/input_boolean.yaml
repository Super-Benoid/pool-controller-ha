################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-004 — Commandes utilisateur
#
# Entrées
#   Aucune
#
# Sorties
#   input_boolean.pcha_acquitter_alarmes
#   input_boolean.pcha_fenetre_stabilisation_demarrage
#   input_boolean.pcha_maintenance_debit_indisponible
#   input_boolean.pcha_maintenance_luminosite_indisponible
#   input_boolean.pcha_maintenance_puissance_indisponible
#   input_boolean.pcha_maintenance_temperature_indisponible
#   input_boolean.pcha_verrou_pro_001
################################################################################

pcha_acquitter_alarmes:
  name: Effacer les notifications
  icon: mdi:alarm-check
  initial: false

# Fenêtre interne de stabilisation après un redémarrage de Home Assistant.
# Elle démarre volontairement à ON dès le chargement du helper, avant
# l'événement homeassistant start, afin que les templates PCHA ne puissent pas
# interpréter les états transitoires de boot comme des états métier valides.
# L'automatisation de démarrage la relâche après 60 secondes.
pcha_fenetre_stabilisation_demarrage:
  name: PCHA Fenêtre stabilisation démarrage
  icon: mdi:progress-clock
  initial: true

# Ce verrou est piloté uniquement par diagnostics/diagnostics.yaml. L'absence
# de valeur initiale permet à Home Assistant de restaurer son dernier état.
pcha_verrou_pro_001:
  name: Verrou défaut débit critique
  icon: mdi:lock-alert

pcha_maintenance_temperature_indisponible:
  name: Simuler température bassin indisponible
  icon: mdi:thermometer-off
  initial: false

pcha_maintenance_debit_indisponible:
  name: Simuler débit indisponible
  icon: mdi:gauge-empty
  initial: false

pcha_maintenance_puissance_indisponible:
  name: Simuler puissance indisponible
  icon: mdi:flash-off
  initial: false

pcha_maintenance_luminosite_indisponible:
  name: Simuler luminosité indisponible
  icon: mdi:brightness-5
  initial: false
