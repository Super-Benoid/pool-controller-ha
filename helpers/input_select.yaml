################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-004 — Sélections persistantes
#
# Entrées
#   Aucune
#
# Sorties
#   input_select.pcha_etat_machine
#   input_select.pcha_mode_de_fonctionnement
#   input_select.pcha_niveau_fonctionnement
################################################################################

pcha_etat_machine:
  name: État de la machine
  icon: mdi:state-machine
  options:
    - INITIALISATION
    - ATTENTE
    - FILTRATION
    - VIDANGE
  initial: INITIALISATION

pcha_mode_de_fonctionnement:
  name: Mode de fonctionnement
  icon: mdi:pool
  options:
    - "OFF"
    - SECURISATION
    - AUTO
    - TRAITEMENT
    - MARCHE_FORCEE
    - VIDANGE

pcha_niveau_fonctionnement:
  name: Niveau de fonctionnement
  icon: mdi:shield-check
  options:
    - NORMAL
    - INFORMATIF
    - DEGRADE
    - CRITIQUE
