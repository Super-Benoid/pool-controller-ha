################################################################################
# Pool Controller Home Assistant (PCHA)
# V3.0 — Stabilisation des interfaces au démarrage
#
# Une seule source de vérité pilote la phase de démarrage :
# input_boolean.pcha_fenetre_stabilisation_demarrage.
#
# La fenêtre ne commande pas directement la pompe. Elle empêche les états
# restaurés au démarrage d'être interprétés comme des états métier stabilisés.
# Elle est active dès le chargement du helper puis reste ON pendant 60 secondes.
# À l'issue de ce délai fixe, la logique métier normale reprend et MES-004
# retrouve ses temporisations habituelles.
################################################################################

- id: pcha_demarrage_stabiliser_interfaces
  alias: PCHA - Démarrage - Stabiliser les interfaces
  description: Maintient une fenêtre fixe de stabilisation de 60 secondes après le démarrage de Home Assistant.
  initial_state: true
  mode: restart
  triggers:
    - trigger: homeassistant
      event: start
  actions:
    # Le helper démarre déjà à ON dès son chargement. Cette action est conservée
    # pour rendre explicite l'intention et garantir l'état en cas de relance
    # manuelle de l'automatisation.
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.pcha_fenetre_stabilisation_demarrage

    - delay: "00:01:00"

    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.pcha_fenetre_stabilisation_demarrage

################################################################################
# Initialisation unique des nouveaux paramètres matériels
################################################################################
# Les helpers YAML sans valeur initiale restaurent ensuite les réglages choisis
# par l'utilisateur. Ce bootstrap ne s'exécute qu'une seule fois et reproduit
# exactement le profil historique de la pompe actuelle.
- id: pcha_demarrage_initialiser_parametres_materiel
  alias: PCHA - Démarrage - Initialiser paramètres matériel
  description: Initialise une seule fois les seuils historiques de pompe et le calibrage extérieur, puis laisse Home Assistant restaurer les réglages utilisateur.
  initial_state: true
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.pcha_parametres_materiel_initialises
      state: "off"
  actions:
    - wait_template: >
        {{
          states('input_number.pcha_seuil_debit_critique') not in ['unknown', 'unavailable']
          and states('input_number.pcha_seuil_debit_insuffisant') not in ['unknown', 'unavailable']
          and states('input_number.pcha_seuil_puissance_pompe_arretee') not in ['unknown', 'unavailable']
          and states('input_number.pcha_puissance_pompe_min_normale') not in ['unknown', 'unavailable']
          and states('input_number.pcha_puissance_pompe_max_normale') not in ['unknown', 'unavailable']
          and states('input_number.pcha_correction_temperature_exterieure') not in ['unknown', 'unavailable']
        }}
      timeout: "00:00:30"
      continue_on_timeout: false

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_seuil_debit_critique
      data:
        value: 500

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_seuil_debit_insuffisant
      data:
        value: 3000

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_seuil_puissance_pompe_arretee
      data:
        value: 1

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_puissance_pompe_min_normale
      data:
        value: 300

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_puissance_pompe_max_normale
      data:
        value: 350

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_correction_temperature_exterieure
      data:
        value: 0

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.pcha_parametres_materiel_initialises

################################################################################
# Initialisation unique des paramètres de chauffage solaire
################################################################################
# Valeurs de départ choisies pour éviter les oscillations observées autour du
# seuil de luminosité : 60 s avant activation, 2 klux d'hystérésis et 5 min
# avant arrêt. Les helpers sont ensuite restaurés et restent librement réglables.
- id: pcha_demarrage_initialiser_parametres_chauffage_solaire
  alias: PCHA - Démarrage - Initialiser paramètres chauffage solaire
  description: Initialise une seule fois les temporisations et l'hystérésis du chauffage solaire puis conserve les réglages utilisateur.
  initial_state: true
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: input_boolean.pcha_parametres_chauffage_solaire_initialises
      state: "off"
  actions:
    - wait_template: >
        {{
          states('input_number.pcha_temps_validation_activation_chauffage_solaire') not in ['unknown', 'unavailable']
          and states('input_number.pcha_hysteresis_luminosite_chauffage') not in ['unknown', 'unavailable']
          and states('input_number.pcha_temps_validation_arret_chauffage_solaire') not in ['unknown', 'unavailable']
        }}
      timeout: "00:00:30"
      continue_on_timeout: false

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_temps_validation_activation_chauffage_solaire
      data:
        value: 60

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_hysteresis_luminosite_chauffage
      data:
        value: 2

    - action: input_number.set_value
      target:
        entity_id: input_number.pcha_temps_validation_arret_chauffage_solaire
      data:
        value: 5

    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.pcha_parametres_chauffage_solaire_initialises
