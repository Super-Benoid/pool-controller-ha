################################################################################
# Pool Controller Home Assistant (PCHA)
# Historique journalier J-1 à J-7
#
# Les valeurs de synthèse sont relues dans les statistiques Recorder. Elles sont
# rafraîchies au démarrage puis chaque jour après le changement de date.
################################################################################

- sensor:
    - name: PCHA Température bassin moyenne du jour
      unique_id: pcha_temperature_bassin_moyenne_du_jour
      default_entity_id: sensor.pcha_temperature_bassin_moyenne_du_jour
      icon: mdi:thermometer-lines
      device_class: temperature
      unit_of_measurement: "°C"
      state_class: measurement
      state: >-
        {% set moyenne = state_attr('sensor.pcha_objectif_filtration_quotidien', 'temperature_moyenne_jour_en_cours') %}
        {{ moyenne | float(0) | round(1) if is_number(moyenne) else none }}

    - name: PCHA Amplitude température bassin du jour
      unique_id: pcha_amplitude_temperature_bassin_du_jour
      default_entity_id: sensor.pcha_amplitude_temperature_bassin_du_jour
      icon: mdi:arrow-expand-vertical
      device_class: temperature
      unit_of_measurement: "°C"
      state_class: measurement
      state: >-
        {% set minimum = states('sensor.pcha_temperature_piscine_min_jour') %}
        {% set maximum = states('sensor.pcha_temperature_piscine_max_jour') %}
        {{ ((maximum | float(0)) - (minimum | float(0))) | round(1) if is_number(minimum) and is_number(maximum) else none }}

- triggers:
    - trigger: homeassistant
      event: start
    - trigger: event
      event_type: event_template_reloaded
    - trigger: time
      at: "00:00:10"
    - trigger: time
      at: "00:05:00"
  actions:
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temps_filtration_realise
          - sensor.pcha_renouvellements_bassin_du_jour
          - sensor.pcha_energie_pompe_quotidienne
          - sensor.pcha_temps_luminosite_superieure_seuil_jour
          - sensor.pcha_temperature_piscine
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - sensor.pcha_progression_objectif_quotidien
        start_time: "{{ today_at() - timedelta(days=1) }}"
        end_time: "{{ today_at() }}"
        period: day
        types:
          - mean
          - min
          - max
          - state
          - change
      response_variable: historique_j_1
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temps_filtration_realise
          - sensor.pcha_renouvellements_bassin_du_jour
          - sensor.pcha_energie_pompe_quotidienne
          - sensor.pcha_temps_luminosite_superieure_seuil_jour
          - sensor.pcha_temperature_piscine
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - sensor.pcha_progression_objectif_quotidien
        start_time: "{{ today_at() - timedelta(days=2) }}"
        end_time: "{{ today_at() - timedelta(days=1) }}"
        period: day
        types:
          - mean
          - min
          - max
          - state
          - change
      response_variable: historique_j_2
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temps_filtration_realise
