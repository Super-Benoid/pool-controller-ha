        {% set valeurs = lignes | map(attribute='mean') | reject('eq', none) | list %}
        {{ ((valeurs | last) / 1000) | round(1) if valeurs | count > 0 else none }}

    - name: PCHA Historique J-1 progression objectif
      unique_id: pcha_historique_j_1_progression_objectif
      default_entity_id: sensor.pcha_historique_j_1_progression_objectif
