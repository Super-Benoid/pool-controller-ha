      device_class: temperature
      unit_of_measurement: "°C"
      state: >-
        {% set lignes = historique_detail_j_1.get('statistics', {}).get('sensor.pcha_temperature_piscine', []) %}
        {% set valeurs = lignes | map(attribute='mean') | reject('eq', none) | list %}
        {{ ((valeurs | sum) / (valeurs | count)) | round(1) if valeurs | count > 0 else none }}

    - name: PCHA Historique J-1 amplitude température bassin
      unique_id: pcha_historique_j_1_amplitude_temperature_bassin
      default_entity_id: sensor.pcha_historique_j_1_amplitude_temperature_bassin
