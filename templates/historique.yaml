        {{ ((valeurs | max) / 60) | round(1) if valeurs | count > 0 else none }}

    - name: PCHA Historique J-1 température bassin moyenne
      unique_id: pcha_historique_j_1_temperature_bassin_moyenne
      default_entity_id: sensor.pcha_historique_j_1_temperature_bassin_moyenne
