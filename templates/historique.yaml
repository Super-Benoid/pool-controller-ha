    # Les séries détaillées utilisent les agrégats courts de 5 minutes :
    # - la moyenne et l'amplitude restent cohérentes avec la courbe affichée ;
    # - la dernière valeur de la moyenne lumineuse cumulée correspond au bilan
    #   final de la journée, contrairement à sa moyenne sur toute la journée ;
    # - la première valeur stabilisée après minuit de l'objectif et de sa
    #   référence correspond à la valeur figée pour la journée, avant la
    #   bascule de minuit suivante. Le second créneau évite qu'une transition
    #   exactement à 00:00 ne mélange l'ancienne et la nouvelle valeur.
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temperature_piscine
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - sensor.pcha_objectif_filtration_quotidien
          - sensor.pcha_temperature_reference_objectif_quotidien
        start_time: "{{ today_at() - timedelta(days=1) }}"
        end_time: "{{ today_at() }}"
        period: 5minute
        types:
          - mean
      response_variable: historique_detail_j_1
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temperature_piscine
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - sensor.pcha_objectif_filtration_quotidien
          - sensor.pcha_temperature_reference_objectif_quotidien
        start_time: "{{ today_at() - timedelta(days=2) }}"
        end_time: "{{ today_at() - timedelta(days=1) }}"
        period: 5minute
        types:
          - mean
      response_variable: historique_detail_j_2
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temperature_piscine
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - sensor.pcha_objectif_filtration_quotidien
          - sensor.pcha_temperature_reference_objectif_quotidien
        start_time: "{{ today_at() - timedelta(days=3) }}"
        end_time: "{{ today_at() - timedelta(days=2) }}"
        period: 5minute
        types:
          - mean
      response_variable: historique_detail_j_3
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temperature_piscine
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - sensor.pcha_objectif_filtration_quotidien
          - sensor.pcha_temperature_reference_objectif_quotidien
        start_time: "{{ today_at() - timedelta(days=4) }}"
        end_time: "{{ today_at() - timedelta(days=3) }}"
        period: 5minute
        types:
          - mean
      response_variable: historique_detail_j_4
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temperature_piscine
          - sensor.pcha_luminosite_moyenne_superieure_seuil_jour
          - sensor.pcha_objectif_filtration_quotidien
