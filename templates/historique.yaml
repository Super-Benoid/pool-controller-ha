        period: day
        types:
          - mean
          - min
          - max
          - state
          - change
      response_variable: historique_j_5
    - action: recorder.get_statistics
      data:
        statistic_ids:
          - sensor.pcha_temps_filtration_realise
          - sensor.pcha_renouvellements_bassin_du_jour
          - sensor.pcha_energie_pompe_quotidienne
          - sensor.pcha_temps_luminosite_superieure_seuil_jour
          - sensor.pcha_temperature_piscine
