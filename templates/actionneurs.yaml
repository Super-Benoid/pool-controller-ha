################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-004 — Abstraction des actionneurs
#
# Entrées
#   switch.jardin_prises_exterieur_pompe_de_filtration
#
# Sorties
#   switch.pcha_commande_pompe_filtration
################################################################################

- switch:
    - name: PCHA Commande pompe filtration
      unique_id: pcha_commande_pompe_filtration
      default_entity_id: switch.pcha_commande_pompe_filtration
      availability: >
        {{ has_value('switch.jardin_prises_exterieur_pompe_de_filtration') }}
      state: >
        {{ is_state('switch.jardin_prises_exterieur_pompe_de_filtration', 'on') }}
      turn_on:
        - condition: template
          value_template: "{{ states('input_select.pcha_mode_de_fonctionnement') not in ['HIVERNAGE', 'unknown', 'unavailable'] and not is_state('input_select.pcha_etat_machine', 'HIVERNAGE') }}"
        - action: switch.turn_on
          target:
            entity_id: switch.jardin_prises_exterieur_pompe_de_filtration
      turn_off:
        action: switch.turn_off
        target:
          entity_id: switch.jardin_prises_exterieur_pompe_de_filtration

