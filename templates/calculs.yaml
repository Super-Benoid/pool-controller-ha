################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-003 — Calculs de filtration V1.1
#
# Entrées
#   input_number.pcha_correction_temperature_piscine
#   input_select.pcha_etat_machine
#   sensor.pcha_temperature_piscine
#   sensor.pcha_temperature_piscine_brute
#   sun.sun
#
# Sorties
#   binary_sensor.pcha_filtration_requise
#   binary_sensor.pcha_objectif_filtration_fige
#   sensor.pcha_objectif_filtration_quotidien
#   sensor.pcha_temperature_reference_objectif_quotidien
#   sensor.pcha_temperature_piscine_max_jour
#   sensor.pcha_temperature_piscine_min_jour
#   sensor.pcha_progression_objectif_quotidien
#   sensor.pcha_temps_filtration_realise
#   sensor.pcha_temps_filtration_restant
################################################################################

################################################################################
# Objectif quotidien
#
# De minuit à 30 minutes après le lever du soleil, le système mémorise la
# température brute maximale valide du bassin. Le calibrage signé est appliqué
# à cette candidate. À la fin de la fenêtre, l'objectif est figé jusqu'au
# lendemain. Avant le figement, l'objectif affiché est provisoire.
#
# Le capteur trigger-based restaure son état et ses attributs après redémarrage.
################################################################################
- triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time
      at: "00:00:00"
      id: minuit
    - trigger: state
      entity_id: sensor.pcha_temperature_piscine_brute
      id: temperature
    - trigger: state
      entity_id: input_number.pcha_correction_temperature_piscine
      id: calibrage
    - trigger: sun
      event: sunrise
      offset: "00:30:00"
      id: figer
    - trigger: time_pattern
      minutes: "/1"
      id: verification
  sensor:
    - name: PCHA Objectif filtration quotidien
      unique_id: pcha_objectif_filtration_quotidien
      default_entity_id: sensor.pcha_objectif_filtration_quotidien
      icon: mdi:target
      unit_of_measurement: "h"
      state_class: measurement
      state: >
        {% set tid = trigger.id if trigger is defined else 'initialisation' %}
        {% set aujourd_hui = now().date() | string %}
        {% set jour_precedent = this.attributes.jour | default('') %}
        {% set nouveau_jour = tid == 'minuit' or jour_precedent != aujourd_hui %}
        {% set deja_fige = (not nouveau_jour) and (this.attributes.objectif_fige | default(false) | bool(false)) %}

        {% set brute = states('sensor.pcha_temperature_piscine_brute') %}
        {% set brute_valide =
             state_attr('sensor.pcha_temperature_piscine_brute', 'source_coherent') | bool(false)
             and is_number(brute)
             and (brute | float(0)) > 10
             and (brute | float(0)) < 50 %}
        {% set candidate_precedente = this.attributes.temperature_candidate_brute | default(none) %}
        {% if nouveau_jour %}
          {% set candidate = (brute | float(0)) if brute_valide else none %}
        {% elif not deja_fige %}
          {% if brute_valide and is_number(candidate_precedente) %}
            {% set candidate = [candidate_precedente | float(0), brute | float(0)] | max %}
          {% elif brute_valide %}
            {% set candidate = brute | float(0) %}
          {% elif is_number(candidate_precedente) %}
            {% set candidate = candidate_precedente | float(0) %}
          {% else %}
            {% set candidate = none %}
          {% endif %}
        {% else %}
          {% set candidate = candidate_precedente | float(0) if is_number(candidate_precedente) else none %}
        {% endif %}

        {% set ns = namespace(apres_fenetre=false) %}
        {% if tid == 'figer' %}
          {% set ns.apres_fenetre = true %}
        {% else %}
          {% set lever_brut = state_attr('sun.sun', 'next_rising') %}
          {% set prochain_lever = as_local(as_datetime(lever_brut)) if lever_brut else none %}
          {% if prochain_lever is not none %}
            {% if prochain_lever.date() == now().date() %}
              {% set fin_fenetre = prochain_lever + timedelta(minutes=30) %}
            {% else %}
              {# Secours après redémarrage : le prochain lever est celui de demain. #}
              {% set fin_fenetre = prochain_lever - timedelta(days=1) + timedelta(minutes=30) %}
            {% endif %}
            {% set ns.apres_fenetre = now() >= fin_fenetre %}
          {% endif %}
        {% endif %}

        {% set calibrage = states('input_number.pcha_correction_temperature_piscine') | float(0) %}
        {% set reference = (candidate + calibrage) if candidate is not none else none %}
        {% set reference_valide = reference is not none and reference > 10 and reference < 50 %}

        {% if deja_fige and is_number(this.state) %}
          {{ this.state | float(0) }}
        {% elif reference_valide %}
          {% set t = reference | float(0) %}
          {% if t < 20 %}
            4
          {% elif t < 24 %}
            6
          {% elif t < 27 %}
            8
          {% else %}
            {{ (10 + 2 * (t - 27)) | round(1) }}
          {% endif %}
        {% elif is_number(this.state) %}
          {{ this.state | float(0) }}
        {% else %}
          {{ none }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"
        objectif_fige: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set aujourd_hui = now().date() | string %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour | default('')) != aujourd_hui %}
          {% set deja_fige = (not nouveau_jour) and (this.attributes.objectif_fige | default(false) | bool(false)) %}
          {% set brute = states('sensor.pcha_temperature_piscine_brute') %}
          {% set brute_valide = state_attr('sensor.pcha_temperature_piscine_brute', 'source_coherent') | bool(false) and is_number(brute) %}
          {% set candidate_precedente = this.attributes.temperature_candidate_brute | default(none) %}
          {% if nouveau_jour %}
            {% set candidate = (brute | float(0)) if brute_valide else none %}
          {% elif not deja_fige %}
            {% if brute_valide and is_number(candidate_precedente) %}
              {% set candidate = [candidate_precedente | float(0), brute | float(0)] | max %}
            {% elif brute_valide %}
              {% set candidate = brute | float(0) %}
            {% elif is_number(candidate_precedente) %}
              {% set candidate = candidate_precedente | float(0) %}
            {% else %}
              {% set candidate = none %}
            {% endif %}
          {% else %}
            {% set candidate = candidate_precedente | float(0) if is_number(candidate_precedente) else none %}
          {% endif %}
          {% set ns = namespace(apres=false) %}
          {% if tid == 'figer' %}
            {% set ns.apres = true %}
          {% else %}
            {% set lever_brut = state_attr('sun.sun', 'next_rising') %}
            {% set prochain_lever = as_local(as_datetime(lever_brut)) if lever_brut else none %}
            {% if prochain_lever is not none %}
              {% set fin_fenetre = (prochain_lever + timedelta(minutes=30)) if prochain_lever.date() == now().date() else (prochain_lever - timedelta(days=1) + timedelta(minutes=30)) %}
              {% set ns.apres = now() >= fin_fenetre %}
            {% endif %}
          {% endif %}
          {% set calibrage = states('input_number.pcha_correction_temperature_piscine') | float(0) %}
          {% set reference = (candidate + calibrage) if candidate is not none else none %}
          {{ deja_fige or (ns.apres and reference is not none and reference > 10 and reference < 50) }}
        temperature_candidate_brute: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour | default('')) != (now().date() | string) %}
          {% set deja_fige = (not nouveau_jour) and (this.attributes.objectif_fige | default(false) | bool(false)) %}
          {% set brute = states('sensor.pcha_temperature_piscine_brute') %}
          {% set brute_valide = state_attr('sensor.pcha_temperature_piscine_brute', 'source_coherent') | bool(false) and is_number(brute) %}
          {% set precedente = this.attributes.temperature_candidate_brute | default(none) %}
          {% if nouveau_jour %}
            {{ (brute | float(0) | round(1)) if brute_valide else none }}
          {% elif deja_fige %}
            {{ (precedente | float(0) | round(1)) if is_number(precedente) else none }}
          {% elif brute_valide and is_number(precedente) %}
            {{ [precedente | float(0), brute | float(0)] | max | round(1) }}
          {% elif brute_valide %}
            {{ brute | float(0) | round(1) }}
          {% elif is_number(precedente) %}
            {{ precedente | float(0) | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}
        temperature_reference: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour | default('')) != (now().date() | string) %}
          {% set deja_fige = (not nouveau_jour) and (this.attributes.objectif_fige | default(false) | bool(false)) %}
          {% if deja_fige and is_number(this.attributes.temperature_reference | default(none)) %}
            {{ this.attributes.temperature_reference | float(0) | round(1) }}
          {% else %}
            {% set brute = states('sensor.pcha_temperature_piscine_brute') %}
            {% set brute_valide = state_attr('sensor.pcha_temperature_piscine_brute', 'source_coherent') | bool(false) and is_number(brute) %}
            {% set precedente = this.attributes.temperature_candidate_brute | default(none) %}
            {% if nouveau_jour %}
              {% set candidate = (brute | float(0)) if brute_valide else none %}
            {% elif brute_valide and is_number(precedente) %}
              {% set candidate = [precedente | float(0), brute | float(0)] | max %}
            {% elif brute_valide %}
              {% set candidate = brute | float(0) %}
            {% elif is_number(precedente) %}
              {% set candidate = precedente | float(0) %}
            {% else %}
              {% set candidate = none %}
            {% endif %}
            {% set reference = (candidate + states('input_number.pcha_correction_temperature_piscine') | float(0)) if candidate is not none else none %}
            {{ reference | round(1) if reference is not none and reference > 10 and reference < 50 else none }}
          {% endif %}
        calibrage_reference: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour | default('')) != (now().date() | string) %}
          {% set deja_fige = (not nouveau_jour) and (this.attributes.objectif_fige | default(false) | bool(false)) %}
          {% if deja_fige and is_number(this.attributes.calibrage_reference | default(none)) %}
            {{ this.attributes.calibrage_reference | float(0) }}
          {% else %}
            {{ states('input_number.pcha_correction_temperature_piscine') | float(0) }}
          {% endif %}
        heure_figement: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour | default('')) != (now().date() | string) %}
          {% set deja_fige = (not nouveau_jour) and (this.attributes.objectif_fige | default(false) | bool(false)) %}
          {% if deja_fige %}
            {{ this.attributes.heure_figement | default(none) }}
          {% elif tid == 'figer' %}
            {{ now().isoformat() }}
          {% else %}
            {% set lever_brut = state_attr('sun.sun', 'next_rising') %}
            {% set prochain_lever = as_local(as_datetime(lever_brut)) if lever_brut else none %}
            {% set ns = namespace(apres=false) %}
            {% if prochain_lever is not none %}
              {% set fin_fenetre = (prochain_lever + timedelta(minutes=30)) if prochain_lever.date() == now().date() else (prochain_lever - timedelta(days=1) + timedelta(minutes=30)) %}
              {% set ns.apres = now() >= fin_fenetre %}
            {% endif %}
            {% set brute = states('sensor.pcha_temperature_piscine_brute') %}
            {% set brute_valide = state_attr('sensor.pcha_temperature_piscine_brute', 'source_coherent') | bool(false) and is_number(brute) %}
            {% set candidate_disponible = is_number(this.attributes.temperature_candidate_brute | default(none)) or brute_valide %}
            {% if ns.apres and candidate_disponible %}
              {{ now().isoformat() }}
            {% else %}
              {{ none }}
            {% endif %}
          {% endif %}
        strategie_reference: MAXIMUM_BRUT_DEPUIS_MINUIT_JUSQU_A_LEVER_PLUS_30_MIN

# Entités de lecture facilitant l'affichage et le diagnostic de la référence.
- sensor:
    - name: PCHA Température référence objectif quotidien
      unique_id: pcha_temperature_reference_objectif_quotidien
      default_entity_id: sensor.pcha_temperature_reference_objectif_quotidien
      device_class: temperature
      icon: mdi:thermometer-check
      unit_of_measurement: "°C"
      state_class: measurement
      state: >
        {% set reference = state_attr('sensor.pcha_objectif_filtration_quotidien', 'temperature_reference') %}
        {{ reference | float(0) | round(1) if is_number(reference) else none }}

- binary_sensor:
    - name: PCHA Objectif filtration figé
      unique_id: pcha_objectif_filtration_fige
      default_entity_id: binary_sensor.pcha_objectif_filtration_fige
      icon: mdi:lock-check
      state: >
        {{ state_attr('sensor.pcha_objectif_filtration_quotidien', 'objectif_fige') | bool(false) }}

################################################################################
# Temps restant et demande automatique
################################################################################
- sensor:
    - name: PCHA Temps filtration restant
      unique_id: pcha_temps_filtration_restant
      default_entity_id: sensor.pcha_temps_filtration_restant
      icon: mdi:timer-sand
      unit_of_measurement: "min"
      state_class: measurement
      state: >
        {% set objectif = states('sensor.pcha_objectif_filtration_quotidien') %}
        {% set realise = states('sensor.pcha_temps_filtration_realise') %}
        {% if is_number(objectif) and is_number(realise) %}
          {{ [((objectif | float(0)) * 60 - (realise | float(0))), 0] | max | round(0) }}
        {% else %}
          {{ none }}
        {% endif %}

- sensor:
    - name: PCHA Progression objectif quotidien
      unique_id: pcha_progression_objectif_quotidien
      default_entity_id: sensor.pcha_progression_objectif_quotidien
      icon: mdi:progress-clock
      unit_of_measurement: "%"
      state_class: measurement
      state: >
        {% set objectif = states('sensor.pcha_objectif_filtration_quotidien') %}
        {% set realise = states('sensor.pcha_temps_filtration_realise') %}
        {% if is_number(objectif) and is_number(realise) and (objectif | float(0)) > 0 %}
          {% set total = (objectif | float(0)) * 60 %}
          {{ [[((realise | float(0)) / total * 100), 0] | max, 100] | min | round(0) }}
        {% else %}
          {{ 0 }}
        {% endif %}

- binary_sensor:
    - name: PCHA Filtration requise
      unique_id: pcha_filtration_requise
      default_entity_id: binary_sensor.pcha_filtration_requise
      icon: mdi:water-pump
      state: >
        {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}
        {% if not is_number(restant_brut) or (restant_brut | float(0)) <= 0 %}
          false
        {% else %}
          {% set restant = restant_brut | float(0) %}
          {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
          {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
          {% if coucher is none %}
            true
          {% elif coucher.date() != now().date() %}
            true
          {% else %}
            {# L'objectif quotidien doit être terminé 2 h avant le coucher. #}
            {% set echeance = coucher - timedelta(hours=2) %}
            {% set depart_au_plus_tard = echeance - timedelta(minutes=restant) %}
            {{ now() >= depart_au_plus_tard }}
          {% endif %}
        {% endif %}

################################################################################
# Compteur quotidien de filtration. L'état est restauré après redémarrage.
################################################################################
- triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time_pattern
      minutes: "/1"
      id: minute
  sensor:
    - name: PCHA Temps filtration réalisé
      unique_id: pcha_temps_filtration_realise
      default_entity_id: sensor.pcha_temps_filtration_realise
      icon: mdi:timer-check
      unit_of_measurement: "min"
      state_class: measurement
      state: >
        {% set aujourd_hui = now().date() | string %}
        {% set jour_precedent = this.attributes.jour | default('') %}
        {% set precedent = this.state | float(0) if is_number(this.state) else 0 %}
        {% if jour_precedent != aujourd_hui %}
          0
        {% elif trigger.id == 'minute' and is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
          {{ [precedent + 1, 1440] | min }}
        {% else %}
          {{ precedent }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"

################################################################################
# Minimum et maximum journaliers de la température du bassin.
# La sonde est immergée : toute nouvelle mesure calibrée valide est prise en
# compte, que la pompe soit arrêtée ou en marche.
################################################################################
- triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: state
      entity_id: sensor.pcha_temperature_piscine
      id: temperature
    - trigger: time_pattern
      seconds: "/5"
      id: verification
    - trigger: time
      at: "00:00:00"
      id: minuit
  sensor:
    - name: PCHA Température bassin minimum du jour
      unique_id: pcha_temperature_piscine_min_jour
      default_entity_id: sensor.pcha_temperature_piscine_min_jour
      device_class: temperature
      icon: mdi:thermometer-chevron-down
      unit_of_measurement: "°C"
      state_class: measurement
      state: >
        {% set aujourd_hui = now().date() | string %}
        {% set jour_precedent = this.attributes.jour | default('') %}
        {% set courant = states('sensor.pcha_temperature_piscine') %}
        {% set mesure_valide = state_attr('sensor.pcha_temperature_piscine', 'measurement_valid') | bool(false) %}
        {% set courant_valide = mesure_valide and is_number(courant) and (courant | float(0)) > 10 and (courant | float(0)) < 50 %}
        {% set precedent_valide = is_number(this.state) and (this.state | float(0)) > 10 and (this.state | float(0)) < 50 %}
        {% if trigger.id == 'minuit' or jour_precedent != aujourd_hui %}
          {{ courant | float(0) | round(1) if courant_valide else none }}
        {% elif courant_valide %}
          {{ [this.state | float(0), courant | float(0)] | min | round(1) if precedent_valide else courant | float(0) | round(1) }}
        {% elif precedent_valide %}
          {{ this.state | float(0) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"

    - name: PCHA Température bassin maximum du jour
      unique_id: pcha_temperature_piscine_max_jour
      default_entity_id: sensor.pcha_temperature_piscine_max_jour
      device_class: temperature
      icon: mdi:thermometer-chevron-up
      unit_of_measurement: "°C"
      state_class: measurement
      state: >
        {% set aujourd_hui = now().date() | string %}
        {% set jour_precedent = this.attributes.jour | default('') %}
        {% set courant = states('sensor.pcha_temperature_piscine') %}
        {% set mesure_valide = state_attr('sensor.pcha_temperature_piscine', 'measurement_valid') | bool(false) %}
        {% set courant_valide = mesure_valide and is_number(courant) and (courant | float(0)) > 10 and (courant | float(0)) < 50 %}
        {% set precedent_valide = is_number(this.state) and (this.state | float(0)) > 10 and (this.state | float(0)) < 50 %}
        {% if trigger.id == 'minuit' or jour_precedent != aujourd_hui %}
          {{ courant | float(0) | round(1) if courant_valide else none }}
        {% elif courant_valide %}
          {{ [this.state | float(0), courant | float(0)] | max | round(1) if precedent_valide else courant | float(0) | round(1) }}
        {% elif precedent_valide %}
          {{ this.state | float(0) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"
