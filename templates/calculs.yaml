################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-003 — Calculs de filtration V1.1
#
# Entrées
#   input_number.pcha_coefficient_filtration_acceleration
#   input_number.pcha_coefficient_filtration_base
#   input_number.pcha_marge_objectif_avant_coucher
#   input_number.pcha_temperature_seuil_acceleration_filtration
#   input_select.pcha_etat_machine
#   sensor.pcha_temperature_piscine
#   sun.sun
#
# Sorties
#   binary_sensor.pcha_filtration_requise
#   binary_sensor.pcha_objectif_filtration_fige
#   sensor.pcha_objectif_filtration_quotidien
#   sensor.pcha_heure_atteinte_objectif
#   sensor.pcha_temperature_reference_objectif_quotidien
#   sensor.pcha_temperature_piscine_max_jour
#   sensor.pcha_temperature_piscine_min_jour
#   sensor.pcha_progression_objectif_quotidien
#   sensor.pcha_renouvellements_bassin_du_jour
#   sensor.pcha_temps_filtration_realise
#   sensor.pcha_temps_filtration_restant
#   number.pcha_seuil_luminosite_chauffage_klux
################################################################################

################################################################################
# Objectif quotidien
#
# La température calibrée cohérente est échantillonnée chaque minute. Au
# changement de jour, la moyenne de la journée terminée devient la référence
# figée de la nouvelle journée si au moins 1 080 échantillons valides (18 h)
# ont été reçus. Sinon, la dernière référence fiable est conservée en secours.
#
# Le capteur trigger-based restaure son état et ses attributs après redémarrage.
################################################################################
- triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time
      at: "00:00:00"
      id: minuit
    - trigger: time_pattern
      minutes: "/1"
      seconds: "30"
      id: echantillon
  sensor:
    - name: PCHA Objectif filtration quotidien
      unique_id: pcha_objectif_filtration_quotidien
      default_entity_id: sensor.pcha_objectif_filtration_quotidien
      icon: mdi:target
      unit_of_measurement: "h"
      state_class: measurement
      state: >
        {% set tid = trigger.id if trigger is defined else 'initialisation' %}
        {% set aujourd_hui = now().date() | string %}
        {% set hier = (now().date() - timedelta(days=1)) | string %}
        {% set jour_accumule = this.attributes.jour_accumulation | default('') %}
        {% set nouveau_jour = tid == 'minuit' or jour_accumule != aujourd_hui %}
        {% set somme = this.attributes.somme_temperature_jour | default(0) | float(0) %}
        {% set echantillons = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
        {% set echantillons_minimum = 1080 %}
        {% set moyenne_hier = (somme / echantillons) if nouveau_jour and jour_accumule == hier and echantillons >= echantillons_minimum else none %}
        {% set reference_precedente = this.attributes.temperature_reference | default(none) %}
        {% set temperature = states('sensor.pcha_temperature_piscine') %}
        {% set temperature_valide =
             state_attr('sensor.pcha_temperature_piscine', 'corrected_value_coherent') | bool(false)
             and is_number(temperature)
             and (temperature | float(0)) > 10
             and (temperature | float(0)) < 50 %}
        {% if moyenne_hier is not none %}
          {% set reference = moyenne_hier %}
        {% elif is_number(reference_precedente) %}
          {% set reference = reference_precedente | float(0) %}
        {% elif temperature_valide %}
          {% set reference = temperature | float(0) %}
        {% else %}
          {% set reference = none %}
        {% endif %}
        {% if reference is not none and reference > 10 and reference < 50 %}
          {% set t = reference | float(0) %}
          {% set coefficient_base = states('input_number.pcha_coefficient_filtration_base') | float(0.20) %}
          {% set seuil_acceleration = states('input_number.pcha_temperature_seuil_acceleration_filtration') | float(25) %}
          {% set coefficient_acceleration = states('input_number.pcha_coefficient_filtration_acceleration') | float(1.0) %}
          {% set depassement = [t - seuil_acceleration, 0] | max %}
          {{ ((t * coefficient_base) + (depassement * coefficient_acceleration)) | round(2) }}
        {% elif is_number(this.state) %}
          {{ this.state | float(0) }}
        {% else %}
          {{ none }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"
        objectif_fige: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set aujourd_hui = now().date() | string %}
          {% set hier = (now().date() - timedelta(days=1)) | string %}
          {% set jour_accumule = this.attributes.jour_accumulation | default('') %}
          {% set nouveau_jour = tid == 'minuit' or jour_accumule != aujourd_hui %}
          {% set somme = this.attributes.somme_temperature_jour | default(0) | float(0) %}
          {% set echantillons = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
          {% set echantillons_minimum = 1080 %}
          {% set moyenne_hier_valide = nouveau_jour and jour_accumule == hier and echantillons >= echantillons_minimum %}
          {{ moyenne_hier_valide or (this.attributes.objectif_fige | default(false) | bool(false)) or is_number(this.attributes.temperature_reference | default(none)) }}
        seuil_echantillons_reference: 1080
        duree_minimale_mesures_reference: "18 h"
        jour_accumulation: "{{ now().date() }}"
        somme_temperature_jour: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour_accumulation | default('')) != (now().date() | string) %}
          {% set precedente = this.attributes.somme_temperature_jour | default(0) | float(0) %}
          {% set temperature = states('sensor.pcha_temperature_piscine') %}
          {% set valide = state_attr('sensor.pcha_temperature_piscine', 'corrected_value_coherent') | bool(false) and is_number(temperature) and (temperature | float(0)) > 10 and (temperature | float(0)) < 50 %}
          {% if nouveau_jour %}
            {{ temperature | float(0) if valide else 0 }}
          {% elif tid == 'echantillon' and valide %}
            {{ precedente + (temperature | float(0)) }}
          {% else %}
            {{ precedente }}
          {% endif %}
        echantillons_temperature_jour: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour_accumulation | default('')) != (now().date() | string) %}
          {% set precedents = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
          {% set temperature = states('sensor.pcha_temperature_piscine') %}
          {% set valide = state_attr('sensor.pcha_temperature_piscine', 'corrected_value_coherent') | bool(false) and is_number(temperature) and (temperature | float(0)) > 10 and (temperature | float(0)) < 50 %}
          {% if nouveau_jour %}
            {{ 1 if valide else 0 }}
          {% elif tid == 'echantillon' and valide %}
            {{ precedents + 1 }}
          {% else %}
            {{ precedents }}
          {% endif %}
        temperature_moyenne_jour_en_cours: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set nouveau_jour = tid == 'minuit' or (this.attributes.jour_accumulation | default('')) != (now().date() | string) %}
          {% set somme = this.attributes.somme_temperature_jour | default(0) | float(0) %}
          {% set echantillons = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
          {% set temperature = states('sensor.pcha_temperature_piscine') %}
          {% set valide = state_attr('sensor.pcha_temperature_piscine', 'corrected_value_coherent') | bool(false) and is_number(temperature) and (temperature | float(0)) > 10 and (temperature | float(0)) < 50 %}
          {% if nouveau_jour %}
            {{ temperature | float(0) | round(2) if valide else none }}
          {% elif tid == 'echantillon' and valide %}
            {{ ((somme + (temperature | float(0))) / (echantillons + 1)) | round(2) }}
          {% elif echantillons > 0 %}
            {{ (somme / echantillons) | round(2) }}
          {% else %}
            {{ none }}
          {% endif %}
        temperature_reference: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set aujourd_hui = now().date() | string %}
          {% set hier = (now().date() - timedelta(days=1)) | string %}
          {% set jour_accumule = this.attributes.jour_accumulation | default('') %}
          {% set nouveau_jour = tid == 'minuit' or jour_accumule != aujourd_hui %}
          {% set somme = this.attributes.somme_temperature_jour | default(0) | float(0) %}
          {% set echantillons = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
          {% set echantillons_minimum = 1080 %}
          {% set precedente = this.attributes.temperature_reference | default(none) %}
          {% set temperature = states('sensor.pcha_temperature_piscine') %}
          {% set valide = state_attr('sensor.pcha_temperature_piscine', 'corrected_value_coherent') | bool(false) and is_number(temperature) and (temperature | float(0)) > 10 and (temperature | float(0)) < 50 %}
          {% if nouveau_jour and jour_accumule == hier and echantillons >= echantillons_minimum %}
            {{ (somme / echantillons) | round(2) }}
          {% elif is_number(precedente) %}
            {{ precedente | float(0) | round(2) }}
          {% elif valide %}
            {{ temperature | float(0) | round(2) }}
          {% else %}
            {{ none }}
          {% endif %}
        jour_reference: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set aujourd_hui = now().date() | string %}
          {% set hier = (now().date() - timedelta(days=1)) | string %}
          {% set jour_accumule = this.attributes.jour_accumulation | default('') %}
          {% set nouveau_jour = tid == 'minuit' or jour_accumule != aujourd_hui %}
          {% set echantillons = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
          {% set echantillons_minimum = 1080 %}
          {% if nouveau_jour and jour_accumule == hier and echantillons >= echantillons_minimum %}
            {{ hier }}
          {% elif this.attributes.jour_reference | default('') %}
            {{ this.attributes.jour_reference }}
          {% else %}
            {{ aujourd_hui }}
          {% endif %}
        heure_figement: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set aujourd_hui = now().date() | string %}
          {% set hier = (now().date() - timedelta(days=1)) | string %}
          {% set jour_accumule = this.attributes.jour_accumulation | default('') %}
          {% set nouveau_jour = tid == 'minuit' or jour_accumule != aujourd_hui %}
          {% set echantillons = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
          {% set echantillons_minimum = 1080 %}
          {% if nouveau_jour and jour_accumule == hier and echantillons >= echantillons_minimum %}
            {{ now().isoformat() }}
          {% else %}
            {{ this.attributes.heure_figement | default(none) }}
          {% endif %}
        reference_secours: >
          {% set tid = trigger.id if trigger is defined else 'initialisation' %}
          {% set aujourd_hui = now().date() | string %}
          {% set hier = (now().date() - timedelta(days=1)) | string %}
          {% set jour_accumule = this.attributes.jour_accumulation | default('') %}
          {% set nouveau_jour = tid == 'minuit' or jour_accumule != aujourd_hui %}
          {% set echantillons = this.attributes.echantillons_temperature_jour | default(0) | int(0) %}
          {% set echantillons_minimum = 1080 %}
          {% if nouveau_jour %}
            {{ not (jour_accumule == hier and echantillons >= echantillons_minimum) }}
          {% else %}
            {{ this.attributes.reference_secours | default(false) | bool(false) }}
          {% endif %}
        strategie_reference: MOYENNE_CALIBREE_JOUR_PRECEDENT_FIGEE_A_MINUIT

# Entités de lecture facilitant l'affichage et le diagnostic de la référence.
- sensor:
    - name: PCHA Température référence objectif quotidien
      unique_id: pcha_temperature_reference_objectif_quotidien
      default_entity_id: sensor.pcha_temperature_reference_objectif_quotidien
      device_class: temperature
      icon: mdi:thermometer-check
      unit_of_measurement: "°C"
      state_class: measurement
      state: >
        {% set reference = state_attr('sensor.pcha_objectif_filtration_quotidien', 'temperature_reference') %}
        {{ reference | float(0) | round(1) if is_number(reference) else none }}

- binary_sensor:
    - name: PCHA Objectif filtration figé
      unique_id: pcha_objectif_filtration_fige
      default_entity_id: binary_sensor.pcha_objectif_filtration_fige
      icon: mdi:lock-check
      state: >
        {{ state_attr('sensor.pcha_objectif_filtration_quotidien', 'objectif_fige') | bool(false) }}

################################################################################
# Temps restant et demande automatique
################################################################################
- sensor:
    - name: PCHA Temps filtration restant
      unique_id: pcha_temps_filtration_restant
      default_entity_id: sensor.pcha_temps_filtration_restant
      icon: mdi:timer-sand
      unit_of_measurement: "min"
      state_class: measurement
      state: >
        {% set objectif = states('sensor.pcha_objectif_filtration_quotidien') %}
        {% set realise = states('sensor.pcha_temps_filtration_realise') %}
        {% if is_number(objectif) and is_number(realise) %}
          {{ [((objectif | float(0)) * 60 - (realise | float(0))), 0] | max | round(0) }}
        {% else %}
          {{ none }}
        {% endif %}

# Interface historique conservée pour le dashboard et les consommateurs V1/V2.
# La source de vérité de la planification est désormais la couche V3.
- sensor:
    - name: PCHA Heure atteinte objectif
      unique_id: pcha_heure_atteinte_objectif
      default_entity_id: sensor.pcha_heure_atteinte_objectif
      icon: mdi:clock-check-outline
      state: >
        {% set v3 = states('sensor.pcha_heure_atteinte_objectif_v3') %}
        {% if v3 not in ['unknown', 'unavailable', 'none', ''] %}
          {{ v3 }}
        {% else %}
          {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}
          {% if not is_number(restant_brut) %}
            Indisponible
          {% else %}
            {% set restant = restant_brut | float(0) %}
            {% if restant <= 0 %}
              Atteint
            {% else %}
              {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
              {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
              {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
              {% if is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
                {% set fin = now() + timedelta(minutes=restant) %}
              {% elif coucher is not none and coucher.date() == now().date() %}
                {% set echeance = coucher - timedelta(minutes=marge) %}
                {% set depart = echeance - timedelta(minutes=restant) %}
                {% set fin = echeance if now() < depart else now() + timedelta(minutes=restant) %}
              {% else %}
                {% set fin = now() + timedelta(minutes=restant) %}
              {% endif %}
              {{ fin.strftime('%H') ~ 'H' ~ fin.strftime('%M') }}
            {% endif %}
          {% endif %}
        {% endif %}
      attributes:
        source_planification: >
          {{ 'V3' if states('sensor.pcha_heure_atteinte_objectif_v3') not in ['unknown', 'unavailable', 'none', ''] else 'REPLI_V2' }}
        source_cible: "{{ state_attr('sensor.pcha_heure_atteinte_objectif_v3', 'source_cible') }}"
        cible_utilisee: "{{ state_attr('sensor.pcha_heure_atteinte_objectif_v3', 'cible_utilisee') }}"
        depart_au_plus_tard: "{{ state_attr('sensor.pcha_heure_atteinte_objectif_v3', 'depart_au_plus_tard') }}"

- sensor:
    - name: PCHA Progression objectif quotidien
      unique_id: pcha_progression_objectif_quotidien
      default_entity_id: sensor.pcha_progression_objectif_quotidien
      icon: mdi:progress-clock
      unit_of_measurement: "%"
      state_class: measurement
      state: >
        {% set objectif = states('sensor.pcha_objectif_filtration_quotidien') %}
        {% set realise = states('sensor.pcha_temps_filtration_realise') %}
        {% if is_number(objectif) and is_number(realise) and (objectif | float(0)) > 0 %}
          {% set total = (objectif | float(0)) * 60 %}
          {{ [[((realise | float(0)) / total * 100), 0] | max, 100] | min | round(0) }}
        {% else %}
          {{ 0 }}
        {% endif %}

# Alias de compatibilité : la décision V3 est la référence, avec repli V2 si la
# couche V3 n'est pas encore disponible pendant un démarrage.
- binary_sensor:
    - name: PCHA Filtration requise
      unique_id: pcha_filtration_requise
      default_entity_id: binary_sensor.pcha_filtration_requise
      icon: mdi:water-pump
      state: >
        {% set v3 = states('binary_sensor.pcha_filtration_requise_v3') %}
        {% if v3 in ['on', 'off'] %}
          {{ v3 == 'on' }}
        {% else %}
          {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}
          {% if not is_number(restant_brut) or (restant_brut | float(0)) <= 0 %}
            false
          {% else %}
            {% set restant = restant_brut | float(0) %}
            {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
            {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
            {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
            {% if coucher is none or coucher.date() != now().date() %}
              true
            {% else %}
              {% set echeance = coucher - timedelta(minutes=marge) %}
              {% set depart_au_plus_tard = echeance - timedelta(minutes=restant) %}
              {{ now() >= depart_au_plus_tard }}
            {% endif %}
          {% endif %}
        {% endif %}
      attributes:
        source_planification: >
          {{ 'V3' if states('binary_sensor.pcha_filtration_requise_v3') in ['on', 'off'] else 'REPLI_V2' }}
        source_cible: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'source_cible') }}"
        cible_utilisee: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'cible_utilisee') }}"
        depart_au_plus_tard: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'depart_au_plus_tard') }}"

################################################################################
# Compteur quotidien de filtration. L'état est restauré après redémarrage.
################################################################################
- triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time_pattern
      minutes: "/1"
      id: minute
  sensor:
    - name: PCHA Temps filtration réalisé
      unique_id: pcha_temps_filtration_realise
      default_entity_id: sensor.pcha_temps_filtration_realise
      icon: mdi:timer-check
      unit_of_measurement: "min"
      state_class: measurement
      state: >
        {% set aujourd_hui = now().date() | string %}
        {% set jour_precedent = this.attributes.jour | default('') %}
        {% set precedent = this.state | float(0) if is_number(this.state) else 0 %}
        {% if jour_precedent != aujourd_hui %}
          0
        {% elif trigger.id == 'minute' and is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
          {{ [precedent + 1, 1440] | min }}
        {% else %}
          {{ precedent }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"

################################################################################
# Minimum et maximum journaliers de la température du bassin.
# La sonde est immergée : toute nouvelle mesure calibrée valide est prise en
# compte, que la pompe soit arrêtée ou en marche.
################################################################################
- triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: state
      entity_id: sensor.pcha_temperature_piscine
      id: temperature
    - trigger: time_pattern
      seconds: "/5"
      id: verification
    - trigger: time
      at: "00:00:00"
      id: minuit
  sensor:
    - name: PCHA Température bassin minimum du jour
      unique_id: pcha_temperature_piscine_min_jour
      default_entity_id: sensor.pcha_temperature_piscine_min_jour
      device_class: temperature
      icon: mdi:thermometer-chevron-down
      unit_of_measurement: "°C"
      state_class: measurement
      state: >
        {% set aujourd_hui = now().date() | string %}
        {% set jour_precedent = this.attributes.jour | default('') %}
        {% set courant = states('sensor.pcha_temperature_piscine') %}
        {% set mesure_valide = state_attr('sensor.pcha_temperature_piscine', 'measurement_valid') | bool(false) %}
        {% set courant_valide = mesure_valide and is_number(courant) and (courant | float(0)) > 10 and (courant | float(0)) < 50 %}
        {% set precedent_valide = is_number(this.state) and (this.state | float(0)) > 10 and (this.state | float(0)) < 50 %}
        {% if trigger.id == 'minuit' or jour_precedent != aujourd_hui %}
          {{ courant | float(0) | round(1) if courant_valide else none }}
        {% elif courant_valide %}
          {{ [this.state | float(0), courant | float(0)] | min | round(1) if precedent_valide else courant | float(0) | round(1) }}
        {% elif precedent_valide %}
          {{ this.state | float(0) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"

    - name: PCHA Température bassin maximum du jour
      unique_id: pcha_temperature_piscine_max_jour
      default_entity_id: sensor.pcha_temperature_piscine_max_jour
      device_class: temperature
      icon: mdi:thermometer-chevron-up
      unit_of_measurement: "°C"
      state_class: measurement
      state: >
        {% set aujourd_hui = now().date() | string %}
        {% set jour_precedent = this.attributes.jour | default('') %}
        {% set courant = states('sensor.pcha_temperature_piscine') %}
        {% set mesure_valide = state_attr('sensor.pcha_temperature_piscine', 'measurement_valid') | bool(false) %}
        {% set courant_valide = mesure_valide and is_number(courant) and (courant | float(0)) > 10 and (courant | float(0)) < 50 %}
        {% set precedent_valide = is_number(this.state) and (this.state | float(0)) > 10 and (this.state | float(0)) < 50 %}
        {% if trigger.id == 'minuit' or jour_precedent != aujourd_hui %}
          {{ courant | float(0) | round(1) if courant_valide else none }}
        {% elif courant_valide %}
          {{ [this.state | float(0), courant | float(0)] | max | round(1) if precedent_valide else courant | float(0) | round(1) }}
        {% elif precedent_valide %}
          {{ this.state | float(0) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}
      attributes:
        jour: "{{ now().date() }}"

################################################################################
# Volume quotidien filtré rapporté au volume du bassin de 4 m³.
################################################################################
- sensor:
    - name: PCHA Renouvellements bassin du jour
      unique_id: pcha_renouvellements_bassin_du_jour
      default_entity_id: sensor.pcha_renouvellements_bassin_du_jour
      icon: mdi:rotate-3d-variant
      unit_of_measurement: "x"
      state_class: measurement
      availability: >
        {{
          is_number(states('sensor.pcha_volume_filtre_total'))
          and is_number(states('sensor.pcha_volume_filtre_quotidien'))
        }}
      state: >
        {% set volume = states('sensor.pcha_volume_filtre_quotidien') %}
        {{ ((volume | float(0)) / 4) | round(1) }}
      attributes:
        volume_bassin_m3: 4
        volume_filtre_m3: >
          {% set volume = states('sensor.pcha_volume_filtre_quotidien') %}
          {{ volume | float(0) | round(2) if is_number(volume) else none }}
        source_volume_total: >
          {{ states('sensor.pcha_volume_filtre_total') }}
        source_volume_quotidien: >
          {{ states('sensor.pcha_volume_filtre_quotidien') }}

################################################################################
# Seuil solaire affiché en klux sans modifier le helper métier stocké en lux.
################################################################################
- number:
    - name: PCHA Seuil luminosité chauffage klux
      unique_id: pcha_seuil_luminosite_chauffage_klux
      default_entity_id: number.pcha_seuil_luminosite_chauffage_klux
      icon: mdi:white-balance-sunny
      unit_of_measurement: "klux"
      min: 0
      max: 50
      step: 0.5
      state: >
        {% set seuil = states('input_number.pcha_seuil_luminosite_chauffage') %}
