################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-006 — Modes et informations du traitement
#
# Entrées
#   binary_sensor.pcha_chauffage_solaire_requis
#   binary_sensor.pcha_filtration_requise_v3
#   binary_sensor.pcha_protection_serpentin_requise
#   input_boolean.pcha_fenetre_stabilisation_demarrage
#   input_select.pcha_mode_de_fonctionnement
#   switch.pcha_commande_pompe_filtration
#   timer.pcha_traitement
#   timer.pcha_vidange
#
# Sorties
#   binary_sensor.pcha_demande_fonctionnement
#   sensor.pcha_motif_fonctionnement
#   sensor.pcha_temps_traitement_restant
#   sensor.pcha_temps_vidange_restant
################################################################################

# Demande unique consommée par la machine à états.
#
# Après un redémarrage de Home Assistant, AUTO et SECURISATION conservent
# pendant 60 secondes l'état physique déjà observé de la pompe. Cela évite
# qu'un état restauré ou une interface en cours de reconnexion provoque un
# arrêt ou un démarrage intempestif. La machine à états reste néanmoins active
# et conserve la priorité de ses niveaux CRITIQUES.
- binary_sensor:
    - name: PCHA Demande fonctionnement
      unique_id: pcha_demande_fonctionnement
      default_entity_id: binary_sensor.pcha_demande_fonctionnement
      icon: mdi:state-machine
      availability: >
        {% set mode = states('input_select.pcha_mode_de_fonctionnement') %}
        {% set stabilisation = is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') %}
        {% set pompe_connue = states('switch.pcha_commande_pompe_filtration') in ['on', 'off'] %}
        {% set modes_valides = ['OFF', 'SECURISATION', 'AUTO', 'TRAITEMENT', 'MARCHE_FORCEE', 'VIDANGE'] %}
        {% set invalide = ['unknown', 'unavailable', 'none', ''] %}

        {% if mode not in modes_valides %}
          false
        {% elif mode in ['OFF', 'MARCHE_FORCEE'] %}
          true
        {% elif mode == 'TRAITEMENT' %}
          {{ states('timer.pcha_traitement') not in invalide }}
        {% elif mode == 'VIDANGE' %}
          {{ states('timer.pcha_vidange') not in invalide }}
        {% elif mode in ['SECURISATION', 'AUTO'] and stabilisation %}
          {{ pompe_connue }}
        {% elif mode == 'SECURISATION' %}
          {% set luminosite_prete =
               state_attr('sensor.pcha_luminosite', 'source_available') | bool(false)
               or is_state('binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible', 'on') %}
          {{
            luminosite_prete
            and states('binary_sensor.pcha_protection_serpentin_requise') not in invalide
            and states('sun.sun') not in invalide
          }}
        {% elif mode == 'AUTO' %}
          {% set filtration_prete = is_number(states('sensor.pcha_temps_filtration_restant')) %}
          {% set temperature_prete =
               state_attr('sensor.pcha_temperature_piscine', 'measurement_valid') | bool(false)
               or is_state('binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible', 'on')
               or is_state('binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente', 'on') %}
          {% set luminosite_prete =
               state_attr('sensor.pcha_luminosite', 'source_available') | bool(false)
               or is_state('binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible', 'on') %}
          {% set decisions_pretes =
               states('binary_sensor.pcha_filtration_requise_v3') not in invalide
               and states('binary_sensor.pcha_chauffage_solaire_requis') not in invalide
               and states('binary_sensor.pcha_protection_serpentin_requise') not in invalide %}
          {{
            filtration_prete
            and temperature_prete
            and luminosite_prete
            and decisions_pretes
            and states('sun.sun') not in invalide
          }}
        {% else %}
          false
        {% endif %}
      state: >
        {% set mode = states('input_select.pcha_mode_de_fonctionnement') %}
        {% set stabilisation = is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') %}
        {% set pompe_active = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
        {% if mode == 'OFF' %}
          false
        {% elif mode == 'SECURISATION' and stabilisation %}
          {{ pompe_active }}
        {% elif mode == 'SECURISATION' %}
          {{ is_state('binary_sensor.pcha_protection_serpentin_requise', 'on') }}
        {% elif mode == 'AUTO' and stabilisation %}
          {{ pompe_active }}
        {% elif mode == 'AUTO' %}
          {{
            is_state('binary_sensor.pcha_filtration_requise_v3', 'on')
            or is_state('binary_sensor.pcha_chauffage_solaire_requis', 'on')
            or is_state('binary_sensor.pcha_protection_serpentin_requise', 'on')
          }}
        {% elif mode == 'TRAITEMENT' %}
          {{ is_state('timer.pcha_traitement', 'active') or is_state('timer.pcha_traitement', 'paused') }}
        {% elif mode == 'MARCHE_FORCEE' %}
          true
        {% elif mode == 'VIDANGE' %}
          {{ is_state('timer.pcha_vidange', 'active') }}
        {% else %}
          false
        {% endif %}
      attributes:
        stabilisation_demarrage: >
          {{ is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') }}
        strategie_stabilisation: >
          {{ 'CONSERVER_ETAT_PHYSIQUE_POMPE' if is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') else 'LOGIQUE_METIER_NORMALE' }}

# Motif lisible de la demande / du fonctionnement courant.
# En AUTO, les trois contributeurs sont exposés séparément et combinés lorsque
# plusieurs demandes sont actives au même instant. Si la pompe reste en marche
# sans demande active, l'état signale la temporisation minimale de marche.
- sensor:
    - name: PCHA Motif fonctionnement
      unique_id: pcha_motif_fonctionnement
      default_entity_id: sensor.pcha_motif_fonctionnement
      icon: mdi:source-branch
      state: >
        {% set mode = states('input_select.pcha_mode_de_fonctionnement') %}
        {% set stabilisation = is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') %}
        {% set pompe_active = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
        {% set filtration = is_state('binary_sensor.pcha_filtration_requise_v3', 'on') %}
        {% set solaire = is_state('binary_sensor.pcha_chauffage_solaire_requis', 'on') %}
        {% set protection = is_state('binary_sensor.pcha_protection_serpentin_requise', 'on') %}
        {% set ns = namespace(motifs=[]) %}

        {% if mode == 'OFF' %}
          ARRÊT
        {% elif mode == 'MARCHE_FORCEE' %}
          MARCHE FORCÉE
        {% elif mode == 'TRAITEMENT' %}
          TRAITEMENT
        {% elif mode == 'VIDANGE' %}
          VIDANGE
        {% elif mode in ['AUTO', 'SECURISATION'] and stabilisation %}
          {{ 'STABILISATION — ÉTAT POMPE CONSERVÉ' if pompe_active else 'STABILISATION — POMPE ARRÊTÉE' }}
        {% elif mode == 'SECURISATION' %}
          {{ 'PROTECTION SERPENTIN' if protection else 'AUCUNE DEMANDE' }}
        {% elif mode == 'AUTO' %}
          {% if filtration %}
            {% set ns.motifs = ns.motifs + ['FILTRATION'] %}
          {% endif %}
          {% if solaire %}
            {% set ns.motifs = ns.motifs + ['CHAUFFAGE SOLAIRE'] %}
          {% endif %}
          {% if protection %}
            {% set ns.motifs = ns.motifs + ['PROTECTION SERPENTIN'] %}
          {% endif %}
          {% if ns.motifs | count > 0 %}
            {{ ns.motifs | join(' + ') }}
          {% elif pompe_active and is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
            MARCHE MINIMALE
          {% else %}
            AUCUNE DEMANDE
          {% endif %}
        {% else %}
          INDISPONIBLE
        {% endif %}
      attributes:
        mode: "{{ states('input_select.pcha_mode_de_fonctionnement') }}"
        etat_machine: "{{ states('input_select.pcha_etat_machine') }}"
        pompe_active: "{{ is_state('switch.pcha_commande_pompe_filtration', 'on') }}"
        demande_active: "{{ is_state('binary_sensor.pcha_demande_fonctionnement', 'on') }}"
        filtration_requise_v3: "{{ is_state('binary_sensor.pcha_filtration_requise_v3', 'on') }}"
        chauffage_solaire_requis: "{{ is_state('binary_sensor.pcha_chauffage_solaire_requis', 'on') }}"
        protection_serpentin_requise: "{{ is_state('binary_sensor.pcha_protection_serpentin_requise', 'on') }}"
        stabilisation_demarrage: "{{ is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') }}"
        temporisation_marche_minimale: >
          {{
            is_state('input_select.pcha_mode_de_fonctionnement', 'AUTO')
            and is_state('switch.pcha_commande_pompe_filtration', 'on')
            and is_state('input_select.pcha_etat_machine', 'FILTRATION')
            and not is_state('binary_sensor.pcha_filtration_requise_v3', 'on')
            and not is_state('binary_sensor.pcha_chauffage_solaire_requis', 'on')
            and not is_state('binary_sensor.pcha_protection_serpentin_requise', 'on')
          }}

# Information d'affichage du temps restant du traitement.
- sensor:
    - name: PCHA Temps traitement restant
      unique_id: pcha_temps_traitement_restant
      default_entity_id: sensor.pcha_temps_traitement_restant
      icon: mdi:timer-sand
      unit_of_measurement: "min"
      state_class: measurement
      state: >
        {% if is_state('timer.pcha_traitement', 'active') %}
          {% set fin = state_attr('timer.pcha_traitement', 'finishes_at') %}
          {% if fin %}
            {{ [((as_timestamp(fin) - as_timestamp(now())) / 60), 0] | max | round(0, 'ceil') | int }}
          {% else %}
            0
          {% endif %}
        {% elif is_state('timer.pcha_traitement', 'paused') %}
          {% set restant = state_attr('timer.pcha_traitement', 'remaining') | default('00:00:00', true) %}
          {% set parties = restant.split(':') %}
          {% if parties | count == 3 %}
            {{ ((parties[0] | int(0)) * 60 + (parties[1] | int(0)) + (parties[2] | int(0)) / 60) | round(0, 'ceil') | int }}
          {% else %}
            0
          {% endif %}
        {% else %}
          0
        {% endif %}

    - name: PCHA Temps vidange restant
      unique_id: pcha_temps_vidange_restant
      default_entity_id: sensor.pcha_temps_vidange_restant
      icon: mdi:timer-sand
      unit_of_measurement: "min"
      state_class: measurement
      state: >
        {% if is_state('timer.pcha_vidange', 'active') %}
          {% set fin = state_attr('timer.pcha_vidange', 'finishes_at') %}
          {% if fin %}
            {{ [((as_timestamp(fin) - as_timestamp(now())) / 60), 0] | max | round(0, 'ceil') | int }}
          {% else %}
            0
          {% endif %}
        {% else %}
          0
        {% endif %}
