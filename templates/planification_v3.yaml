################################################################################
# Pool Controller Home Assistant (PCHA)
# V3.0 — Activation de la planification météo-adaptative
#
# Entrées PCHA
#   input_number.pcha_marge_objectif_avant_coucher
#   input_number.pcha_temps_arret_pompe_min
#   input_select.pcha_etat_machine
#   sensor.pcha_heure_cible_objectif
#   sensor.pcha_temps_filtration_restant
#   switch.pcha_commande_pompe_filtration
#   sun.sun
#
# Sorties
#   binary_sensor.pcha_filtration_requise_v3
#   sensor.pcha_heure_atteinte_objectif_v3
#
# La cible V3 est utilisée lorsqu'elle est exploitable. En cas d'indisponibilité
# ou d'incohérence, la logique historique coucher du soleil - marge est reprise.
#
# Une fois le départ au plus tard atteint, la demande de filtration est
# verrouillée jusqu'à l'atteinte de l'objectif quotidien. Une évolution météo
# ultérieure ne peut donc plus repousser une filtration déjà devenue obligatoire.
#
# Le temps restant et l'évaluation de planification étant à la minute, une
# tolérance de 60 s est appliquée au seuil d'engagement.
#
# Lorsque la pompe tourne déjà avant l'engagement de la filtration quotidienne,
# le seuil est en plus anticipé du temps minimum d'arrêt configuré. Ainsi PCHA ne
# laisse pas s'arrêter une pompe déjà en marche si l'arrêt imposé ensuite ferait
# dépasser le départ au plus tard nécessaire pour atteindre la cible V3.
################################################################################

- triggers:
    - trigger: homeassistant
      event: start
      id: demarrage
    - trigger: time
      at: "00:00:00"
      id: minuit
    - trigger: time_pattern
      minutes: "/1"
      seconds: "00"
      id: minute
    - trigger: state
      entity_id: sensor.pcha_temps_filtration_restant
      id: restant
    - trigger: state
      entity_id: sensor.pcha_heure_cible_objectif
      id: cible
    - trigger: state
      entity_id: input_number.pcha_marge_objectif_avant_coucher
      id: marge
    - trigger: state
      entity_id: input_number.pcha_temps_arret_pompe_min
      id: arret_min
    - trigger: state
      entity_id: switch.pcha_commande_pompe_filtration
      id: pompe
  binary_sensor:
    - name: PCHA Filtration requise V3
      unique_id: pcha_filtration_requise_v3
      default_entity_id: binary_sensor.pcha_filtration_requise_v3
      icon: mdi:water-pump
      state: >
        {% set tid = trigger.id if trigger is defined else 'evaluation' %}
        {% set aujourd_hui = now().date() | string %}
        {% set jour_engagement = this.attributes.jour_engagement | default('') %}
        {% set deja_engagee = this.state == 'on' and jour_engagement == aujourd_hui %}
        {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}

        {% if tid == 'minuit' %}
          false
        {% elif deja_engagee %}
          {% if is_number(restant_brut) and (restant_brut | float(0)) <= 0 %}
            false
          {% else %}
            true
          {% endif %}
        {% elif not is_number(restant_brut) or (restant_brut | float(0)) <= 0 %}
          false
        {% else %}
          {% set restant = restant_brut | float(0) %}
          {% set cible_brute = states('sensor.pcha_heure_cible_objectif') %}
          {% set cible_v3 = as_local(as_datetime(cible_brute)) if cible_brute not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% set cible_v3_valide = cible_v3 is not none and cible_v3.date() == now().date() %}

          {% if cible_v3_valide %}
            {% set echeance = cible_v3 %}
          {% else %}
            {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
            {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
            {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
            {% if coucher is none or coucher.date() != now().date() %}
              {% set echeance = none %}
            {% else %}
              {% set echeance = coucher - timedelta(minutes=marge) %}
            {% endif %}
          {% endif %}

          {% if echeance is none %}
            true
          {% else %}
            {% set depart_au_plus_tard = echeance - timedelta(minutes=restant) %}
            {% set pompe_active = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
            {% set arret_min = states('input_number.pcha_temps_arret_pompe_min') | float(25) %}
            {% set anticipation_arret_s = ([arret_min, 0] | max) * 60 if pompe_active else 0 %}
            {% set seuil_engagement = depart_au_plus_tard - timedelta(seconds=(60 + anticipation_arret_s)) %}
            {{ now() >= seuil_engagement }}
          {% endif %}
        {% endif %}
      attributes:
        version_planification: V3.0-ACTIVE-4-LATCH-ARRET-MIN
        active_sur_commande_pompe: true
        strategie_verrouillage: JUSQU_OBJECTIF_QUOTIDIEN_ATTEINT
        tolerance_engagement_s: 60
        anticipation_arret_min: >
          {% if is_state('switch.pcha_commande_pompe_filtration', 'on') %}
            {{ [states('input_number.pcha_temps_arret_pompe_min') | float(25), 0] | max | round(0) }}
          {% else %}
            0
          {% endif %}
        pompe_active_au_calcul: "{{ is_state('switch.pcha_commande_pompe_filtration', 'on') }}"
        jour_engagement: >
          {% set tid = trigger.id if trigger is defined else 'evaluation' %}
          {% set aujourd_hui = now().date() | string %}
          {% set precedent = this.attributes.jour_engagement | default('') %}
          {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}
          {% if tid == 'minuit' %}
            {{ none }}
          {% elif is_number(restant_brut) and (restant_brut | float(0)) <= 0 %}
            {{ none }}
          {% elif this.state == 'on' and precedent == aujourd_hui %}
            {{ aujourd_hui }}
          {% elif not is_number(restant_brut) %}
            {{ none }}
          {% else %}
            {% set restant = restant_brut | float(0) %}
            {% set cible_brute = states('sensor.pcha_heure_cible_objectif') %}
            {% set cible = as_local(as_datetime(cible_brute)) if cible_brute not in ['unknown', 'unavailable', 'none', ''] else none %}
            {% if cible is none or cible.date() != now().date() %}
              {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
              {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
              {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
              {% set cible = coucher - timedelta(minutes=marge) if coucher is not none and coucher.date() == now().date() else none %}
            {% endif %}
            {% if cible is none %}
              {{ aujourd_hui }}
            {% else %}
              {% set depart = cible - timedelta(minutes=restant) %}
              {% set pompe_active = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
              {% set arret_min = states('input_number.pcha_temps_arret_pompe_min') | float(25) %}
              {% set anticipation_arret_s = ([arret_min, 0] | max) * 60 if pompe_active else 0 %}
              {% set seuil = depart - timedelta(seconds=(60 + anticipation_arret_s)) %}
              {{ aujourd_hui if now() >= seuil else none }}
            {% endif %}
          {% endif %}
        source_cible: >
          {% set cible_brute = states('sensor.pcha_heure_cible_objectif') %}
          {% set cible = as_local(as_datetime(cible_brute)) if cible_brute not in ['unknown', 'unavailable', 'none', ''] else none %}
          {{ 'CIBLE_METEO_V3' if cible is not none and cible.date() == now().date() else 'REPLI_V2' }}
        cible_utilisee: >
          {% set cible_brute = states('sensor.pcha_heure_cible_objectif') %}
          {% set cible = as_local(as_datetime(cible_brute)) if cible_brute not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% if cible is not none and cible.date() == now().date() %}
            {{ cible.isoformat() }}
          {% else %}
            {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
            {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
            {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
            {{ (coucher - timedelta(minutes=marge)).isoformat() if coucher is not none and coucher.date() == now().date() else none }}
          {% endif %}
        depart_au_plus_tard: >
          {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}
          {% set cible_brute = states('sensor.pcha_heure_cible_objectif') %}
          {% set cible = as_local(as_datetime(cible_brute)) if cible_brute not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% if not is_number(restant_brut) %}
            {{ none }}
          {% else %}
            {% if cible is none or cible.date() != now().date() %}
              {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
              {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
              {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
              {% set cible = coucher - timedelta(minutes=marge) if coucher is not none and coucher.date() == now().date() else none %}
            {% endif %}
            {{ (cible - timedelta(minutes=(restant_brut | float(0)))).isoformat() if cible is not none else none }}
          {% endif %}
        seuil_engagement: >
          {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}
          {% set cible_brute = states('sensor.pcha_heure_cible_objectif') %}
          {% set cible = as_local(as_datetime(cible_brute)) if cible_brute not in ['unknown', 'unavailable', 'none', ''] else none %}
          {% if not is_number(restant_brut) %}
            {{ none }}
          {% else %}
            {% if cible is none or cible.date() != now().date() %}
              {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
              {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
              {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
              {% set cible = coucher - timedelta(minutes=marge) if coucher is not none and coucher.date() == now().date() else none %}
            {% endif %}
            {% if cible is none %}
              {{ none }}
            {% else %}
              {% set pompe_active = is_state('switch.pcha_commande_pompe_filtration', 'on') %}
              {% set arret_min = states('input_number.pcha_temps_arret_pompe_min') | float(25) %}
              {% set anticipation_arret_s = ([arret_min, 0] | max) * 60 if pompe_active else 0 %}
              {{ (cible - timedelta(minutes=(restant_brut | float(0)), seconds=(60 + anticipation_arret_s))).isoformat() }}
            {% endif %}
          {% endif %}
        marge_avant_depart_s: >
          {% set depart = state_attr('binary_sensor.pcha_filtration_requise_v3', 'depart_au_plus_tard') %}
          {% set depart_dt = as_local(as_datetime(depart)) if depart not in [none, 'unknown', 'unavailable', 'none', ''] else none %}
          {{ ((depart_dt - now()).total_seconds() | round(0)) if depart_dt is not none else none }}

- sensor:
    - name: PCHA Heure atteinte objectif V3
      unique_id: pcha_heure_atteinte_objectif_v3
      default_entity_id: sensor.pcha_heure_atteinte_objectif_v3
      icon: mdi:clock-check-outline
      state: >
        {% set restant_brut = states('sensor.pcha_temps_filtration_restant') %}
        {% if not is_number(restant_brut) %}
          Indisponible
        {% else %}
          {% set restant = restant_brut | float(0) %}
          {% if restant <= 0 %}
            Atteint
          {% else %}
            {% set cible_brute = states('sensor.pcha_heure_cible_objectif') %}
            {% set cible = as_local(as_datetime(cible_brute)) if cible_brute not in ['unknown', 'unavailable', 'none', ''] else none %}
            {% if cible is none or cible.date() != now().date() %}
              {% set coucher_brut = state_attr('sun.sun', 'next_setting') %}
              {% set coucher = as_local(as_datetime(coucher_brut)) if coucher_brut else none %}
              {% set marge = states('input_number.pcha_marge_objectif_avant_coucher') | float(120) %}
              {% set cible = coucher - timedelta(minutes=marge) if coucher is not none and coucher.date() == now().date() else none %}
            {% endif %}

            {% if is_state('input_select.pcha_etat_machine', 'FILTRATION') %}
              {% set fin = now() + timedelta(minutes=restant) %}
            {% elif cible is not none %}
              {% set depart = cible - timedelta(minutes=restant) %}
              {% set fin = cible if now() < depart else now() + timedelta(minutes=restant) %}
            {% else %}
              {% set fin = now() + timedelta(minutes=restant) %}
            {% endif %}
            {{ fin.strftime('%H') ~ 'H' ~ fin.strftime('%M') }}
          {% endif %}
        {% endif %}
      attributes:
        version_planification: V3.0-ACTIVE-4-LATCH-ARRET-MIN
        source_cible: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'source_cible') }}"
        cible_utilisee: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'cible_utilisee') }}"
        depart_au_plus_tard: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'depart_au_plus_tard') }}"
        seuil_engagement: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'seuil_engagement') }}"
        anticipation_arret_min: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'anticipation_arret_min') }}"
        jour_engagement: "{{ state_attr('binary_sensor.pcha_filtration_requise_v3', 'jour_engagement') }}"
