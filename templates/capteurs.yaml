################################################################################
#
# Pool Controller Home Assistant (PCHA)
#
# SPEC-004
# Couche d'abstraction - Capteurs
#
################################################################################

- sensor:

###############################################################################
# Température piscine
###############################################################################

    - name: PCHA Température piscine
      unique_id: pcha_temperature_piscine
      device_class: temperature
      unit_of_measurement: "°C"

      state: >
        {% set value = states('sensor.jardin_esp32_jardin_temperature_piscine') %}
        {% if value not in ['unknown','unavailable','none',''] %}
          {{ value | float }}
        {% else %}
          {{ this.state if this.state not in ['unknown','unavailable','none',''] else 0 }}
        {% endif %}

