name: PCHA V3 dashboard meteo main - one shot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: ${{ github.event.head_commit.message == 'build: déclencher le patch one-shot météo V3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply dashboard patch
        run: python tools/patch_dashboard_v3_meteo.py
      - name: Commit dashboard and remove one-shot tools
        shell: bash
        run: |
          rm tools/patch_dashboard_v3_meteo.py
          rm .github/workflows/v3-dashboard-meteo-main-once.yml
          git config user.name "PCHA V3 automation"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/piscine.yaml tools/patch_dashboard_v3_meteo.py .github/workflows/v3-dashboard-meteo-main-once.yml
          git commit -m "V3.0 - afficher météo et potentiel thermique sur accueil"
          git push origin HEAD:main
