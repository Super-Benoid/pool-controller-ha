name: One-shot dashboard cible V3

on:
  push:
    branches: [main]
    paths:
      - tools/patch_dashboard_cible_v3.py
      - .github/workflows/one-shot-dashboard-cible-v3.yml

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Appliquer le patch
        run: python3 tools/patch_dashboard_cible_v3.py
      - name: Nettoyer le patch one-shot
        run: git rm tools/patch_dashboard_cible_v3.py .github/workflows/one-shot-dashboard-cible-v3.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/piscine.yaml
          git commit -m "Dashboard V3 : distinguer fin estimée et cible V3"
          git push origin HEAD:main
