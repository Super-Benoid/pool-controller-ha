name: PCHA patch dashboard motif

on:
  push:
    branches:
      - agent/v3-motif-fonctionnement

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: ${{ !contains(github.event.head_commit.message, '[dashboard-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v3-motif-fonctionnement
          fetch-depth: 0

      - name: Ajouter le motif dans l'en-tête de l'accueil
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('dashboard/piscine.yaml')
          text = dashboard.read_text(encoding='utf-8')

          old_triggers = """        triggers_update:\n          - binary_sensor.pcha_demande_fonctionnement\n          - binary_sensor.pcha_chauffage_solaire_requis\n          - binary_sensor.pcha_chauffage_solaire_actif\n          - binary_sensor.pcha_protection_serpentin_requise\n"""
          new_triggers = old_triggers + "          - sensor.pcha_motif_fonctionnement\n"
          if old_triggers not in text:
              raise SystemExit('Bloc triggers accueil introuvable')
          text = text.replace(old_triggers, new_triggers, 1)

          old_motif_anchor = """              const solaire = solaireActif ? 'Actif' : solaireRequis ? 'Requis' : 'Inactif';\n"""
          new_motif_anchor = old_motif_anchor + """              const motif = states['sensor.pcha_motif_fonctionnement']?.state ?? 'Indisponible';\n              const motifColor = motif.includes('PROTECTION') ? '#fb7185'\n                : motif.includes('CHAUFFAGE SOLAIRE') ? '#fbbf24'\n                : motif.includes('FILTRATION') ? '#22d3ee'\n                : motif.includes('MARCHE MINIMALE') ? '#a78bfa'\n                : motif.includes('STABILISATION') ? '#fbbf24'\n                : ['AUCUNE DEMANDE', 'ARRÊT'].includes(motif) ? '#94a3b8'\n                : '#c4b5fd';\n              const motifIcon = motif.includes('PROTECTION') ? 'mdi:shield-sun-outline'\n                : motif.includes('CHAUFFAGE SOLAIRE') ? 'mdi:white-balance-sunny'\n                : motif.includes('FILTRATION') ? 'mdi:water-pump'\n                : motif.includes('MARCHE MINIMALE') ? 'mdi:timer-sand'\n                : motif.includes('STABILISATION') ? 'mdi:progress-clock'\n                : 'mdi:source-branch';\n"""
          if old_motif_anchor not in text:
              raise SystemExit('Ancre JS accueil introuvable')
          text = text.replace(old_motif_anchor, new_motif_anchor, 1)

          old_pill = """                ${pill('mdi:play-circle-outline', 'Demande', demande ? 'Active' : 'Inactive', demande ? '#34d399' : '#94a3b8')}\n"""
          new_pill = old_pill + """                ${pill(motifIcon, 'Motif', motif, motifColor)}\n"""
          if old_pill not in text:
              raise SystemExit('Pilule Demande accueil introuvable')
          text = text.replace(old_pill, new_pill, 1)

          dashboard.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/pcha-patch-dashboard-motif.yml')
          workflow.unlink()
          PY

      - name: Valider le patch
        shell: bash
        run: |
          grep -q "sensor.pcha_motif_fonctionnement" dashboard/piscine.yaml
          git diff --check

      - name: Commit du dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/piscine.yaml .github/workflows/pcha-patch-dashboard-motif.yml
          git commit -m "Dashboard — afficher le motif de fonctionnement [dashboard-patched]"
          git push origin HEAD:agent/v3-motif-fonctionnement
