################################################################################
# Pool Controller Home Assistant (PCHA)
# SPEC-007 — Diagnostics V1.1
#
# Ce fichier est un package Home Assistant autonome.
#
# Entrées
#   binary_sensor.pcha_protection_serpentin_requise
#   input_boolean.pcha_fenetre_stabilisation_demarrage
#   input_boolean.pcha_parametres_materiel_initialises
#   input_number.pcha_puissance_pompe_max_normale
#   input_number.pcha_puissance_pompe_min_normale
#   input_number.pcha_seuil_debit_critique
#   input_number.pcha_seuil_debit_insuffisant
#   input_number.pcha_seuil_puissance_pompe_arretee
#   input_number.pcha_temps_arret_pompe_min
#   input_number.pcha_temps_validation_debit
#   input_number.pcha_temps_validation_luminosite
#   input_number.pcha_temps_validation_temperature_piscine
#   input_select.pcha_etat_machine
#   input_select.pcha_mode_de_fonctionnement
#   sensor.pcha_debit_filtration
#   sensor.pcha_luminosite
#   sensor.pcha_puissance_pompe_filtration
#   sensor.pcha_temperature_piscine
#   switch.pcha_commande_pompe_filtration
#
# Sorties
#   binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
#   binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
#   binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
#   binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
#   binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents
#   binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente
#   binary_sensor.pcha_diagnostic_pro_001_debit_critique
#   binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant
#   binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
#   sensor.pcha_analyse_coh_001
#   input_select.pcha_niveau_fonctionnement
#   événement pcha_diagnostic
################################################################################

################################################################################
# États des diagnostics
################################################################################

template:
  - binary_sensor:
      ##########################################################################
      # MES — Disponibilité des mesures
      ##########################################################################

      # MES-001 — Température bassin indisponible.
      - name: PCHA Diagnostic MES-001 Température bassin indisponible
        unique_id: pcha_diagnostic_mes_001_temperature_piscine_indisponible
        default_entity_id: binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
        device_class: problem
        icon: mdi:thermometer-alert
        delay_on: >
          {{ states('input_number.pcha_temps_validation_temperature_piscine') | int(30) }}
        delay_off: >
          {{ states('input_number.pcha_temps_validation_temperature_piscine') | int(30) }}
        state: >
          {{
            not (state_attr('sensor.pcha_temperature_piscine', 'source_available')
                 | bool(false))
          }}
        attributes:
          diagnostic_id: MES-001
          famille: MES
          gravite: DEGRADE
          rearmement: TEMPORISE
          motif: Température du bassin indisponible

      # MES-002 — Débit filtration indisponible.
      - name: PCHA Diagnostic MES-002 Débit indisponible
        unique_id: pcha_diagnostic_mes_002_debit_indisponible
        default_entity_id: binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
        device_class: problem
        icon: mdi:gauge-empty
        # Une coupure Wi-Fi brève ne doit ni arrêter durablement le système ni
        # imposer une intervention. La disparition et le retour doivent être
        # stables pendant une minute.
        delay_on: "00:01:00"
        delay_off: "00:01:00"
        state: >
          {{
            not (state_attr('sensor.pcha_debit_filtration', 'source_available')
                 | bool(false))
          }}
        attributes:
          diagnostic_id: MES-002
          famille: MES
          gravite: CRITIQUE
          rearmement: AUTOMATIQUE
          motif: Débit de filtration indisponible

      # MES-003 — Puissance pompe indisponible.
      - name: PCHA Diagnostic MES-003 Puissance indisponible
        unique_id: pcha_diagnostic_mes_003_puissance_indisponible
        default_entity_id: binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
        device_class: problem
        icon: mdi:flash-alert
        # Ignore les microcoupures de la prise connectée et exige une mesure
        # stable avant de refermer le diagnostic.
        delay_on: "00:01:00"
        delay_off: "00:00:10"
        state: >
          {{
            not (state_attr('sensor.pcha_puissance_pompe_filtration', 'source_available')
                 | bool(false))
          }}
        attributes:
          diagnostic_id: MES-003
          famille: MES
          gravite: DEGRADE
          rearmement: TEMPORISE
          motif: Puissance de la pompe indisponible

      # MES-004 — Chaîne de luminosité distante indisponible.
      # La mesure est produite par le BH1750 de la D1 mini, diffusée par Packet
      # Transport et reçue par l'ESP32 Jardin. Le délai filtre les pertes brèves.
      # Pendant la fenêtre de stabilisation, un état restauré ON est réarmé
      # immédiatement et aucune indisponibilité transitoire n'est publiée.
      - name: PCHA Diagnostic MES-004 Luminosité indisponible
        unique_id: pcha_diagnostic_mes_004_luminosite_indisponible
        default_entity_id: binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
        device_class: problem
        icon: mdi:sun-wireless
        delay_on: >
          {{ states('input_number.pcha_temps_validation_luminosite') | int(60) }}
        delay_off: >
          {% if is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') %}
            0
          {% else %}
            {{ states('input_number.pcha_temps_validation_luminosite') | int(60) }}
          {% endif %}
        state: >
          {% set stabilisation = is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') %}
          {% set liaison_ok = is_state('binary_sensor.pcha_liaison_luminosite_distante', 'on') %}
          {% set capteur_ok = is_state('binary_sensor.pcha_capteur_luminosite_distant_ok', 'on') %}
          {% set mesure_ok = state_attr('sensor.pcha_luminosite', 'source_coherent') | bool(false) %}
          {{ not stabilisation and not (liaison_ok and capteur_ok and mesure_ok) }}
        attributes:
          diagnostic_id: MES-004
          famille: MES
          gravite: DEGRADE
          rearmement: TEMPORISE
          motif: Chaîne de mesure de luminosité distante indisponible
          initialisation_demarrage: >
            {{ is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') }}
          cause: >
            {% if is_state('input_boolean.pcha_fenetre_stabilisation_demarrage', 'on') %}
              INITIALISATION_HOME_ASSISTANT
            {% elif not is_state('binary_sensor.pcha_liaison_luminosite_distante', 'on') %}
              LIAISON_PACKET_TRANSPORT
            {% elif not is_state('binary_sensor.pcha_capteur_luminosite_distant_ok', 'on') %}
              CAPTEUR_BH1750
            {% elif not state_attr('sensor.pcha_luminosite', 'source_numeric') | bool(false) %}
              MESURE_INDISPONIBLE
            {% elif not state_attr('sensor.pcha_luminosite', 'source_coherent') | bool(false) %}
              MESURE_HORS_LIMITES
            {% else %}
              AUCUNE
            {% endif %}
          liaison_packet_transport: >
            {{ states('binary_sensor.pcha_liaison_luminosite_distante') }}
          capteur_bh1750_ok: >
            {{ states('binary_sensor.pcha_capteur_luminosite_distant_ok') }}
          mesure_recue: >
            {{ state_attr('sensor.pcha_luminosite', 'source_value') }}
          strategie_secours: TEMPERATURE_EXTERIEURE_SUPERIEURE_DE_2C_AU_BASSIN

      ##########################################################################
      # COH — Cohérence des mesures validées
      ##########################################################################

      # COH-001 — Incohérence entre débit, puissance et commande de pompe.
      #
      # Aucune fenêtre supplémentaire n'est masquée après une transition de la
      # pompe. La condition brute est évaluée immédiatement et seul le délai
      # normal de validation débit (30 s par défaut) filtre un transitoire.
      # sensor.pcha_analyse_coh_001 expose en permanence la cause brute, les
      # mesures, la commande et tous les seuils utiles au diagnostic terrain.
      - name: PCHA Diagnostic COH-001 Débit puissance incohérents
        unique_id: pcha_diagnostic_coh_001_debit_puissance_incoherents
        default_entity_id: binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents
        device_class: problem
        icon: mdi:vector-difference-ab
        delay_on: >
          {{ [states('input_number.pcha_temps_validation_debit') | int(30), 30] | max }}
        delay_off: >
          {{ [states('input_number.pcha_temps_validation_debit') | int(30), 30] | max }}
        state: >
          {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
          {% set critique_cfg = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
          {% set normal_cfg = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
          {% set arret_cfg = states('input_number.pcha_seuil_puissance_pompe_arretee') | float(1) if init else 1 %}
          {% set pmin_cfg = states('input_number.pcha_puissance_pompe_min_normale') | float(300) if init else 300 %}
          {% set pmax_cfg = states('input_number.pcha_puissance_pompe_max_normale') | float(350) if init else 350 %}
          {% set profil_valide = critique_cfg > 0 and normal_cfg > critique_cfg and arret_cfg > 0 and pmin_cfg > arret_cfg and pmax_cfg > pmin_cfg %}
          {% set seuil_critique = critique_cfg if profil_valide else 500 %}
          {% set seuil_normal = normal_cfg if profil_valide else 3000 %}
          {% set seuil_arret = arret_cfg if profil_valide else 1 %}
          {% set puissance_min = pmin_cfg if profil_valide else 300 %}
          {% set puissance_max = pmax_cfg if profil_valide else 350 %}
          {% set debit_disponible = state_attr('sensor.pcha_debit_filtration', 'source_available') | bool(false) %}
          {% set puissance_disponible = state_attr('sensor.pcha_puissance_pompe_filtration', 'source_available') | bool(false) %}
          {% set commande = states('switch.pcha_commande_pompe_filtration') %}
          {% set commande_connue = commande in ['on', 'off'] %}
          {% set debit = states('sensor.pcha_debit_filtration') | float(0) %}
          {% set puissance = states('sensor.pcha_puissance_pompe_filtration') | float(0) %}
          {% set incoherence_marche =
               commande == 'on'
               and (
                 (debit >= seuil_critique and puissance < seuil_arret)
                 or (debit >= seuil_normal and not (puissance_min <= puissance <= puissance_max))
               ) %}
          {% set incoherence_arret =
               commande == 'off'
               and (puissance >= seuil_arret or debit >= seuil_critique) %}
          {{
            not profil_valide
            or (
              debit_disponible
              and puissance_disponible
              and commande_connue
              and not is_state('binary_sensor.pcha_diagnostic_mes_002_debit_indisponible', 'on')
              and not is_state('binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible', 'on')
              and (incoherence_marche or incoherence_arret)
            )
          }}
        attributes:
          diagnostic_id: COH-001
          famille: COH
          gravite: DEGRADE
          rearmement: TEMPORISE
          motif: Débit, puissance ou commande de pompe incohérents
          cause: >
            {{ states('sensor.pcha_analyse_coh_001') }}
          commande_pompe: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'commande_pompe') }}
          anciennete_commande_s: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'anciennete_commande_s') }}
          debit_l_h: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'debit_l_h') }}
          puissance_w: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'puissance_w') }}
          seuil_debit_critique_l_h: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'seuil_debit_critique_l_h') }}
          seuil_debit_normal_l_h: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'seuil_debit_normal_l_h') }}
          seuil_puissance_arret_w: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'seuil_puissance_arret_w') }}
          puissance_normale_min_w: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'puissance_normale_min_w') }}
          puissance_normale_max_w: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'puissance_normale_max_w') }}
          profil_seuils_valide: >
            {{ state_attr('sensor.pcha_analyse_coh_001', 'profil_seuils_valide') }}
          validation_s: >
            {{ states('input_number.pcha_temps_validation_debit') | int(30) }}

      # COH-002 — Température bassin hors de la plage physique stricte 10–50 °C.
      - name: PCHA Diagnostic COH-002 Température bassin incohérente
        unique_id: pcha_diagnostic_coh_002_temperature_piscine_incoherente
        default_entity_id: binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente
        device_class: problem
        icon: mdi:thermometer-alert
        delay_on: >
          {{ states('input_number.pcha_temps_validation_temperature_piscine') | int(30) }}
        delay_off: >
          {{ states('input_number.pcha_temps_validation_temperature_piscine') | int(30) }}
        state: >
          {% set temperature_disponible =
               state_attr('sensor.pcha_temperature_piscine', 'source_available')
               | bool(false) %}
          {% set source_coherente =
               state_attr('sensor.pcha_temperature_piscine', 'source_coherent')
               | bool(false) %}
          {% set corrigee_coherente =
               state_attr('sensor.pcha_temperature_piscine', 'corrected_value_coherent')
               | bool(false) %}
          {{
            temperature_disponible
            and not is_state(
              'binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible',
              'on'
            )
            and (not source_coherente or not corrigee_coherente)
          }}
        attributes:
          diagnostic_id: COH-002
          famille: COH
          gravite: DEGRADE
          rearmement: TEMPORISE
          motif: Mesure source ou température calibrée hors de la plage stricte 10–50 °C

      ##########################################################################
      # PRO — Anomalies du procédé
      ##########################################################################

      # Condition brute de PRO-001. Le diagnostic publié plus bas est mémorisé
      # jusqu'à une demande explicite de réarmement.
      - name: PCHA Condition PRO-001 Débit critique
        unique_id: pcha_condition_pro_001_debit_critique
        default_entity_id: binary_sensor.pcha_condition_pro_001_debit_critique
        device_class: problem
        icon: mdi:water-alert
        delay_on: >
          {{ [states('input_number.pcha_temps_validation_debit') | int(30), 30] | max }}
        delay_off: "00:00:00"
        state: >
          {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
          {% set critique_cfg = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
          {% set normal_cfg = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
          {% set seuil_critique = critique_cfg if critique_cfg > 0 and normal_cfg > critique_cfg else 500 %}
          {% set debit_disponible = state_attr('sensor.pcha_debit_filtration', 'source_available') | bool(false) %}
          {% set coh_configuration = is_state('sensor.pcha_analyse_coh_001', 'CONFIGURATION_SEUILS_INVALIDE') %}
          {{
            debit_disponible
            and not is_state('binary_sensor.pcha_diagnostic_mes_002_debit_indisponible', 'on')
            and (
              not is_state('binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents', 'on')
              or coh_configuration
            )
            and is_state('input_select.pcha_etat_machine', 'FILTRATION')
            and states('sensor.pcha_debit_filtration') | float(0) < seuil_critique
          }}
        attributes:
          role: CONDITION_INTERNE
          seuil_debit_critique_l_h: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
            {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
            {{ critique if critique > 0 and normal > critique else 500 }}

      # PRO-001 publié : le verrou reste actif après l'arrêt de la pompe. Cela
      # interdit les cycles arrêt/redémarrage en cas de tuyau percé, débranché,
      # d'aspiration bouchée ou de manque d'eau.
      - name: PCHA Diagnostic PRO-001 Débit critique
        unique_id: pcha_diagnostic_pro_001_debit_critique
        default_entity_id: binary_sensor.pcha_diagnostic_pro_001_debit_critique
        device_class: problem
        icon: mdi:water-alert
        state: >
          {{ is_state('input_boolean.pcha_verrou_pro_001', 'on') }}
        attributes:
          diagnostic_id: PRO-001
          famille: PRO
          gravite: CRITIQUE
          rearmement: MANUEL
          seuil_debit_critique_l_h: >
            {{ state_attr('binary_sensor.pcha_condition_pro_001_debit_critique', 'seuil_debit_critique_l_h') }}
          motif: >
            Débit de filtration inférieur à {{ state_attr('binary_sensor.pcha_condition_pro_001_debit_critique', 'seuil_debit_critique_l_h') }} L/h — inspection et réarmement requis

      # PRO-002 — Débit inférieur au seuil normal mais supérieur au seuil critique.
      - name: PCHA Diagnostic PRO-002 Débit insuffisant
        unique_id: pcha_diagnostic_pro_002_debit_insuffisant
        default_entity_id: binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant
        device_class: problem
        icon: mdi:water-minus
        delay_on: >
          {{ [states('input_number.pcha_temps_validation_debit') | int(30), 30] | max }}
        delay_off: >
          {{ [states('input_number.pcha_temps_validation_debit') | int(30), 30] | max }}
        state: >
          {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
          {% set critique_cfg = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
          {% set normal_cfg = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
          {% set profil_valide = critique_cfg > 0 and normal_cfg > critique_cfg %}
          {% set seuil_critique = critique_cfg if profil_valide else 500 %}
          {% set seuil_normal = normal_cfg if profil_valide else 3000 %}
          {% set debit_disponible = state_attr('sensor.pcha_debit_filtration', 'source_available') | bool(false) %}
          {% set debit = states('sensor.pcha_debit_filtration') | float(0) %}
          {% set coh_configuration = is_state('sensor.pcha_analyse_coh_001', 'CONFIGURATION_SEUILS_INVALIDE') %}
          {{
            debit_disponible
            and not is_state('binary_sensor.pcha_diagnostic_mes_002_debit_indisponible', 'on')
            and (
              not is_state('binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents', 'on')
              or coh_configuration
            )
            and not is_state('binary_sensor.pcha_diagnostic_pro_001_debit_critique', 'on')
            and is_state('input_select.pcha_etat_machine', 'FILTRATION')
            and seuil_critique <= debit < seuil_normal
          }}
        attributes:
          diagnostic_id: PRO-002
          famille: PRO
          gravite: DEGRADE
          rearmement: TEMPORISE
          seuil_debit_critique_l_h: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
            {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
            {{ critique if critique > 0 and normal > critique else 500 }}
          seuil_debit_normal_l_h: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
            {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
            {{ normal if critique > 0 and normal > critique else 3000 }}
          motif: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
            {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
            {% if critique <= 0 or normal <= critique %}
              Débit de filtration compris entre 500 et 3000 L/h
            {% else %}
              Débit de filtration compris entre {{ critique | round(0) }} et {{ normal | round(0) }} L/h
            {% endif %}

      # PRO-003 — Une protection solaire demandée ne peut pas être assurée.
      #
      # Sans mémoire supplémentaire, l'impossibilité exploitable en V1.1 est
      # établie lorsque le mode interdit la circulation, que l'actionneur est
      # indisponible ou qu'un diagnostic hydraulique critique est déjà actif.
      - name: PCHA Diagnostic PRO-003 Protection serpentin impossible
        unique_id: pcha_diagnostic_pro_003_protection_serpentin_impossible
        default_entity_id: binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
        device_class: problem
        icon: mdi:shield-sun-outline
        state: >
          {% set protection_requise =
               is_state('binary_sensor.pcha_protection_serpentin_requise', 'on') %}
          {% set mode_off =
               is_state('input_select.pcha_mode_de_fonctionnement', 'OFF') %}
          {% set mode_vidange =
               is_state('input_select.pcha_mode_de_fonctionnement', 'VIDANGE') %}
          {% set actionneur_indisponible =
               not has_value('switch.pcha_commande_pompe_filtration') %}
          {% set securite_hydraulique_indisponible =
               is_state(
                 'binary_sensor.pcha_diagnostic_mes_002_debit_indisponible',
                 'on'
               )
               or is_state(
                 'binary_sensor.pcha_diagnostic_pro_001_debit_critique',
                 'on'
               ) %}
          {{
            protection_requise
            and not mode_vidange
            and (
              mode_off
              or actionneur_indisponible
              or securite_hydraulique_indisponible
            )
          }}
        attributes:
          diagnostic_id: PRO-003
          famille: PRO
          gravite: CRITIQUE
          rearmement: AUTOMATIQUE
          motif: Protection du serpentin demandée mais circulation impossible

  ##########################################################################
  # Analyse instantanée de COH-001 — aucune temporisation
  ##########################################################################
  - sensor:
      - name: PCHA Analyse COH-001
        unique_id: pcha_analyse_coh_001
        default_entity_id: sensor.pcha_analyse_coh_001
        icon: mdi:stethoscope
        state: >
          {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
          {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
          {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
          {% set arret = states('input_number.pcha_seuil_puissance_pompe_arretee') | float(1) if init else 1 %}
          {% set pmin = states('input_number.pcha_puissance_pompe_min_normale') | float(300) if init else 300 %}
          {% set pmax = states('input_number.pcha_puissance_pompe_max_normale') | float(350) if init else 350 %}
          {% set profil_valide = critique > 0 and normal > critique and arret > 0 and pmin > arret and pmax > pmin %}
          {% set seuil_critique = critique if profil_valide else 500 %}
          {% set seuil_normal = normal if profil_valide else 3000 %}
          {% set seuil_arret = arret if profil_valide else 1 %}
          {% set puissance_min = pmin if profil_valide else 300 %}
          {% set puissance_max = pmax if profil_valide else 350 %}
          {% set debit = states('sensor.pcha_debit_filtration') | float(0) %}
          {% set puissance = states('sensor.pcha_puissance_pompe_filtration') | float(0) %}
          {% set commande = states('switch.pcha_commande_pompe_filtration') %}
          {% if not profil_valide %}
            CONFIGURATION_SEUILS_INVALIDE
          {% elif not state_attr('sensor.pcha_debit_filtration', 'source_available') | bool(false) %}
            DEBIT_INDISPONIBLE
          {% elif not state_attr('sensor.pcha_puissance_pompe_filtration', 'source_available') | bool(false) %}
            PUISSANCE_INDISPONIBLE
          {% elif commande not in ['on', 'off'] %}
            COMMANDE_INDISPONIBLE
          {% elif commande == 'off' and debit >= seuil_critique and puissance >= seuil_arret %}
            COMMANDE_OFF_DEBIT_ET_PUISSANCE_PRESENTS
          {% elif commande == 'off' and debit >= seuil_critique %}
            COMMANDE_OFF_DEBIT_PRESENT
          {% elif commande == 'off' and puissance >= seuil_arret %}
            COMMANDE_OFF_PUISSANCE_PRESENTE
          {% elif commande == 'on' and debit >= seuil_critique and puissance < seuil_arret %}
            COMMANDE_ON_DEBIT_PRESENT_PUISSANCE_ABSENTE
          {% elif commande == 'on' and debit >= seuil_normal and not (puissance_min <= puissance <= puissance_max) %}
            COMMANDE_ON_PUISSANCE_HORS_PLAGE
          {% else %}
            COHERENT
          {% endif %}
        attributes:
          commande_pompe: >
            {{ states('switch.pcha_commande_pompe_filtration') }}
          anciennete_commande_s: >
            {% if states('switch.pcha_commande_pompe_filtration') in ['on', 'off'] %}
              {{ (as_timestamp(now()) - as_timestamp(states.switch.pcha_commande_pompe_filtration.last_changed)) | round(0) }}
            {% else %}
              0
            {% endif %}
          debit_l_h: >
            {{ states('sensor.pcha_debit_filtration') }}
          debit_disponible: >
            {{ state_attr('sensor.pcha_debit_filtration', 'source_available') | bool(false) }}
          puissance_w: >
            {{ states('sensor.pcha_puissance_pompe_filtration') }}
          puissance_disponible: >
            {{ state_attr('sensor.pcha_puissance_pompe_filtration', 'source_available') | bool(false) }}
          profil_seuils_valide: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
            {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
            {% set arret = states('input_number.pcha_seuil_puissance_pompe_arretee') | float(1) if init else 1 %}
            {% set pmin = states('input_number.pcha_puissance_pompe_min_normale') | float(300) if init else 300 %}
            {% set pmax = states('input_number.pcha_puissance_pompe_max_normale') | float(350) if init else 350 %}
            {{ critique > 0 and normal > critique and arret > 0 and pmin > arret and pmax > pmin }}
          seuil_debit_critique_l_h: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
            {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
            {{ critique if critique > 0 and normal > critique else 500 }}
          seuil_debit_normal_l_h: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set critique = states('input_number.pcha_seuil_debit_critique') | float(500) if init else 500 %}
            {% set normal = states('input_number.pcha_seuil_debit_insuffisant') | float(3000) if init else 3000 %}
            {{ normal if critique > 0 and normal > critique else 3000 }}
          seuil_puissance_arret_w: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set arret = states('input_number.pcha_seuil_puissance_pompe_arretee') | float(1) if init else 1 %}
            {% set pmin = states('input_number.pcha_puissance_pompe_min_normale') | float(300) if init else 300 %}
            {{ arret if arret > 0 and pmin > arret else 1 }}
          puissance_normale_min_w: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set arret = states('input_number.pcha_seuil_puissance_pompe_arretee') | float(1) if init else 1 %}
            {% set pmin = states('input_number.pcha_puissance_pompe_min_normale') | float(300) if init else 300 %}
            {% set pmax = states('input_number.pcha_puissance_pompe_max_normale') | float(350) if init else 350 %}
            {{ pmin if arret > 0 and pmin > arret and pmax > pmin else 300 }}
          puissance_normale_max_w: >
            {% set init = is_state('input_boolean.pcha_parametres_materiel_initialises', 'on') %}
            {% set arret = states('input_number.pcha_seuil_puissance_pompe_arretee') | float(1) if init else 1 %}
            {% set pmin = states('input_number.pcha_puissance_pompe_min_normale') | float(300) if init else 300 %}
            {% set pmax = states('input_number.pcha_puissance_pompe_max_normale') | float(350) if init else 350 %}
            {{ pmax if arret > 0 and pmin > arret and pmax > pmin else 350 }}
          validation_coh001_s: >
            {{ [states('input_number.pcha_temps_validation_debit') | int(30), 30] | max }}
          seuils_bruts: >
            {{
              'debit_critique=' ~ states('input_number.pcha_seuil_debit_critique')
              ~ '; debit_normal=' ~ states('input_number.pcha_seuil_debit_insuffisant')
              ~ '; puissance_arret=' ~ states('input_number.pcha_seuil_puissance_pompe_arretee')
              ~ '; puissance_min=' ~ states('input_number.pcha_puissance_pompe_min_normale')
              ~ '; puissance_max=' ~ states('input_number.pcha_puissance_pompe_max_normale')
            }}

################################################################################
# Niveau global et événements
################################################################################

automation:
  - id: pcha_diagnostics_verrouiller_pro_001
    alias: PCHA - Diagnostics - Verrouiller PRO-001
    description: Mémorise tout débit critique validé jusqu'au réarmement manuel.
    initial_state: true
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.pcha_condition_pro_001_debit_critique
        to: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.pcha_verrou_pro_001

  - id: pcha_diagnostics_rearmer_pro_001
    alias: PCHA - Diagnostics - Réarmer PRO-001
    description: Autorise le réarmement uniquement pompe arrêtée, en mode OFF et débitmètre disponible.
    initial_state: true
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.pcha_rearmer_defaut_debit
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.pcha_mode_de_fonctionnement
                state: "OFF"
              - condition: state
                entity_id: switch.pcha_commande_pompe_filtration
                state: "off"
              - condition: template
                value_template: >
                  {{
                    state_attr('sensor.pcha_debit_filtration', 'source_available')
                    | bool(false)
                  }}
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.pcha_verrou_pro_001
              - action: persistent_notification.dismiss
                data:
                  notification_id: pcha_rearmement_pro_001_refuse
        default:
          - action: persistent_notification.create
            data:
              notification_id: pcha_rearmement_pro_001_refuse
              title: PCHA — Réarmement refusé
              message: >
                Placez le mode sur OFF, vérifiez l'arrêt réel de la pompe et
                attendez le retour stable du débitmètre avant de réarmer PRO-001.

  - id: pcha_diagnostics_recalculer_niveau_global
    alias: PCHA - Diagnostics - Recalculer le niveau global
    description: Publie la gravité la plus élevée parmi les diagnostics actifs.
    initial_state: true
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
          - binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
          - binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
          - binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
          - binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents
          - binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente
          - binary_sensor.pcha_diagnostic_pro_001_debit_critique
          - binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant
          - binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
    conditions: []
    actions:
      - wait_template: >
          {% set diagnostics = [
            'binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible',
            'binary_sensor.pcha_diagnostic_mes_002_debit_indisponible',
            'binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible',
            'binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible',
            'binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents',
            'binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente',
            'binary_sensor.pcha_diagnostic_pro_001_debit_critique',
            'binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant',
            'binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible'
          ] %}
          {% set ns = namespace(interfaces_valides=true) %}
          {% for entity_id in diagnostics %}
            {% if states(entity_id) in ['unknown', 'unavailable'] %}
              {% set ns.interfaces_valides = false %}
            {% endif %}
          {% endfor %}
          {{
            states('input_select.pcha_niveau_fonctionnement')
              not in ['unknown', 'unavailable']
            and ns.interfaces_valides
          }}
        timeout: "00:01:00"
        continue_on_timeout: false

      - variables:
          niveau_calcule: >
            {% set critiques = [
              'binary_sensor.pcha_diagnostic_mes_002_debit_indisponible',
              'binary_sensor.pcha_diagnostic_pro_001_debit_critique',
              'binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible'
            ] %}
            {% set degrades = [
              'binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible',
              'binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible',
              'binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible',
              'binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents',
              'binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente',
              'binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant'
            ] %}
            {% set ns = namespace(critique=false, degrade=false) %}
            {% for entity_id in critiques %}
              {% if is_state(entity_id, 'on') %}
                {% set ns.critique = true %}
              {% endif %}
            {% endfor %}
            {% for entity_id in degrades %}
              {% if is_state(entity_id, 'on') %}
                {% set ns.degrade = true %}
              {% endif %}
            {% endfor %}
            {% if ns.critique %}
              CRITIQUE
            {% elif ns.degrade %}
              DEGRADE
            {% else %}
              NORMAL
            {% endif %}

      - condition: template
        value_template: >
          {{
            states('input_select.pcha_niveau_fonctionnement')
              != niveau_calcule | trim
          }}

      - action: input_select.select_option
        target:
          entity_id: input_select.pcha_niveau_fonctionnement
        data:
          option: "{{ niveau_calcule | trim }}"

  - id: pcha_diagnostics_publier_evenement
    alias: PCHA - Diagnostics - Publier les changements
    description: Produit un événement unique à chaque activation ou disparition.
    initial_state: true
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
          - binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
          - binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
          - binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
          - binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents
          - binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente
          - binary_sensor.pcha_diagnostic_pro_001_debit_critique
          - binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant
          - binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
        to: "on"
      - trigger: state
        entity_id:
          - binary_sensor.pcha_diagnostic_mes_001_temperature_piscine_indisponible
          - binary_sensor.pcha_diagnostic_mes_002_debit_indisponible
          - binary_sensor.pcha_diagnostic_mes_003_puissance_indisponible
          - binary_sensor.pcha_diagnostic_mes_004_luminosite_indisponible
          - binary_sensor.pcha_diagnostic_coh_001_debit_puissance_incoherents
          - binary_sensor.pcha_diagnostic_coh_002_temperature_piscine_incoherente
          - binary_sensor.pcha_diagnostic_pro_001_debit_critique
          - binary_sensor.pcha_diagnostic_pro_002_debit_insuffisant
          - binary_sensor.pcha_diagnostic_pro_003_protection_serpentin_impossible
        from: "on"
        to: "off"
    conditions: []
    actions:
      - event: pcha_diagnostic
        event_data:
          diagnostic_id: >
            {{ state_attr(trigger.entity_id, 'diagnostic_id') }}
          famille: >
            {{ state_attr(trigger.entity_id, 'famille') }}
          gravite: >
            {{ state_attr(trigger.entity_id, 'gravite') }}
          etat: >
            {{ 'ACTIF' if trigger.to_state.state == 'on' else 'INACTIF' }}
          motif: >
            {{ state_attr(trigger.entity_id, 'motif') }}
          entity_id: "{{ trigger.entity_id }}"
