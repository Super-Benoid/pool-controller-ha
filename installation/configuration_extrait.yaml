################################################################################
# Pool Controller Home Assistant (PCHA)
# Extrait à fusionner dans /config/configuration.yaml
#
# Entrées
#   /config/packages/
#   pool-controller-ha/dashboard/validation-premium-concept-d-v3.yaml
#
# Sorties
#   Chargement des packages PCHA
#   Tableau de bord pcha-piscine
################################################################################

homeassistant:
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named pool-controller-ha/themes

lovelace:
  dashboards:
    pcha-piscine:
      mode: yaml
      filename: pool-controller-ha/dashboard/validation-premium-concept-d-v3.yaml
      title: Pool Controller
      icon: mdi:pool
      show_in_sidebar: true
